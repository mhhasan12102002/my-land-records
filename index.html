<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Signature Gold Admin v17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; color: #111827; }

        /* স্ক্রিন ডিজাইন */
        .glass-header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; font-size: 16px; outline: none; color: #1e293b; padding: 10px 0; }
        .input-box:focus { background: #eff6ff; border-radius: 8px; }

        /* প্রিন্ট ফিক্স - সম্পূর্ণ গাঢ় কালো লেখা */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .print-container { width: 100% !important; border: none !important; }
            table { width: 100% !important; border-collapse: collapse !important; border: 2.5px solid #000 !important; }
            th { border: 2px solid #000 !important; color: #000 !important; background: #f0f0f0 !important; font-size: 18px !important; padding: 12px 5px !important; white-space: nowrap; }
            td { border: 1.5px solid #000 !important; color: #000 !important; font-size: 16px !important; font-weight: 800 !important; padding: 10px 5px !important; }
            .p-total-row { border: 2.5px solid #000; border-top: none; padding: 15px; display: flex !important; justify-content: space-around; font-weight: 900; font-size: 18px; color: #000 !important; }
            .print-title { display: block !important; text-align: center; border-bottom: 2px solid #000; margin-bottom: 20px; padding-bottom: 10px; }
            .signature-box { display: flex !important; justify-content: space-between; margin-top: 70px; padding: 0 40px; }
            .sig-line { border-top: 2px solid #000; width: 180px; text-align: center; font-weight: 900; padding-top: 5px; }
            @page { size: A4 landscape; margin: 8mm; }
        }
        .print-title, .p-total-row, .signature-box { display: none; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="glass-header p-6 rounded-[30px] mb-8 flex flex-wrap justify-between items-center gap-4 no-print shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="h-14 w-14 bg-yellow-500 rounded-2xl flex items-center justify-center text-slate-900 font-black text-2xl shadow-inner">S</div>
                <div>
                    <h1 class="text-white text-xl font-black italic">SIGNATURE GOLD</h1>
                    <p class="text-yellow-500 text-[9px] font-bold uppercase tracking-[4px]">Elite Land Management</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-700 text-white p-3 rounded-2xl hover:bg-slate-600 transition">🖨️</button>
                <button onclick="saveImage('png')" class="bg-blue-600 text-white px-5 py-2.5 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition">SAVE PNG</button>
                <button onclick="saveImage('jpg')" class="bg-emerald-600 text-white px-5 py-2.5 rounded-2xl font-black text-xs shadow-lg active:scale-95 transition">SAVE JPG</button>
            </div>
        </div>

        <div id="masterReport" class="bg-white rounded-[32px] shadow-xl overflow-hidden print-container">
            <div class="print-title">
                <h1 style="font-size: 28px; font-weight: 900; margin-bottom: 5px;">জমির হিসাব ও বিক্রয় বিবরণী</h1>
                <p style="font-size: 14px; font-weight: 700;">তারিখ: <span id="printDate"></span></p>
            </div>

            <div class="p-6 bg-slate-50/50 border-b flex justify-between items-center no-print">
                <h2 class="text-lg font-black text-slate-700">দৈনিক হিসাব তালিকা</h2>
                <input type="date" id="dateControl" onchange="updateDate(this.value)" class="bg-white border-2 border-slate-200 rounded-xl px-4 py-2 font-bold text-blue-600 outline-none cursor-pointer">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center">
                    <thead class="bg-slate-900 text-white text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4 border-r border-slate-700 min-w-[180px]">ক্রেতার নাম</th>
                            <th class="p-4 border-r border-slate-700 w-28">জমি (গন্ডা)</th>
                            <th class="p-4 border-r border-slate-700 w-28">রেট</th>
                            <th class="p-4 border-r border-slate-700">মোট টাকা</th>
                            <th class="p-4 border-r border-slate-700 text-emerald-400">নগদ সংগ্রহ</th>
                            <th class="p-4 text-rose-400">বাকি টাকা</th>
                            <th class="p-4 no-print w-12">✕</th>
                        </tr>
                    </thead>
                    <tbody id="rowContainer" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>

            <div class="p-total-row">
                <span>মোট বিক্রি: <span id="pt1">0</span></span>
                <span>মোট নগদ: <span id="pt2">0</span></span>
                <span>মোট বাকি: <span id="pt3">0</span></span>
            </div>

            <div class="p-8 bg-slate-900 grid grid-cols-1 md:grid-cols-3 gap-4 no-print">
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">সর্বমোট বিক্রি</p>
                    <h3 id="sTotal" class="text-2xl font-black text-white">0</h3>
                </div>
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <p class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-1">সর্বমোট নগদ</p>
                    <h3 id="sCash" class="text-2xl font-black text-emerald-500">0</h3>
                </div>
                <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700">
                    <p class="text-[9px] font-bold text-rose-400 uppercase tracking-widest mb-1">সর্বমোট বাকি</p>
                    <h3 id="sDue" class="text-2xl font-black text-rose-500">0</h3>
                </div>
            </div>

            <div class="signature-box">
                <div class="sig-line">ক্রেতার স্বাক্ষর</div>
                <div class="sig-line">অ্যাডমিন স্বাক্ষর</div>
            </div>
        </div>

        <div class="mt-6 flex gap-3 no-print">
            <button onclick="addRow()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white p-5 rounded-2xl font-black shadow-xl transition-all active:scale-95 uppercase text-xs tracking-widest">+ কাস্টমার এন্ট্রি করুন</button>
            <button onclick="fullReset()" class="bg-white text-slate-400 hover:text-rose-500 px-6 rounded-2xl font-bold text-[10px] border border-slate-200 transition">Reset</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('gold_v17_db')) || [];
        let dVal = localStorage.getItem('gold_v17_date') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateControl').value = dVal;
            document.getElementById('printDate').innerText = dVal;
            if(db.length === 0) addRow(); else render();
        }

        function updateDate(v) { localStorage.setItem('gold_v17_date', v); location.reload(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function edit(id, k, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][k] = v;
            localStorage.setItem('gold_v17_db', JSON.stringify(db));
            calc();
        }

        function calc() {
            let t1=0, t2=0, t3=0;
            db.forEach(item => {
                const total = (parseFloat(item.j)||0) * (parseFloat(item.r)||0);
                const cash = parseFloat(item.a)||0;
                const due = total - cash;
                t1 += total; t2 += cash; t3 += due;

                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.c-total').innerText = total.toLocaleString();
                    row.querySelector('.c-due').innerText = due.toLocaleString();
                }
            });

            const ids = ['sTotal','sCash','sDue','pt1','pt2','pt3'];
            const vals = [t1, t2, t3, t1, t2, t3];
            ids.forEach((id, i) => document.getElementById(id).innerText = vals[i].toLocaleString() + " ৳");
        }

        function render() {
            const container = document.getElementById('rowContainer');
            container.innerHTML = '';
            db.forEach(item => {
                const total = (parseFloat(item.j)||0) * (parseFloat(item.r)||0);
                const due = total - (parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.className = "hover:bg-blue-50/30 transition-colors";
                tr.innerHTML = `
                    <td class="border-r border-slate-100"><input type="text" value="${item.n}" oninput="edit(${item.id},'n',this.value)" class="input-box" placeholder="নাম লিখুন"></td>
                    <td class="border-r border-slate-100"><input type="number" value="${item.j}" oninput="edit(${item.id},'j',this.value)" class="input-box" placeholder="0"></td>
                    <td class="border-r border-slate-100"><input type="number" value="${item.r}" oninput="edit(${item.id},'r',this.value)" class="input-box" placeholder="0"></td>
                    <td class="border-r border-slate-100 font-black text-blue-600 c-total text-lg">${total.toLocaleString()}</td>
                    <td class="border-r border-slate-100"><input type="number" value="${item.a}" oninput="edit(${item.id},'a',this.value)" class="input-box text-emerald-600" placeholder="0"></td>
                    <td class="font-black text-rose-600 c-due text-lg">${due.toLocaleString()}</td>
                    <td class="no-print"><button onclick="del(${item.id})" class="text-slate-300 hover:text-rose-500 px-3 transition">✕</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function del(id) { if(confirm('ডিলিট করবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('gold_v17_db', JSON.stringify(db)); render(); } }
        function fullReset() { if(confirm('সব ডাটা মুছে যাবে! নিশ্চিত?')) { db=[]; localStorage.removeItem('gold_v17_db'); addRow(); } }

        function saveImage(fmt) {
            const el = document.getElementById('masterReport');
            html2canvas(el, {
                scale: 4,
                backgroundColor: "#ffffff",
                useCORS: true,
                windowWidth: 1200
            }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Land_Admin_Record_${Date.now()}.${fmt}`;
                a.href = canvas.toDataURL(fmt === 'png' ? 'image/png' : 'image/jpeg', 1.0);
                a.click();
            });
        }

        init();
    </script>
</body>
</html>
