<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>HARVESTER PRO TITANIUM X | Premium Business OS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0c15;
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Animated Gradient Background */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: linear-gradient(125deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
    }
    
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Floating Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      z-index: 0;
      animation: float 20s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 50px) scale(1.1); }
    }
    
    .orb-1 { width: 400px; height: 400px; background: #3b82f6; top: -100px; left: -100px; animation-duration: 18s; }
    .orb-2 { width: 500px; height: 500px; background: #a855f7; bottom: -150px; right: -100px; animation-duration: 22s; }
    .orb-3 { width: 350px; height: 350px; background: #06b6d4; top: 50%; left: 50%; animation-duration: 25s; }
    
    /* Glassmorphism Container */
    .glass {
      background: rgba(15, 20, 35, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
    }
    
    .glass-card {
      background: rgba(20, 25, 45, 0.55);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 24px;
      transition: all 0.3s ease;
    }
    
    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.5);
      transform: translateY(-2px);
    }
    
    /* Premium Typography */
    .gradient-text {
      background: linear-gradient(135deg, #fff, #60a5fa, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }
    
    /* Record Cards - Compact */
    .record-item {
      background: rgba(25, 30, 50, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-left: 3px solid #3b82f6;
      transition: all 0.2s;
    }
    
    .record-item:active { transform: scale(0.98); }
    .due-critical { border-left-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    .due-warning { border-left-color: #f59e0b; background: rgba(245, 158, 11, 0.08); }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    
    /* Inputs */
    input, select {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px 16px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    
    button {
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:active { transform: scale(0.96); }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 24px;
      padding: 12px 20px;
      font-weight: 600;
      color: white;
      width: 100%;
    }
    
    .stat-box {
      background: rgba(15, 20, 35, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 12px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 28px;
      font-weight: 800;
    }
    
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      cursor: pointer;
      z-index: 100;
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center;
    }
    
    .modal-content {
      background: rgba(20, 25, 45, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      border: 1px solid #3b82f6;
    }
    
    /* Compact layout */
    .container-custom {
      max-width: 550px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
      z-index: 10;
      padding-bottom: 100px;
    }
    
    .records-list {
      max-height: 420px;
      overflow-y: auto;
    }
    
    @media (max-width: 480px) {
      .stat-value { font-size: 22px; }
      .container-custom { padding: 12px; padding-bottom: 90px; }
    }
  </style>
</head>
<body>

<!-- Animated Background -->
<div class="animated-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container-custom">
  
  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-black"><span class="gradient-text">HARVESTER PRO</span><span class="text-xs bg-white/10 px-2 py-1 rounded-full ml-2">Ti X</span></h1>
      <p class="text-white/40 text-xs mt-1"><i class="fas fa-crown text-yellow-500/60"></i> Premium Financial OS</p>
    </div>
    <div class="glass px-3 py-1.5 rounded-full text-[10px] font-bold"><i class="fas fa-bolt text-blue-400"></i> OFFLINE</div>
  </div>

  <!-- Stats Dashboard -->
  <div class="grid grid-cols-2 gap-3 mb-5">
    <div class="stat-box"><div class="stat-value text-cyan-300" id="totalGonda">0</div><div class="text-[10px] text-white/50">GONDA</div></div>
    <div class="stat-box"><div class="stat-value text-emerald-300" id="totalSales">0</div><div class="text-[10px] text-white/50">SALES (৳)</div></div>
    <div class="stat-box"><div class="stat-value text-blue-300" id="totalCash">0</div><div class="text-[10px] text-white/50">CASH</div></div>
    <div class="stat-box"><div class="stat-value text-rose-300" id="totalDue">0</div><div class="text-[10px] text-white/50">DUE</div></div>
  </div>

  <!-- Efficiency Card -->
  <div class="glass rounded-2xl p-4 mb-5 flex justify-between items-center">
    <div><span class="text-[10px] text-white/50">Collection Efficiency</span><div class="text-2xl font-bold" id="efficiency">0%</div></div>
    <div class="w-16 h-16"><canvas id="efficiencyChart" width="64" height="64"></canvas></div>
    <div class="text-right"><i class="fas fa-chart-line text-green-400"></i><div class="text-[10px] text-white/50" id="smartTip">Ready</div></div>
  </div>

  <!-- Form Panel -->
  <div class="glass-card p-4 mb-5">
    <input type="text" id="custName" placeholder="Customer Name *" class="w-full mb-3">
    <div class="grid grid-cols-2 gap-3 mb-3">
      <input type="number" id="gonda" value="0" step="1" placeholder="Gonda">
      <input type="number" id="rate" value="0" step="any" placeholder="Rate (৳)">
    </div>
    <div class="grid grid-cols-2 gap-3 mb-3">
      <input type="number" id="cash" value="0" step="any" placeholder="Cash Paid">
      <input type="text" id="duePreview" readonly placeholder="Due" class="bg-blue-900/30 border-blue-500/50 font-bold">
    </div>
    <div class="flex gap-2">
      <button class="btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save</button>
      <button class="bg-white/10 rounded-2xl px-4 hidden" id="cancelBtn">Cancel</button>
    </div>
  </div>

  <!-- Search & Filters -->
  <div class="flex gap-2 mb-3">
    <div class="flex-1 glass rounded-full flex items-center px-4"><i class="fas fa-search text-blue-400"></i><input type="text" id="search" placeholder="Search..." class="bg-transparent border-0 w-full py-3"></div>
    <button id="dueFilter" class="bg-rose-500/20 px-4 rounded-full text-sm border border-rose-500/30"><i class="fas fa-exclamation-triangle"></i> Due</button>
    <button id="resetFilter" class="bg-white/5 px-3 rounded-full"><i class="fas fa-undo"></i></button>
  </div>
  <div class="flex gap-2 mb-4">
    <input type="date" id="startDate" class="text-sm flex-1">
    <input type="date" id="endDate" class="text-sm flex-1">
    <button id="dateFilter" class="bg-blue-600/40 px-4 rounded-full text-sm"><i class="fas fa-calendar"></i> Go</button>
  </div>

  <!-- Tabs -->
  <div class="flex gap-3 mb-3 border-b border-white/10 pb-2">
    <button id="tabAll" class="text-sm font-semibold pb-2 border-b-2 border-blue-500 text-blue-300">All Records</button>
    <button id="tabDueList" class="text-sm font-semibold pb-2 text-white/50">Due Priority</button>
  </div>

  <!-- Records Container -->
  <div class="records-list" id="recordsContainer"></div>
</div>

<!-- FAB -->
<div class="fab" id="fab"><i class="fas fa-file-export text-white text-xl"></i></div>

<!-- Export Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold"><i class="fas fa-download text-blue-400"></i> Export</h3><span id="closeModal" class="text-2xl cursor-pointer">&times;</span></div>
    <button id="pdfExport" class="w-full bg-red-600 py-3 rounded-xl mb-2 font-semibold">📄 PDF Report</button>
    <button id="excelExport" class="w-full bg-green-700 py-3 rounded-xl mb-2 font-semibold">📊 Excel Sheet</button>
    <button id="jpgExport" class="w-full bg-purple-700 py-3 rounded-xl font-semibold">🖼️ JPG Image</button>
  </div>
</div>

<script>
  // ========== DATA ==========
  let records = [];
  let editId = null;
  let dueOnly = false;
  let activeTab = "all";
  let startDateVal = "", endDateVal = "";
  let efficiencyChart = null;

  // Load from localStorage
  function loadData() {
    let stored = localStorage.getItem("harvester_pro_titanium");
    if(stored) records = JSON.parse(stored);
    else records = [];
    renderAll();
  }

  function saveData() {
    localStorage.setItem("harvester_pro_titanium", JSON.stringify(records));
    renderAll();
  }

  // Calculate due preview
  function updateDue() {
    let g = parseFloat(document.getElementById('gonda').value) || 0;
    let r = parseFloat(document.getElementById('rate').value) || 0;
    let c = parseFloat(document.getElementById('cash').value) || 0;
    let total = g * r;
    let due = total - c > 0 ? total - c : 0;
    document.getElementById('duePreview').value = due.toFixed(2);
  }

  document.getElementById('gonda').addEventListener('input', updateDue);
  document.getElementById('rate').addEventListener('input', updateDue);
  document.getElementById('cash').addEventListener('input', updateDue);

  // Filter logic
  function getFiltered() {
    let filtered = [...records];
    let searchTerm = document.getElementById('search').value.toLowerCase();
    if(searchTerm) filtered = filtered.filter(r => r.name.toLowerCase().includes(searchTerm));
    if(dueOnly) filtered = filtered.filter(r => (r.gonda * r.rate - r.cash) > 0.5);
    if(startDateVal || endDateVal) {
      filtered = filtered.filter(r => {
        if(!r.date) return false;
        let d = r.date.split('T')[0];
        if(startDateVal && d < startDateVal) return false;
        if(endDateVal && d > endDateVal) return false;
        return true;
      });
    }
    if(activeTab === "due") {
      filtered = filtered.filter(r => (r.gonda * r.rate - r.cash) > 0);
      filtered.sort((a,b) => ((b.gonda*b.rate - b.cash) - (a.gonda*a.rate - a.cash)));
    } else {
      filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    }
    return filtered;
  }

  // Dashboard update
  function updateDashboard() {
    let totalG = 0, totalSales = 0, totalCash = 0, totalDue = 0;
    records.forEach(r => {
      totalG += r.gonda;
      let sale = r.gonda * r.rate;
      totalSales += sale;
      totalCash += r.cash;
      totalDue += (sale - r.cash > 0 ? sale - r.cash : 0);
    });
    document.getElementById('totalGonda').innerText = totalG;
    document.getElementById('totalSales').innerText = totalSales.toFixed(2);
    document.getElementById('totalCash').innerText = totalCash.toFixed(2);
    document.getElementById('totalDue').innerText = totalDue.toFixed(2);
    
    let efficiency = totalSales === 0 ? 0 : (totalCash / totalSales) * 100;
    document.getElementById('efficiency').innerText = efficiency.toFixed(1) + "%";
    
    if(efficiencyChart) {
      efficiencyChart.data.datasets[0].data = [efficiency, 100 - efficiency];
      efficiencyChart.update();
    }
    
    // Smart tip
    if(records.length > 0) {
      let maxDue = 0, maxName = "";
      records.forEach(r => { let d = (r.gonda * r.rate) - r.cash; if(d > maxDue) { maxDue = d; maxName = r.name; } });
      if(maxDue > 0) document.getElementById('smartTip').innerHTML = `<i class="fas fa-brain"></i> Collect from ${maxName}`;
      else document.getElementById('smartTip').innerHTML = `<i class="fas fa-check-circle"></i> All cleared!`;
    } else {
      document.getElementById('smartTip').innerHTML = "Add records to start";
    }
  }

  // Render records - COMPACT
  function renderRecords() {
    let container = document.getElementById('recordsContainer');
    let filtered = getFiltered();
    if(filtered.length === 0) {
      container.innerHTML = `<div class="glass rounded-2xl p-8 text-center text-white/50"><i class="fas fa-database text-3xl mb-2"></i><p>No records found</p></div>`;
      return;
    }
    let html = "";
    filtered.forEach(r => {
      let total = r.gonda * r.rate;
      let due = total - r.cash;
      let dueClass = due > 500 ? "due-critical" : (due > 0 ? "due-warning" : "");
      let dueBadge = due > 0 ? `<span class="bg-red-500/30 px-2 py-0.5 rounded-full text-[10px]">Due ৳${due.toFixed(2)}</span>` : `<span class="bg-emerald-500/20 px-2 py-0.5 rounded-full text-[10px]">Paid</span>`;
      html += `<div class="record-item ${dueClass}">
        <div class="flex justify-between items-start">
          <div><div class="font-bold text-sm"><i class="fas fa-user text-blue-300 mr-1"></i> ${escapeHtml(r.name)}</div>
          <div class="flex flex-wrap gap-2 text-[10px] text-white/60 mt-1">
            <span>${r.gonda} Gonda</span><span>@৳${r.rate}</span><span>Total ৳${total.toFixed(2)}</span><span>Cash ৳${r.cash.toFixed(2)}</span>${dueBadge}<span>${r.date?.split('T')[0] || '-'}</span>
          </div></div>
          <div class="flex gap-2"><button class="editBtn text-blue-300" data-id="${r.id}"><i class="fas fa-pen text-sm"></i></button><button class="deleteBtn text-rose-300" data-id="${r.id}"><i class="fas fa-trash text-sm"></i></button></div>
        </div>
      </div>`;
    });
    container.innerHTML = html;
    
    document.querySelectorAll('.editBtn').forEach(btn => {
      btn.addEventListener('click', (e) => { let id = btn.getAttribute('data-id'); startEdit(id); e.stopPropagation(); });
    });
    document.querySelectorAll('.deleteBtn').forEach(btn => {
      btn.addEventListener('click', (e) => { if(confirm("Delete?")) { records = records.filter(r => r.id != btn.getAttribute('data-id')); saveData(); } e.stopPropagation(); });
    });
  }

  function escapeHtml(str) { return str.replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

  function startEdit(id) {
    let rec = records.find(r => r.id == id);
    if(rec) {
      editId = id;
      document.getElementById('custName').value = rec.name;
      document.getElementById('gonda').value = rec.gonda;
      document.getElementById('rate').value = rec.rate;
      document.getElementById('cash').value = rec.cash;
      updateDue();
      document.getElementById('saveBtn').innerHTML = '<i class="fas fa-pen"></i> Update';
      document.getElementById('cancelBtn').classList.remove('hidden');
    }
  }

  function cancelEdit() {
    editId = null;
    document.getElementById('custName').value = '';
    document.getElementById('gonda').value = '0';
    document.getElementById('rate').value = '0';
    document.getElementById('cash').value = '0';
    updateDue();
    document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save';
    document.getElementById('cancelBtn').classList.add('hidden');
  }

  function isDuplicate(name, excludeId) {
    return records.some(r => r.name.toLowerCase().trim() === name.toLowerCase().trim() && r.id != excludeId);
  }

  function saveRecord() {
    let name = document.getElementById('custName').value.trim();
    if(!name) { alert("Customer name required"); return; }
    let gonda = parseFloat(document.getElementById('gonda').value) || 0;
    let rate = parseFloat(document.getElementById('rate').value) || 0;
    let cash = parseFloat(document.getElementById('cash').value) || 0;
    if(isDuplicate(name, editId)) { alert("Duplicate customer name!"); return; }
    let today = new Date().toISOString();
    if(editId) {
      let idx = records.findIndex(r => r.id == editId);
      if(idx !== -1) records[idx] = { ...records[idx], name, gonda, rate, cash, date: today };
      editId = null;
    } else {
      records.push({ id: Date.now().toString() + Math.random(), name, gonda, rate, cash, date: today });
    }
    saveData();
    cancelEdit();
  }

  function renderAll() { updateDashboard(); renderRecords(); }

  // ========== EXPORTS ==========
  async function exportPDF() {
    let filtered = getFiltered();
    let totalS = filtered.reduce((a,b)=>a+(b.gonda*b.rate),0);
    let totalC = filtered.reduce((a,b)=>a+b.cash,0);
    let { jsPDF } = window.jspdf;
    let doc = new jsPDF('l', 'mm', 'a4');
    doc.setFont('helvetica');
    doc.setFontSize(16);
    doc.text('HARVESTER PRO - FINANCIAL REPORT', 20, 20);
    doc.setFontSize(9);
    doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 30);
    let headers = [['Customer','Gonda','Rate','Total','Cash','Due','Date']];
    let rows = filtered.map(r => { let total = r.gonda * r.rate; let due = total - r.cash >0 ? total - r.cash : 0; return [r.name, r.gonda, r.rate, total.toFixed(2), r.cash.toFixed(2), due.toFixed(2), r.date?.split('T')[0]||''] });
    doc.autoTable({ head: headers, body: rows, startY: 40, theme: 'striped', headStyles: { fillColor: [37,99,235] } });
    let finalY = doc.lastAutoTable.finalY + 10;
    doc.text(`Total Sales: ৳${totalS.toFixed(2)} | Cash: ৳${totalC.toFixed(2)} | Due: ৳${(totalS-totalC).toFixed(2)}`, 20, finalY);
    doc.save('Harvester_Report.pdf');
  }

  function exportExcel() {
    let filtered = getFiltered();
    let sheet = [["Customer","Gonda","Rate","Total (৳)","Cash (৳)","Due (৳)","Date"]];
    filtered.forEach(r => { let total = r.gonda * r.rate; let due = total - r.cash >0 ? total - r.cash : 0; sheet.push([r.name, r.gonda, r.rate, total, r.cash, due, r.date?.split('T')[0]||'']); });
    let ws = XLSX.utils.aoa_to_sheet(sheet);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "HarvesterPro");
    XLSX.writeFile(wb, `Harvester_${Date.now()}.xlsx`);
  }

  async function exportJPG() {
    let filtered = getFiltered();
    let totalS = filtered.reduce((a,b)=>a+(b.gonda*b.rate),0);
    let totalC = filtered.reduce((a,b)=>a+b.cash,0);
    let div = document.createElement('div');
    div.style.position = 'absolute';
    div.style.left = '-9999px';
    div.style.top = '0';
    div.style.background = '#0a0c15';
    div.style.color = 'white';
    div.style.padding = '30px';
    div.style.width = '800px';
    div.style.fontFamily = "Inter, sans-serif";
    div.innerHTML = `<h1 style="color:#60a5fa;">HARVESTER PRO TITANIUM X</h1><hr/><table style="width:100%; margin-top:20px;">${filtered.map(r=>{let total=r.gonda*r.rate; let due=total-r.cash; return `<tr><td>${r.name}</td><td>${r.gonda} G</td><td>৳${r.rate}</td><td>৳${total.toFixed(2)}</td><td>৳${r.cash}</td><td>Due: ${due>0?due.toFixed(2):0}</td></tr>`}).join('')}</table><div style="background:#1e293b; margin-top:20px; padding:15px;">Total Sales: ৳${totalS.toFixed(2)} | Cash: ৳${totalC.toFixed(2)} | Due: ৳${(totalS-totalC).toFixed(2)}</div>`;
    document.body.appendChild(div);
    let canvas = await html2canvas(div, { scale: 2 });
    let link = document.createElement('a');
    link.download = `Harvester_${Date.now()}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
    document.body.removeChild(div);
  }

  // ========== EVENT LISTENERS ==========
  document.getElementById('saveBtn').addEventListener('click', saveRecord);
  document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
  document.getElementById('dueFilter').addEventListener('click', () => { dueOnly = !dueOnly; document.getElementById('dueFilter').classList.toggle('bg-rose-500/40'); renderRecords(); });
  document.getElementById('resetFilter').addEventListener('click', () => { dueOnly = false; document.getElementById('search').value = ''; startDateVal = ''; endDateVal = ''; document.getElementById('startDate').value = ''; document.getElementById('endDate').value = ''; document.getElementById('dueFilter').classList.remove('bg-rose-500/40'); activeTab = "all"; document.getElementById('tabAll').click(); renderRecords(); });
  document.getElementById('dateFilter').addEventListener('click', () => { startDateVal = document.getElementById('startDate').value; endDateVal = document.getElementById('endDate').value; renderRecords(); });
  document.getElementById('search').addEventListener('input', () => renderRecords());
  document.getElementById('tabAll').addEventListener('click', () => { activeTab = "all"; document.getElementById('tabAll').classList.add('border-blue-500','text-blue-300'); document.getElementById('tabDueList').classList.remove('border-blue-500','text-blue-300'); renderRecords(); });
  document.getElementById('tabDueList').addEventListener('click', () => { activeTab = "due"; document.getElementById('tabDueList').classList.add('border-blue-500','text-blue-300'); document.getElementById('tabAll').classList.remove('border-blue-500','text-blue-300'); renderRecords(); });
  
  // Efficiency Chart
  let ctx = document.getElementById('efficiencyChart').getContext('2d');
  efficiencyChart = new Chart(ctx, { type: 'doughnut', data: { datasets: [{ data: [0, 100], backgroundColor: ['#3b82f6', '#1e293b'], borderWidth: 0, cutout: '70%' }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } } });
  
  // Modal
  let modal = document.getElementById('modal');
  document.getElementById('fab').onclick = () => modal.style.display = 'flex';
  document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
  window.onclick = (e) => { if(e.target === modal) modal.style.display = 'none'; };
  document.getElementById('pdfExport').onclick = () => { modal.style.display = 'none'; exportPDF(); };
  document.getElementById('excelExport').onclick = () => { modal.style.display = 'none'; exportExcel(); };
  document.getElementById('jpgExport').onclick = () => { modal.style.display = 'none'; exportJPG(); };
  
  // GSAP Intro Animation
  gsap.from('.glass, .glass-card, .stat-box', { opacity: 0, y: 20, duration: 0.5, stagger: 0.08 });
  
  loadData();
</script>
</body>
</html>
