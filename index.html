<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, initial-scale=1.0">
  <title>Harvester Pro | Cinematic Business Suite</title>
  <!-- TailwindCSS + Core Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- GSAP, Chart.js, html2canvas, jsPDF, SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', 'Hind Siliguri', sans-serif; overflow-x: hidden; background: #050B14; }
    /* Aurora + Particle Canvas */
    #aurora-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .glass-premium { background: rgba(12, 20, 35, 0.55); backdrop-filter: blur(16px); border: 1px solid rgba(66, 153, 225, 0.25); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5); }
    .card-glow { transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
    .card-glow:hover { transform: translateY(-2px); border-color: rgba(59,130,246,0.6); box-shadow: 0 25px 35px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.2); }
    .stat-card { backdrop-filter: blur(12px); transition: transform 0.2s; cursor: pointer; }
    .stat-card:active { transform: scale(0.96); }
    .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0); animation: rippleAnim 0.5s linear; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
    .due-highlight { background: linear-gradient(95deg, rgba(220,38,38,0.2), rgba(185,28,28,0.1)); border-left: 4px solid #ef4444; }
    .scrollbar-hide::-webkit-scrollbar { width: 3px; }
    .scrollbar-hide::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 10px; }
    .scrollbar-hide::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    .fab-btn { background: linear-gradient(135deg, #2563eb, #1e40af); box-shadow: 0 8px 20px rgba(37,99,235,0.4); transition: all 0.2s; }
    .fab-btn:active { transform: scale(0.92); }
    input, select { transition: all 0.2s; }
    input:focus { transform: scale(1.01); border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
    .modal-glass { background: rgba(5, 15, 30, 0.95); backdrop-filter: blur(20px); border: 1px solid #3b82f6; animation: modalPop 0.3s cubic-bezier(0.34, 1.2, 0.64, 1); }
    @keyframes modalPop { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .record-item { transition: all 0.2s ease; cursor: pointer; }
    .record-item:active { transform: scale(0.99); background: rgba(20, 35, 55, 0.9); }
    .gradient-text { background: linear-gradient(115deg, #fff, #7ac7ff, #3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body class="text-white overflow-x-hidden">

  <canvas id="aurora-bg"></canvas>
  <div id="particles-container" class="fixed inset-0 pointer-events-none z-0"></div>

  <div class="relative z-10 max-w-5xl mx-auto px-4 pb-28 pt-6 md:pt-8">
    <!-- Header Cinematic -->
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
      <div>
        <h1 class="text-3xl md:text-4xl font-black tracking-tight"><span class="gradient-text">HARVESTER PRO</span> <span class="text-xs bg-white/10 px-3 py-1 rounded-full ml-2">V33</span></h1>
        <p class="text-white/50 text-sm mt-1">সিনেমাটিক বিজনেস স্যুট | অফলাইন পাওয়ার</p>
      </div>
      <div class="bg-white/5 backdrop-blur-sm px-4 py-2 rounded-2xl border border-white/10">
        <i class="fas fa-chart-line text-blue-400"></i> <span class="text-sm font-semibold">প্রিমিয়াম SaaS</span>
      </div>
    </div>

    <!-- Dashboard Analytics Grid + Chart -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6">
      <div class="stat-card glass-premium rounded-2xl p-4 text-center" id="statGonda"><div class="text-2xl md:text-3xl font-black text-cyan-300" id="totalGonda">0</div><div class="text-[11px] uppercase tracking-wider opacity-70"><i class="fas fa-cubes mr-1"></i> গোন্ডা</div></div>
      <div class="stat-card glass-premium rounded-2xl p-4 text-center" id="statSales"><div class="text-2xl md:text-3xl font-black text-emerald-300" id="totalSales">0</div><div class="text-[11px] uppercase tracking-wider opacity-70"><i class="fas fa-chart-simple"></i> মোট বিক্রয়</div></div>
      <div class="stat-card glass-premium rounded-2xl p-4 text-center" id="statCash"><div class="text-2xl md:text-3xl font-black text-blue-300" id="totalCash">0</div><div class="text-[11px] uppercase tracking-wider opacity-70"><i class="fas fa-hand-holding-usd"></i> নগদ আদায়</div></div>
      <div class="stat-card glass-premium rounded-2xl p-4 text-center" id="statDue"><div class="text-2xl md:text-3xl font-black text-rose-300" id="totalDue">0</div><div class="text-[11px] uppercase tracking-wider opacity-70"><i class="fas fa-clock"></i> বাকি</div></div>
    </div>

    <!-- Collection Efficiency + Mini Chart -->
    <div class="glass-premium rounded-3xl p-4 mb-6 flex flex-wrap items-center justify-between gap-3">
      <div><span class="text-xs opacity-60"><i class="fas fa-chart-pie"></i> কালেকশন দক্ষতা</span><div class="text-2xl font-black" id="efficiencyPercent">0%</div></div>
      <div class="w-28 h-12"><canvas id="efficiencyGauge" class="w-full h-full"></canvas></div>
      <div class="bg-white/5 px-3 py-1 rounded-full text-xs"><i class="fas fa-chart-line text-green-400"></i> রিয়েল-টাইম এনালাইটিক্স</div>
    </div>

    <!-- Form & Core Actions -->
    <div class="glass-premium rounded-3xl p-5 mb-6 transition-all" id="formCard">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3"><input type="text" id="custName" placeholder="ক্রেতার নাম *" class="bg-black/40 border border-white/20 rounded-2xl px-4 py-3 text-white outline-none w-full"></div>
      <div class="grid grid-cols-2 gap-3 mb-3"><input type="number" id="gondaQty" value="0" step="1" class="bg-black/40 border border-white/20 rounded-2xl px-4 py-3 text-white outline-none"><input type="number" id="rateVal" value="0" step="any" class="bg-black/40 border border-white/20 rounded-2xl px-4 py-3 text-white outline-none"></div>
      <div class="grid grid-cols-2 gap-3 mb-4"><input type="number" id="cashPaid" value="0" step="any" class="bg-black/40 border border-white/20 rounded-2xl px-4 py-3 text-white outline-none"><input type="text" id="dueAuto" readonly class="bg-blue-900/40 border border-blue-500/50 rounded-2xl px-4 py-3 text-white font-bold"></div>
      <div class="flex gap-3"><button id="saveBtn" class="bg-gradient-to-r from-blue-600 to-indigo-700 py-3 rounded-2xl font-bold w-full text-white shadow-lg transition-all"><i class="fas fa-save mr-2"></i> সংরক্ষণ</button><button id="editCancelBtn" class="bg-white/10 border border-white/20 py-3 rounded-2xl w-28 hidden">বাতিল</button></div>
    </div>

    <!-- Search, Filters, Due Toggle -->
    <div class="flex flex-wrap gap-3 mb-5">
      <div class="flex-1 bg-black/30 backdrop-blur-sm rounded-full flex items-center px-4 border border-white/10"><i class="fas fa-search text-blue-300"></i><input type="text" id="searchInput" placeholder="ক্রেতা খুঁজুন ..." class="bg-transparent p-3 w-full outline-none text-sm"></div>
      <button id="dueOnlyToggle" class="bg-rose-500/20 px-5 rounded-full text-sm font-semibold border border-rose-500/40 flex items-center gap-2"><i class="fas fa-exclamation-circle"></i> শুধু বাকি</button>
      <button id="resetFilters" class="bg-white/5 px-5 rounded-full text-sm"><i class="fas fa-undo-alt"></i></button>
    </div>
    <div class="flex gap-3 mb-5 flex-wrap"><input type="date" id="startDate" class="bg-black/40 border border-white/20 rounded-full px-4 py-2 text-sm"><input type="date" id="endDate" class="bg-black/40 border border-white/20 rounded-full px-4 py-2 text-sm"><button id="applyDateFilter" class="bg-blue-600/40 px-5 rounded-full text-sm"><i class="fas fa-calendar"></i> ফিল্টার</button></div>

    <!-- Tabs: All Records & Due Collection -->
    <div class="flex gap-2 mb-4 border-b border-white/10"><button id="tabAll" class="py-2 px-5 text-sm font-semibold border-b-2 border-blue-500 text-blue-300">সমস্ত লেনদেন</button><button id="tabDue" class="py-2 px-5 text-sm font-semibold text-white/60">বাকি সংগ্রহ তালিকা</button></div>

    <!-- Records + Due List Container -->
    <div id="recordsContainer" class="space-y-3 max-h-[420px] overflow-y-auto scrollbar-hide pr-1"></div>
  </div>

  <!-- Floating Action Button + Export Modal -->
  <div class="fab-btn fixed bottom-6 right-5 w-14 h-14 rounded-full flex items-center justify-center shadow-2xl z-50 cursor-pointer" id="fabExport"><i class="fas fa-file-export text-2xl"></i></div>
  <div id="exportModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 hidden justify-center items-center"><div class="modal-glass rounded-3xl p-6 w-11/12 max-w-md"><div class="flex justify-between mb-4"><h3 class="text-xl font-bold"><i class="fas fa-download"></i> এক্সপোর্ট সেন্টার</h3><span id="closeModalBtn" class="text-2xl cursor-pointer">&times;</span></div><button id="pdfExportBtn" class="w-full bg-gradient-to-r from-red-600 to-red-800 py-3 rounded-xl mb-3 font-bold">📄 PDF (অ্যাকাউন্টিং)</button><button id="excelExportBtn" class="w-full bg-gradient-to-r from-green-700 to-emerald-800 py-3 rounded-xl mb-3 font-bold">📊 এক্সেল (প্রফেশনাল)</button><button id="jpgExportBtn" class="w-full bg-gradient-to-r from-purple-700 to-fuchsia-800 py-3 rounded-xl font-bold">🖼️ JPG (রিপোর্ট ইমেজ)</button></div></div>

  <script>
    // ---------- GLOBAL STATE ----------
    let records = [];
    let editId = null;
    let dueOnlyActive = false;
    let activeTab = "all"; // "all" or "dueCollection"
    let startDateFilter = "", endDateFilter = "";
    let efficiencyChart = null;

    // DOM Elements
    const loadData = () => { const stored = localStorage.getItem("harvester_pro_cinema"); if(stored) records = JSON.parse(stored); else records = []; renderEverything(); };
    const saveLocal = () => { localStorage.setItem("harvester_pro_cinema", JSON.stringify(records)); renderEverything(); };

    const computeDue = (g, r, c) => { let total = g * r; let due = total - c; return due > 0 ? due : 0; };
    const updateDueFieldManual = () => { let g = +document.getElementById('gondaQty').value || 0; let r = +document.getElementById('rateVal').value || 0; let c = +document.getElementById('cashPaid').value || 0; document.getElementById('dueAuto').value = computeDue(g,r,c).toFixed(2); };
    document.getElementById('gondaQty').addEventListener('input', updateDueFieldManual);
    document.getElementById('rateVal').addEventListener('input', updateDueFieldManual);
    document.getElementById('cashPaid').addEventListener('input', updateDueFieldManual);

    // Filter logic
    function getFiltered() {
      let filtered = [...records];
      const search = document.getElementById('searchInput').value.toLowerCase();
      if(search) filtered = filtered.filter(r => r.name.toLowerCase().includes(search));
      if(dueOnlyActive) filtered = filtered.filter(r => (r.gonda * r.rate - r.cash) > 0.01);
      if(startDateFilter || endDateFilter) filtered = filtered.filter(r => { if(!r.date) return false; let d = r.date.split('T')[0]; if(startDateFilter && d < startDateFilter) return false; if(endDateFilter && d > endDateFilter) return false; return true; });
      if(activeTab === "dueCollection") filtered = filtered.filter(r => (r.gonda * r.rate - r.cash) > 0.01).sort((a,b) => ((b.gonda*b.rate - b.cash) - (a.gonda*a.rate - a.cash)));
      return filtered;
    }

    // Dashboard Render + efficiency
    function renderDashboard() {
      let totalG = 0, totalSales = 0, totalCashVal = 0, totalDueVal = 0;
      records.forEach(r => { totalG += r.gonda; let sale = r.gonda * r.rate; totalSales += sale; totalCashVal += r.cash; totalDueVal += (sale - r.cash > 0 ? sale - r.cash : 0); });
      document.getElementById('totalGonda').innerText = totalG;
      document.getElementById('totalSales').innerText = totalSales.toFixed(2);
      document.getElementById('totalCash').innerText = totalCashVal.toFixed(2);
      document.getElementById('totalDue').innerText = totalDueVal.toFixed(2);
      let efficiency = totalSales === 0 ? 0 : ((totalCashVal / totalSales) * 100);
      document.getElementById('efficiencyPercent').innerText = efficiency.toFixed(1) + "%";
      if(efficiencyChart) efficiencyChart.data.datasets[0].data = [efficiency, 100-efficiency]; efficiencyChart?.update();
    }

    // Record Rendering (Ultra optimized)
    function renderRecords() {
      const container = document.getElementById('recordsContainer');
      const filtered = getFiltered();
      if(filtered.length === 0) { container.innerHTML = `<div class="glass-premium rounded-2xl p-10 text-center opacity-70"><i class="fas fa-inbox text-3xl mb-2 block"></i> কোন তথ্য নেই</div>`; return; }
      let html = '';
      filtered.forEach(rec => {
        let totalVal = rec.gonda * rec.rate;
        let due = totalVal - rec.cash;
        let dueCls = due > 0 ? "border-l-4 border-red-500 bg-red-500/5" : "";
        let dueBadge = due > 0 ? `<span class="bg-red-500/30 text-red-200 px-2 py-0.5 rounded-full text-[11px]"><i class="fas fa-exclamation-circle"></i> বাকি ৳${due.toFixed(2)}</span>` : `<span class="text-emerald-300 text-[11px]"><i class="fas fa-check-circle"></i> পরিশোধিত</span>`;
        html += `
          <div class="glass-premium rounded-2xl p-4 record-item transition-all ${dueCls}">
            <div class="flex justify-between items-start flex-wrap">
              <div><div class="font-bold text-base">${escapeHtml(rec.name)}</div>
              <div class="flex flex-wrap gap-3 text-xs mt-1 opacity-70"><span><i class="fas fa-cubes"></i> ${rec.gonda} গোন্ডা</span><span><i class="fas fa-tag"></i> ৳${rec.rate}</span><span><i class="fas fa-chart-line"></i> মোট ৳${totalVal.toFixed(2)}</span><span><i class="fas fa-wallet"></i> নগদ ৳${rec.cash.toFixed(2)}</span>${dueBadge}<span><i class="far fa-calendar"></i> ${rec.date?.split('T')[0] || 'N/A'}</span></div></div>
              <div class="flex gap-3 mt-2 sm:mt-0"><button class="editBtn text-blue-300 text-lg" data-id="${rec.id}"><i class="fas fa-pen"></i></button><button class="deleteBtn text-rose-300 text-lg" data-id="${rec.id}"><i class="fas fa-trash"></i></button></div>
            </div>
          </div>`;
      });
      container.innerHTML = html;
      document.querySelectorAll('.editBtn').forEach(btn => btn.addEventListener('click', (e) => { let id = btn.getAttribute('data-id'); startEdit(id); e.stopPropagation(); }));
      document.querySelectorAll('.deleteBtn').forEach(btn => btn.addEventListener('click', (e) => { if(confirm("মুছে ফেলবেন?")) { records = records.filter(r => r.id != btn.getAttribute('data-id')); saveLocal(); } e.stopPropagation(); }));
    }

    function startEdit(id) { const rec = records.find(r => r.id == id); if(rec) { editId = id; document.getElementById('custName').value = rec.name; document.getElementById('gondaQty').value = rec.gonda; document.getElementById('rateVal').value = rec.rate; document.getElementById('cashPaid').value = rec.cash; updateDueFieldManual(); document.getElementById('saveBtn').innerHTML = '<i class="fas fa-pen"></i> আপডেট'; document.getElementById('editCancelBtn').style.display = 'block'; gsap.fromTo('#formCard', {y:8, opacity:0.9},{y:0, opacity:1, duration:0.3}); } }
    function resetForm() { editId = null; document.getElementById('custName').value = ''; document.getElementById('gondaQty').value = '0'; document.getElementById('rateVal').value = '0'; document.getElementById('cashPaid').value = '0'; updateDueFieldManual(); document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> সংরক্ষণ'; document.getElementById('editCancelBtn').style.display = 'none'; }
    function isDuplicate(name, excludeId) { return records.some(r => r.name.toLowerCase().trim() === name.toLowerCase().trim() && r.id != excludeId); }
    function saveHandler() { let name = document.getElementById('custName').value.trim(); if(!name) { alert("ক্রেতার নাম দিন"); return; } let gonda = +document.getElementById('gondaQty').value || 0; let rate = +document.getElementById('rateVal').value || 0; let cash = +document.getElementById('cashPaid').value || 0; if(isDuplicate(name, editId)) { alert("ডুপ্লিকেট এন্ট্রি: এই নাম আগে আছে!"); return; } let today = new Date().toISOString(); if(editId) { let idx = records.findIndex(r => r.id == editId); if(idx !== -1) records[idx] = { ...records[idx], name, gonda, rate, cash, date: today }; editId = null; } else { records.push({ id: Date.now().toString() + Math.random(), name, gonda, rate, cash, date: today }); } saveLocal(); resetForm(); }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function renderEverything() { renderDashboard(); renderRecords(); }

    // EXPORT CENTER (Corporate)
    async function exportPDF() { const filtered = getFiltered(); let totalS = filtered.reduce((a,b)=>a+(b.gonda*b.rate),0), totalC = filtered.reduce((a,b)=>a+b.cash,0), totalD = totalS - totalC; const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4'); doc.setFont('helvetica'); doc.setFontSize(18); doc.text('HARVESTER PRO FINANCIAL REPORT', 20, 20); doc.setFontSize(10); doc.text(`Date: ${new Date().toLocaleString('bn')}`, 20, 30); let finalY = 40; const headers = ['Customer', 'Gonda', 'Rate', 'Total', 'Cash', 'Due', 'Date']; let rows = filtered.map(r => { let total = r.gonda * r.rate; let due = total - r.cash; if(due<0) due=0; return [r.name, r.gonda.toString(), r.rate.toString(), total.toFixed(2), r.cash.toFixed(2), due.toFixed(2), r.date?.split('T')[0]||''] }); doc.autoTable({ head: [headers], body: rows, startY: finalY, theme: 'striped', headStyles: { fillColor: [37,99,235] } }); let finalYTable = doc.lastAutoTable.finalY + 10; doc.setFontSize(12); doc.text(`📊 Summary | Total Sales: ৳${totalS.toFixed(2)}  Cash: ৳${totalC.toFixed(2)}  Due: ৳${totalD>0?totalD.toFixed(2):0}`, 20, finalYTable); doc.save('Harvester_Report.pdf'); }
    function exportExcel() { let filtered = getFiltered(); let sheet = [["ক্রেতার নাম","গোন্ডা","দর","মোট (৳)","নগদ (৳)","বাকি (৳)","তারিখ"]]; filtered.forEach(r => { let ttl=r.gonda*r.rate; let due=ttl - r.cash; if(due<0)due=0; sheet.push([r.name, r.gonda, r.rate, ttl, r.cash, due, r.date?.split('T')[0]||'']); }); const ws = XLSX.utils.aoa_to_sheet(sheet); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "HarvesterPro"); XLSX.writeFile(wb, `harvester_${Date.now()}.xlsx`); }
    async function exportJPG() { let filtered = getFiltered(); let totalS = filtered.reduce((a,b)=>a+(b.gonda*b.rate),0), totalC = filtered.reduce((a,b)=>a+b.cash,0), totalD = totalS - totalC; let div = document.createElement('div'); div.style.position='absolute'; div.style.left='-9999px'; div.style.background='#0B1120'; div.style.color='white'; div.style.padding='28px'; div.style.width='800px'; div.style.fontFamily='Inter, sans-serif'; div.innerHTML = `<h1 style="color:#60A5FA;">🌾 HARVESTER PRO - FINANCIAL SNAPSHOT</h1><hr/><table style="width:100%; border-collapse:collapse; margin-top:20px;">${filtered.map(r=>{let ttl=r.gonda*r.rate; let due=ttl-r.cash; return `<tr><td style="padding:8px; border-bottom:1px solid #334155;">${r.name}</td><td>${r.gonda} G</td><td>৳${r.rate}</td><td>৳${ttl.toFixed(2)}</td><td>৳${r.cash}</td><td style="color:#f87171;">Due: ${due>0?due.toFixed(2):0}</td></tr>`}).join('')}</table><div style="background:#1E293B; margin-top:20px; padding:16px; border-radius:24px;"><strong>📌 Total Sales:</strong> ৳${totalS.toFixed(2)}  |  <strong>Cash:</strong> ৳${totalC.toFixed(2)}  |  <strong>Due:</strong> ৳${totalD>0?totalD.toFixed(2):0}</div><div style="margin-top:12px; font-size:10px;">Harvester Pro · ${new Date().toLocaleString()}</div>`; document.body.appendChild(div); try { let canvas = await html2canvas(div, { scale: 2.5, backgroundColor: '#0B1120' }); let link = document.createElement('a'); link.download = `harvester_report_${Date.now()}.jpg`; link.href = canvas.toDataURL('image/jpeg', 0.95); link.click(); } catch(e){} document.body.removeChild(div); }

    // Aurora + Particle Effect
    function initAurora() { const canvas = document.getElementById('aurora-bg'); const ctx = canvas.getContext('2d'); let w = window.innerWidth, h = window.innerHeight; canvas.width = w; canvas.height = h; let hue = 200; function draw() { if (!ctx) return; ctx.clearRect(0, 0, w, h); let grd = ctx.createLinearGradient(0, 0, w, h); grd.addColorStop(0, `hsla(${hue}, 70%, 20%, 0.4)`); grd.addColorStop(0.5, `hsla(${hue+40}, 80%, 15%, 0.5)`); grd.addColorStop(1, `hsla(${hue+80}, 70%, 10%, 0.6)`); ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h); for(let i=0;i<30;i++) { ctx.beginPath(); ctx.arc((w/2)+Math.sin(Date.now()*0.001 + i)*150, (h/2)+Math.cos(Date.now()*0.0008 + i)*100, 120, 0, Math.PI*2); ctx.fillStyle = `hsla(${hue+i*10}, 80%, 50%, 0.03)`; ctx.fill(); } requestAnimationFrame(draw); } draw(); window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; w=canvas.width; h=canvas.height; }); }
    initAurora();

    // GSAP cinematic intro
    gsap.fromTo('.glass-premium', { opacity: 0, y: 30 }, { opacity: 1, y: 0, stagger: 0.08, duration: 0.8, ease: "power3.out" });
    gsap.fromTo('.stat-card', { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, stagger: 0.05, duration: 0.6, delay: 0.2 });
    
    // Chart.js Efficiency gauge
    const ctxGauge = document.getElementById('efficiencyGauge').getContext('2d'); efficiencyChart = new Chart(ctxGauge, { type: 'doughnut', data: { datasets: [{ data: [0, 100], backgroundColor: ['#3b82f6', '#1e293b'], borderWidth: 0, cutout: '70%' }] }, options: { responsive: true, maintainAspectRatio: true, plugins: { tooltip: { enabled: false }, legend: { display: false } } } });

    // Event Bindings
    document.getElementById('saveBtn').addEventListener('click', saveHandler);
    document.getElementById('editCancelBtn').addEventListener('click', resetForm);
    document.getElementById('dueOnlyToggle').addEventListener('click', () => { dueOnlyActive = !dueOnlyActive; document.getElementById('dueOnlyToggle').classList.toggle('bg-rose-500/40'); renderRecords(); });
    document.getElementById('resetFilters').addEventListener('click', () => { dueOnlyActive = false; document.getElementById('searchInput').value = ''; startDateFilter=''; endDateFilter=''; document.getElementById('startDate').value=''; document.getElementById('endDate').value=''; document.getElementById('dueOnlyToggle').classList.remove('bg-rose-500/40'); activeTab='all'; document.getElementById('tabAll').classList.add('border-blue-500','text-blue-300'); document.getElementById('tabDue').classList.remove('border-blue-500','text-blue-300'); renderRecords(); });
    document.getElementById('applyDateFilter').addEventListener('click', () => { startDateFilter = document.getElementById('startDate').value; endDateFilter = document.getElementById('endDate').value; renderRecords(); });
    document.getElementById('searchInput').addEventListener('input', () => renderRecords());
    document.getElementById('tabAll').addEventListener('click', () => { activeTab='all'; document.getElementById('tabAll').classList.add('border-blue-500','text-blue-300'); document.getElementById('tabDue').classList.remove('border-blue-500','text-blue-300'); renderRecords(); });
    document.getElementById('tabDue').addEventListener('click', () => { activeTab='dueCollection'; document.getElementById('tabDue').classList.add('border-blue-500','text-blue-300'); document.getElementById('tabAll').classList.remove('border-blue-500','text-blue-300'); renderRecords(); });
    const modal = document.getElementById('exportModal'); const fab = document.getElementById('fabExport'); fab.onclick = () => { modal.classList.remove('hidden'); modal.style.display = 'flex'; gsap.fromTo('.modal-glass', {scale:0.9, opacity:0}, {scale:1, opacity:1, duration:0.25}); }; document.getElementById('closeModalBtn').onclick = () => modal.classList.add('hidden'); window.onclick = (e) => { if(e.target === modal) modal.classList.add('hidden'); }; document.getElementById('pdfExportBtn').onclick = () => { modal.classList.add('hidden'); exportPDF(); }; document.getElementById('excelExportBtn').onclick = () => { modal.classList.add('hidden'); exportExcel(); }; document.getElementById('jpgExportBtn').onclick = () => { modal.classList.add('hidden'); exportJPG(); };
    loadData();
    // Ripple effect added
    document.querySelectorAll('button, .stat-card').forEach(el => el.addEventListener('click', (e) => { let ripple = document.createElement('span'); ripple.classList.add('ripple'); ripple.style.left = e.clientX - e.target.getBoundingClientRect().left + 'px'; ripple.style.top = e.clientY - e.target.getBoundingClientRect().top + 'px'; el.style.position = 'relative'; el.appendChild(ripple); setTimeout(() => ripple.remove(), 500); }));
  </script>
</body>
