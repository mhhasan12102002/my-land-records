<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Admin Pro - Offline Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f3f4f6; color: #1f2937; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .print-area { border: 2px solid #000 !important; width: 100% !important; box-shadow: none !important; border-radius: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; }
            th, td { border: 1.5px solid #000 !important; padding: 8px !important; color: black !important; }
            /* প্রিন্টের সময় গোল বক্সের বদলে ড্যাশ লাইন দিয়ে সামারি */
            .summary-text-print { display: block !important; border-top: 2px dashed #000; padding: 15px 0; margin-top: 20px; font-weight: 900; font-size: 18px; }
            @page { size: A4 landscape; margin: 10mm; }
        }
        
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; outline: none; }
        .summary-text-print { display: none; } /* ব্রাউজারে এটি লুকানো থাকবে */
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-slate-900 text-white p-6 rounded-2xl mb-6 flex flex-wrap justify-between items-center gap-4 no-print shadow-xl">
            <div>
                <h1 class="text-2xl font-black tracking-tight">LAND ADMIN RECORDS</h1>
                <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Offline Secure Storage</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-bold text-xs">🖨️ PRINT</button>
                <button onclick="exportImg('png')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-bold text-xs">💾 SAVE PNG</button>
                <button onclick="exportImg('jpg')" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg font-bold text-xs">📸 SAVE JPG</button>
                <button onclick="createNewFile()" class="bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded-lg font-bold text-xs">🗑️ RESET</button>
            </div>
        </div>

        <div id="captureArea" class="bg-white border-2 border-gray-200 rounded-xl overflow-hidden shadow-lg print-area">
            <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-xl font-black text-gray-800">জমির হিসাব তালিকা</h2>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-gray-400">তারিখ:</span>
                    <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-bold text-blue-700 outline-none border rounded px-2 py-1">
                </div>
            </div>

            <table class="w-full text-center">
                <thead class="bg-gray-800 text-white text-[11px] uppercase tracking-widest">
                    <tr>
                        <th class="p-4 border-r border-gray-700">নাম</th>
                        <th class="p-4 border-r border-gray-700">জমি (গন্ডা)</th>
                        <th class="p-4 border-r border-gray-700">রেট</th>
                        <th class="p-4 border-r border-gray-700">মোট টাকা</th>
                        <th class="p-4 border-r border-gray-700 text-green-400">নগদ</th>
                        <th class="p-4 text-red-400">বাকি</th>
                        <th class="p-4 no-print">#</th>
                    </tr>
                </thead>
                <tbody id="mainTableBody"></tbody>
            </table>

            <div class="summary-text-print p-6">
                <div class="flex justify-between border-b border-black pb-2">
                    <span>মোট বিক্রি: <span id="printTotal">0</span></span>
                    <span>মোট নগদ: <span id="printCash">0</span></span>
                    <span>মোট বাকি: <span id="printDue">0</span></span>
                </div>
            </div>

            <div class="p-6 bg-gray-50 border-t no-print">
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-blue-50 p-4 rounded-xl text-center border border-blue-100">
                        <p class="text-[10px] font-black text-blue-400 uppercase mb-1">মোট বিক্রি</p>
                        <p id="sumTotal" class="text-xl font-black text-blue-800">0</p>
                    </div>
                    <div class="bg-green-50 p-4 rounded-xl text-center border border-green-100">
                        <p class="text-[10px] font-black text-green-400 uppercase mb-1">মোট নগদ</p>
                        <p id="sumCash" class="text-xl font-black text-green-800">0</p>
                    </div>
                    <div class="bg-red-50 p-4 rounded-xl text-center border border-red-100">
                        <p class="text-[10px] font-black text-red-400 uppercase mb-1">মোট বাকি</p>
                        <p id="sumDue" class="text-xl font-black text-red-800">0</p>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="addRow()" class="w-full p-4 bg-white border-2 border-dashed border-gray-300 text-gray-500 font-black hover:bg-gray-50 no-print mt-4 rounded-xl uppercase text-xs">
            + নতুন এন্ট্রি যোগ করুন
        </button>

        <div class="mt-10 bg-white rounded-2xl shadow-xl border-2 border-red-50 no-print">
            <div class="p-5 bg-red-50 border-b flex justify-between items-center">
                <h3 class="text-lg font-black text-red-800 tracking-tight italic">বাকি টাকার অ্যাডমিন হিস্ট্রি</h3>
                <span class="text-[10px] bg-red-200 text-red-700 px-3 py-1 rounded-full font-black uppercase">Pending List</span>
            </div>
            <div id="dueListView" class="p-2 max-h-64 overflow-y-auto">
                </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_local_v11')) || [];
        let curDate = localStorage.getItem('land_date_v11') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = curDate;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_date_v11', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_local_v11', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = "";
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const tot = j * r, due = tot - a;
                tS += tot; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.rt').innerText = tot.toLocaleString();
                    row.querySelector('.rd').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `
                        <div class="flex justify-between p-3 border-b border-gray-50 hover:bg-gray-50 transition">
                            <span class="font-bold text-gray-700 text-sm">${curDate} — ${item.n || 'N/A'}</span>
                            <span class="font-black text-red-600 text-sm">${due.toLocaleString()} ৳</span>
                        </div>`;
                }
            });
            // Update UI
            const elements = ['sumTotal', 'printTotal', 'sumCash', 'printCash', 'sumDue', 'printDue'];
            const values = [tS, tS, tC, tC, tD, tD];
            elements.forEach((id, i) => document.getElementById(id).innerText = values[i].toLocaleString());
            
            document.getElementById('dueListView').innerHTML = dueHTML || "<p class='p-6 text-center text-gray-300 font-bold'>সব হিসাব পরিশোধিত আছে।</p>";
        }

        function render() {
            const container = document.getElementById('mainTableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const tot = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = tot-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.className = "border-b font-bold hover:bg-gray-50 transition";
                tr.setAttribute('data-id', item.id);
                tr.innerHTML = `
                    <td class="p-3 border-r"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-box" placeholder="..."></td>
                    <td class="p-3 border-r"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-3 border-r"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-3 border-r bg-gray-50 rt text-gray-800">${tot.toLocaleString()}</td>
                    <td class="p-3 border-r"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-box text-green-700" placeholder="0"></td>
                    <td class="p-3 text-red-600 rd">${due.toLocaleString()}</td>
                    <td class="p-3 no-print"><button onclick="removeRow(${item.id})" class="text-gray-300 hover:text-red-500 transition">✖</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function removeRow(id) { if(confirm('ডিলিট করবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_local_v11', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('সব ডাটা মুছে যাবে! আপনি কি নিশ্চিত?')) { db=[]; localStorage.removeItem('land_local_v11'); addRow(); } }

        // Image Export System
        function exportImg(format) {
            const area = document.getElementById('captureArea');
            html2canvas(area, { scale: 2 }).then(canvas => {
                let link = document.createElement('a');
                link.download = `Land_Record_${curDate}.${format}`;
                link.href = canvas.toDataURL(format === 'png' ? "image/png" : "image/jpeg", 0.9);
                link.click();
            });
        }

        init();
    </script>
</body>
</html>
