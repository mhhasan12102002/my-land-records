<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Land Admin v22 - Improved</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; background-attachment: fixed;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        /* v22 এর সেই প্রিমিয়াম রাউন্ড শেপ ডিজাইন */
        .ui-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 30px; 
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            max-width: 750px; margin: auto;
        }

        .input-row {
            display: flex; align-items: center;
            background: white;
            border-radius: 15px; 
            margin-bottom: 12px; padding: 5px 15px;
            border: 1px solid #e2e8f0;
        }

        .label-text { width: 100px; font-weight: 700; color: #475569; }
        .data-input {
            flex: 1; border: none; padding: 12px;
            font-size: 18px; font-weight: 700; outline: none;
            background: transparent;
        }

        /* টেবিল এডিট ইনপুট */
        .table-edit {
            width: 100%; border: none; background: transparent; 
            text-align: center; font-weight: 700; outline: none;
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .ui-card { background: white !important; border: none !important; max-width: 100% !important; border-radius: 0 !important; padding: 0 !important; box-shadow: none !important; }
            .excel-table { width: 100% !important; border-collapse: collapse !important; border: 1px solid black !important; }
            .excel-table th, .excel-table td { border: 1px solid black !important; padding: 8px !important; text-align: center !important; border-radius: 0 !important; font-size: 13px !important; color: black !important; }
            .print-summary { display: flex !important; justify-content: space-between; border: 1px solid black; border-top: none; padding: 10px; font-weight: bold; }
            * { border-radius: 0 !important; }
        }
        .print-summary { display: none; }
    </style>
</head>
<body>

    <div class="ui-card">
        <div class="flex justify-between items-center mb-8 no-print">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Harvester Pro <span class="text-blue-600">v22.1</span></h1>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-blue-600 text-white px-5 py-2 rounded-full font-bold shadow-lg">Print</button>
                <button onclick="saveImage()" class="bg-slate-800 text-white px-5 py-2 rounded-full font-bold shadow-lg">Save PNG</button>
            </div>
        </div>

        <div class="no-print space-y-3">
            <div class="input-row"><span class="label-text">তারিখ :</span><input type="date" id="iDate" class="data-input"></div>
            <div class="input-row"><span class="label-text">নাম :</span><input type="text" id="iName" class="data-input" placeholder="..."></div>
            <div class="grid grid-cols-2 gap-2">
                <div class="input-row"><span class="label-text">গন্ডা :</span><input type="number" id="iGonda" class="data-input" placeholder="0"></div>
                <div class="input-row"><span class="label-text">রেট :</span><input type="number" id="iRate" class="data-input" placeholder="0"></div>
            </div>
            <div class="input-row"><span class="label-text">নগদ :</span><input type="number" id="iCash" class="data-input text-emerald-600" placeholder="0"></div>
            
            <button onclick="addEntry()" class="w-full bg-slate-900 text-white py-5 rounded-[20px] text-2xl font-black shadow-xl active:scale-95 transition-all mt-4">
                + SAVE DATA
            </button>
        </div>

        <div id="exportArea" class="mt-8 bg-white p-2">
            <table class="excel-table w-full text-center">
                <thead class="bg-slate-900 text-white">
                    <tr>
                        <th class="p-3">ক্রেতার নাম</th>
                        <th class="p-3">গন্ডা</th>
                        <th class="p-3">মোট</th>
                        <th class="p-3">নগদ</th>
                        <th class="p-3 text-rose-400">বাকি</th>
                        <th class="p-3 no-print">✕</th>
                    </tr>
                </thead>
                <tbody id="tableData" class="font-bold text-slate-800"></tbody>
            </table>

            <div class="print-summary">
                <div id="ps1"></div><div id="ps2"></div><div id="ps3"></div><div id="ps4"></div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-8 no-print">
            <div class="bg-white p-4 rounded-2xl text-center border-b-4 border-slate-400 shadow-md">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট গন্ডা</p>
                <h4 id="sG" class="text-lg font-black">0</h4>
            </div>
            <div class="bg-white p-4 rounded-2xl text-center border-b-4 border-blue-500 shadow-md">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট বিক্রি</p>
                <h4 id="s1" class="text-lg font-black text-blue-600">0</h4>
            </div>
            <div class="bg-white p-4 rounded-2xl text-center border-b-4 border-emerald-500 shadow-md">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট নগদ</p>
                <h4 id="s2" class="text-lg font-black text-emerald-600">0</h4>
            </div>
            <div class="bg-white p-4 rounded-2xl text-center border-b-4 border-rose-500 shadow-md">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট বাকি</p>
                <h4 id="s3" class="text-lg font-black text-rose-600">0</h4>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_v22_updated_db')) || [];

        function init() {
            const d = localStorage.getItem('v22_date') || new Date().toISOString().split('T')[0];
            document.getElementById('iDate').value = d;
            render();
        }

        function addEntry() {
            const n = document.getElementById('iName').value;
            const g = document.getElementById('iGonda').value;
            const r = document.getElementById('iRate').value;
            const c = document.getElementById('iCash').value;

            if(!n || !g || !r) return alert("তথ্য অসম্পূর্ণ!");

            db.push({ id: Date.now(), n, g, r, c });
            localStorage.setItem('land_v22_updated_db', JSON.stringify(db));
            ['iName','iGonda','iRate','iCash'].forEach(id => document.getElementById(id).value = '');
            render();
        }

        function update(id, key, val) {
            const idx = db.findIndex(x => x.id === id);
            db[idx][key] = val;
            localStorage.setItem('land_v22_updated_db', JSON.stringify(db));
            render();
        }

        function render() {
            const body = document.getElementById('tableData');
            body.innerHTML = '';
            let mG=0, mT=0, mC=0, mD=0;

            db.forEach(item => {
                const total = (item.g * item.r) || 0;
                const cash = parseFloat(item.c) || 0;
                const due = total - cash;
                mG += parseFloat(item.g); mT += total; mC += cash; mD += due;

                body.innerHTML += `
                    <tr class="border-b border-slate-100">
                        <td><input class="table-edit" type="text" value="${item.n}" onchange="update(${item.id}, 'n', this.value)"></td>
                        <td><input class="table-edit" type="number" value="${item.g}" onchange="update(${item.id}, 'g', this.value)"></td>
                        <td>${total.toLocaleString()}</td>
                        <td><input class="table-edit text-emerald-600" type="number" value="${item.c}" onchange="update(${item.id}, 'c', this.value)"></td>
                        <td class="text-rose-600">${due.toLocaleString()}</td>
                        <td class="no-print p-2"><button onclick="del(${item.id})" class="text-slate-300 hover:text-red-500 font-bold">✕</button></td>
                    </tr>
                `;
            });

            document.getElementById('sG').innerText = mG;
            document.getElementById('s1').innerText = mT.toLocaleString();
            document.getElementById('s2').innerText = mC.toLocaleString();
            document.getElementById('s3').innerText = mD.toLocaleString();
            
            // Print Summary
            document.getElementById('ps1').innerText = "মোট গন্ডা: " + mG;
            document.getElementById('ps2').innerText = "মোট বিক্রি: " + mT.toLocaleString();
            document.getElementById('ps3').innerText = "মোট নগদ: " + mC.toLocaleString();
            document.getElementById('ps4').innerText = "মোট বাকি: " + mD.toLocaleString();
        }

        function del(id) { if(confirm('ডিলিট করবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_v22_updated_db', JSON.stringify(db)); render(); } }

        function saveImage() {
            html2canvas(document.getElementById('exportArea'), { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Report_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        init();
    </script>
</body>
</html>
