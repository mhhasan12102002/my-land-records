
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARVESTER PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans Bengali',sans-serif;
}

body{
background:#020617;
color:white;
padding:14px;
}

.main{
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
padding:20px;
margin-bottom:18px;
backdrop-filter:blur(12px);
}

.title{
font-size:32px;
font-weight:900;
margin-bottom:8px;
}

.subtitle{
color:#94a3b8;
margin-bottom:18px;
}

.input{
width:100%;
height:60px;
border:none;
outline:none;
border-radius:18px;
padding:0 18px;
font-size:18px;
font-weight:700;
background:#0f172a;
color:white;
margin-bottom:14px;
}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.live{
background:linear-gradient(135deg,#1e3a8a,#2563eb);
padding:18px;
border-radius:24px;
margin-bottom:16px;
}

.live h5{
font-size:14px;
margin-bottom:8px;
}

.live h1{
font-size:36px;
font-weight:900;
}

.btn{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:900;
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
cursor:pointer;
}

.section{
font-size:24px;
font-weight:900;
margin-bottom:16px;
}

.list{
max-height:550px;
overflow:auto;
display:flex;
flex-direction:column;
gap:14px;
}

.item{
background:#0f172a;
border-radius:24px;
padding:18px;
border:1px solid rgba(255,255,255,.06);
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
}

.name{
font-size:22px;
font-weight:900;
}

.date{
color:#94a3b8;
font-size:14px;
margin-top:4px;
}

.price{
font-size:26px;
font-weight:900;
}

.meta{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:18px;
}

.meta-box{
background:#020617;
padding:14px;
border-radius:16px;
text-align:center;
}

.meta-box h6{
font-size:12px;
color:#94a3b8;
margin-bottom:6px;
}

.meta-box p{
font-size:20px;
font-weight:900;
}

.green{color:#10b981;}
.red{color:#ef4444;}
.blue{color:#3b82f6;}

.actions{
display:flex;
gap:10px;
margin-top:16px;
}

.small-btn{
flex:1;
height:50px;
border:none;
border-radius:14px;
font-weight:800;
color:white;
}

.edit{background:#2563eb;}
.delete{background:#ef4444;}

.export-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.export-btn{
height:60px;
border:none;
border-radius:18px;
font-size:17px;
font-weight:900;
color:white;
}

.pdf{background:#dc2626;}
.jpg{background:#7c3aed;}

.summary{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:12px;
}

.summary-box{
background:#0f172a;
padding:16px;
border-radius:20px;
text-align:center;
}

.summary-box h6{
font-size:12px;
color:#94a3b8;
margin-bottom:8px;
}

.summary-box h2{
font-size:24px;
font-weight:900;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#2563eb;
color:white;
padding:14px 24px;
border-radius:999px;
font-weight:800;
display:none;
z-index:999;
}
</style>
</head>
<body>

<div class="main">

<div class="card">
<div class="title">HARVESTER PRO</div>
<div class="subtitle">Professional Mobile Business System</div>

<input type="date" id="date" class="input">
<input type="text" id="name" class="input" placeholder="কাস্টমারের নাম">

<div class="grid2">
<input type="number" id="gonda" class="input" placeholder="গন্ডা">
<input type="number" id="rate" class="input" placeholder="রেট">
</div>

<input type="number" id="cash" class="input" placeholder="নগদ">

<div class="live">
<h5>TOTAL AMOUNT</h5>
<h1 id="liveTotal">৳ 0</h1>

<h5 style="margin-top:14px;">DUE AMOUNT</h5>
<h1 id="liveDue">৳ 0</h1>
</div>

<button class="btn" onclick="saveRecord()">SAVE RECORD</button>
</div>

<div class="card">
<div class="section">EXPORT CENTER</div>

<div class="export-grid">
<button class="export-btn pdf" onclick="exportPDF()">EXPORT PDF</button>
<button class="export-btn jpg" onclick="exportJPG()">EXPORT IMAGE</button>
</div>
</div>

<div class="card">
<div class="section">RECORDS</div>
<div class="list" id="list"></div>
</div>

<div class="card">
<div class="section">DUE COLLECTION LIST</div>
<div class="list" id="dueList"></div>
</div>

<div class="card">
<div class="summary">
<div class="summary-box">
<h6>মোট বিক্রি</h6>
<h2 class="blue" id="totalSales">0</h2>
</div>

<div class="summary-box">
<h6>মোট নগদ</h6>
<h2 class="green" id="totalCash">0</h2>
</div>

<div class="summary-box">
<h6>মোট বাকি</h6>
<h2 class="red" id="totalDue">0</h2>
</div>
</div>
</div>

</div>

<div class="toast" id="toast"></div>

<script>

let database = JSON.parse(localStorage.getItem('harvester_pro_db')) || [];

const gondaInput = document.getElementById('gonda');
const rateInput = document.getElementById('rate');
const cashInput = document.getElementById('cash');

[gondaInput,rateInput,cashInput].forEach(el=>{
el.addEventListener('input',liveCalculation);
});

function liveCalculation(){

const gonda = Number(gondaInput.value || 0);
const rate = Number(rateInput.value || 0);
const cash = Number(cashInput.value || 0);

const total = gonda * rate;
const due = total - cash;

liveTotal.innerText = '৳ ' + total;
liveDue.innerText = '৳ ' + due;
}

function saveRecord(){

const data = {
id:Date.now(),
name:document.getElementById('name').value,
gonda:Number(gondaInput.value),
rate:Number(rateInput.value),
cash:Number(cashInput.value),
date:document.getElementById('date').value
};

if(!data.name || !data.gonda || !data.rate){
showToast('সব তথ্য পূরণ করুন');
return;
}

database.unshift(data);

localStorage.setItem('harvester_pro_db',JSON.stringify(database));

clearForm();
render();
showToast('Record Saved');
}

function clearForm(){
name.value='';
gonda.value='';
rate.value='';
cash.value='';
liveCalculation();
}

function render(){

const list = document.getElementById('list');
const dueList = document.getElementById('dueList');

list.innerHTML='';
dueList.innerHTML='';

let sales = 0;
let cash = 0;
let due = 0;

database.forEach(item=>{

const total = item.gonda * item.rate;
const remain = total - item.cash;

sales += total;
cash += item.cash;
due += remain;

list.innerHTML += `
<div class="item">
<div class="row">
<div>
<div class="name">${item.name}</div>
<div class="date">${item.date}</div>
</div>
<div class="price blue">৳ ${total}</div>
</div>

<div class="meta">
<div class="meta-box">
<h6>গন্ডা</h6>
<p>${item.gonda}</p>
</div>

<div class="meta-box">
<h6>নগদ</h6>
<p class="green">${item.cash}</p>
</div>

<div class="meta-box">
<h6>বাকি</h6>
<p class="red">${remain}</p>
</div>
</div>

<div class="actions">
<button class="small-btn edit" onclick="editRecord(${item.id})">EDIT</button>
<button class="small-btn delete" onclick="deleteRecord(${item.id})">DELETE</button>
</div>
</div>
`;

if(remain > 0){

dueList.innerHTML += `
<div class="item">
<div class="row">
<div>
<div class="name">${item.name}</div>
<div class="date">Pending Payment</div>
</div>
<div class="price red">৳ ${remain}</div>
</div>
</div>
`;
}

});

totalSales.innerText = '৳ ' + sales;
totalCash.innerText = '৳ ' + cash;
totalDue.innerText = '৳ ' + due;
}

function deleteRecord(id){
if(confirm('Delete Record?')){
database = database.filter(item=>item.id !== id);
localStorage.setItem('harvester_pro_db',JSON.stringify(database));
render();
}
}

function editRecord(id){

const item = database.find(x=>x.id===id);

name.value = item.name;
gonda.value = item.gonda;
rate.value = item.rate;
cash.value = item.cash;
date.value = item.date;

liveCalculation();

deleteRecord(id);
}

function createReport(){

let rows='';

let sales = 0;
let cash = 0;
let due = 0;

database.forEach(item=>{

const total = item.gonda * item.rate;
const remain = total - item.cash;

sales += total;
cash += item.cash;
due += remain;

rows += `
<tr>
<td>${item.name}</td>
<td>${item.gonda}</td>
<td>${item.rate}</td>
<td>${total}</td>
<td>${item.cash}</td>
<td>${remain}</td>
<td>${item.date}</td>
</tr>
`;

});

return `
<div id="report" style="width:1400px;background:white;padding:50px;color:black;font-family:'Noto Sans Bengali',sans-serif;">

<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:6px solid #2563eb;padding-bottom:20px;margin-bottom:30px;">
<div>
<h1 style="font-size:52px;font-weight:900;color:#2563eb;">HARVESTER REPORT</h1>
<p style="font-size:20px;font-weight:700;color:#475569;">Professional Business Accounting Report</p>
</div>

<div style="text-align:right;">
<h3 style="font-size:18px;color:#64748b;">Generated Date</h3>
<h2 style="font-size:30px;font-weight:900;">${new Date().toLocaleDateString('bn-BD')}</h2>
</div>
</div>

<table style="width:100%;border-collapse:collapse;font-size:22px;">
<thead>
<tr style="background:#2563eb;color:white;">
<th style="padding:24px;border:2px solid #dbeafe;">কাস্টমার</th>
<th style="padding:24px;border:2px solid #dbeafe;">গন্ডা</th>
<th style="padding:24px;border:2px solid #dbeafe;">রেট</th>
<th style="padding:24px;border:2px solid #dbeafe;">মোট</th>
<th style="padding:24px;border:2px solid #dbeafe;">নগদ</th>
<th style="padding:24px;border:2px solid #dbeafe;">বাকি</th>
<th style="padding:24px;border:2px solid #dbeafe;">তারিখ</th>
</tr>
</thead>

<tbody>
${rows}
</tbody>
</table>

<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:30px;">
<div style="padding:24px;background:#eff6ff;border-radius:20px;text-align:center;">
<h4 style="font-size:18px;">মোট বিক্রি</h4>
<h1 style="font-size:36px;color:#2563eb;">৳ ${sales}</h1>
</div>

<div style="padding:24px;background:#ecfdf5;border-radius:20px;text-align:center;">
<h4 style="font-size:18px;">মোট নগদ</h4>
<h1 style="font-size:36px;color:#10b981;">৳ ${cash}</h1>
</div>

<div style="padding:24px;background:#fef2f2;border-radius:20px;text-align:center;">
<h4 style="font-size:18px;">মোট বাকি</h4>
<h1 style="font-size:36px;color:#ef4444;">৳ ${due}</h1>
</div>
</div>

</div>
`;
}

function exportPDF(){

const temp = document.createElement('div');

temp.innerHTML = createReport();

document.body.appendChild(temp);

html2canvas(document.getElementById('report'),{
scale:3,
useCORS:true
}).then(canvas=>{

const { jsPDF } = window.jspdf;

const pdf = new jsPDF('l','mm','a4');

const width = pdf.internal.pageSize.getWidth();
const height = canvas.height * width / canvas.width;

pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,width,height);

pdf.save('harvester-report.pdf');

document.body.removeChild(temp);

showToast('PDF Exported');

});
}

function exportJPG(){

const temp = document.createElement('div');

temp.innerHTML = createReport();

document.body.appendChild(temp);

html2canvas(document.getElementById('report'),{
scale:3,
useCORS:true
}).then(canvas=>{

const a = document.createElement('a');
a.href = canvas.toDataURL('image/jpeg',1);
a.download = 'harvester-report.jpg';
a.click();

document.body.removeChild(temp);

showToast('Image Exported');

});
}

function showToast(text){
const toast = document.getElementById('toast');
toast.innerText = text;
toast.style.display='block';

setTimeout(()=>{
toast.style.display='none';
},2000);
}

document.getElementById('date').value = new Date().toISOString().split('T')[0];

render();

</script>

</body>
</html>
```
