<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harvester Golden v25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Golden Ratio Constants: 1.618 */
        :root { --phi: 1.618; }
        
        body { 
            font-family: 'Hind Siliguri', sans-serif;
            background: #0f172a; /* Deep Premium Background */
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh; margin: 0; padding: 2.5vw;
            display: flex; justify-content: center; align-items: flex-start;
        }

        .golden-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(25px);
            border-radius: 2.5rem; /* Golden Ratio Curved */
            padding: 2.5rem;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* Input Rows - Golden Ratio Height */
        .input-row {
            display: flex; align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            margin-bottom: 0.8rem;
            padding: 0 1.2rem;
            height: calc(3.5rem); /* Proportional height */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-row:focus-within { border-color: #3b82f6; ring: 2px #bfdbfe; }

        .label-box { width: 100px; font-weight: 700; color: #64748b; font-size: 15px; }
        .main-input { flex: 1; border: none; outline: none; font-size: 1.2rem; font-weight: 700; color: #1e293b; background: transparent; }

        /* Excel Table Style (Screen) */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        .data-table th { background: #1e293b; color: white; padding: 12px; font-size: 13px; text-transform: uppercase; border: 1px solid #334155; }
        .data-table td { border: 1px solid #f1f5f9; padding: 10px; text-align: center; color: #0f172a; font-weight: 600; }
        
        .inline-edit { width: 100%; border: none; text-align: center; font-weight: 700; outline: none; background: transparent; }
        .inline-edit:focus { color: #2563eb; background: #f0f7ff; }

        /* Export Mode (PDF/JPG) - Pure Black & White Excel */
        .export-mode { padding: 0 !important; background: white !important; }
        .export-mode table { border: 2px solid black !important; width: 100% !important; }
        .export-mode th, .export-mode td { border: 1px solid black !important; color: black !important; background: white !important; font-size: 12pt !important; padding: 8px !important; }
        .export-header { display: none; text-align: center; font-weight: 900; font-size: 20pt; margin-bottom: 10px; border-bottom: 3px solid black; padding-bottom: 10px; }
        .export-summary { display: none; border: 2px solid black; border-top: none; padding: 15px; font-weight: bold; font-size: 14pt; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

    <div class="golden-card">
        <div class="flex justify-between items-end mb-8 no-print border-b border-slate-200 pb-6">
            <div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tight">HARVESTER <span class="text-blue-600">V25</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.3em]">Golden Ratio Precision</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportPDF()" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition">SAVE PDF</button>
                <button onclick="exportJPG()" class="bg-slate-800 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg hover:bg-slate-900 transition">SAVE JPG</button>
            </div>
        </div>

        <div class="no-print space-y-1">
            <div class="input-row"><span class="label-box">তারিখ :</span><input type="date" id="fDate" class="main-input" onchange="localStorage.setItem('v25_date', this.value)"></div>
            <div class="input-row"><span class="label-box">নাম :</span><input type="text" id="fName" class="main-input" placeholder="..."></div>
            <div class="grid grid-cols-2 gap-2">
                <div class="input-row"><span class="label-box">গন্ডা :</span><input type="number" id="fGonda" class="main-input" placeholder="0"></div>
                <div class="input-row"><span class="label-box">রেট :</span><input type="number" id="fRate" class="main-input" placeholder="0"></div>
            </div>
            <div class="input-row"><span class="label-box">নগদ :</span><input type="number" id="fCash" class="main-input text-emerald-600" placeholder="0"></div>
            
            <button onclick="saveData()" class="w-full bg-slate-900 text-white py-5 rounded-2xl text-2xl font-black shadow-2xl active:scale-[0.98] transition-all mt-4 hover:bg-blue-600">
                + SAVE TO DATABASE
            </button>
        </div>

        <div id="exportTarget" class="mt-8 bg-white p-2">
            <div class="export-header" id="expH">জমির হিসাব বিবরণী</div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="w-1/3">ক্রেতার নাম</th>
                        <th>গন্ডা</th>
                        <th>রেট</th>
                        <th>মোট</th>
                        <th>নগদ</th>
                        <th>বাকি</th>
                        <th class="no-print">✕</th>
                    </tr>
                </thead>
                <tbody id="sheetData"></tbody>
            </table>
            <div class="export-summary flex justify-between" id="expS">
                <div id="ps1"></div><div id="ps2"></div><div id="ps3"></div><div id="ps4"></div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-8 no-print">
            <div class="bg-white/50 p-4 rounded-2xl border-b-4 border-slate-400 shadow-md">
                <p class="text-[10px] font-bold text-slate-500">মোট গন্ডা</p>
                <h4 id="sG" class="text-lg font-black text-slate-800">0</h4>
            </div>
            <div class="bg-white/50 p-4 rounded-2xl border-b-4 border-blue-500 shadow-md">
                <p class="text-[10px] font-bold text-slate-500">মোট বিক্রি</p>
                <h4 id="s1" class="text-lg font-black text-blue-700">0</h4>
            </div>
            <div class="bg-white/50 p-4 rounded-2xl border-b-4 border-emerald-500 shadow-md">
                <p class="text-[10px] font-bold text-slate-500">মোট নগদ</p>
                <h4 id="s2" class="text-lg font-black text-emerald-700">0</h4>
            </div>
            <div class="bg-white/50 p-4 rounded-2xl border-b-4 border-rose-500 shadow-md">
                <p class="text-[10px] font-bold text-slate-500">মোট বাকি</p>
                <h4 id="s3" class="text-lg font-black text-rose-700">0</h4>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_v25_db')) || [];

        function init() {
            const d = localStorage.getItem('v25_date') || new Date().toISOString().split('T')[0];
            document.getElementById('fDate').value = d;
            render();
        }

        function saveData() {
            const n = document.getElementById('fName').value, g = document.getElementById('fGonda').value,
                  r = document.getElementById('fRate').value, c = document.getElementById('fCash').value;
            if(!n || !g || !r) return;
            db.push({ id: Date.now(), n, g, r, c });
            localStorage.setItem('land_v25_db', JSON.stringify(db));
            ['fName','fGonda','fRate','fCash'].forEach(id => document.getElementById(id).value = '');
            render();
        }

        function update(id, k, v) {
            const i = db.findIndex(x => x.id === id); db[i][k] = v;
            localStorage.setItem('land_v25_db', JSON.stringify(db)); render();
        }

        function render() {
            const b = document.getElementById('sheetData'); b.innerHTML = '';
            let mG=0, mT=0, mC=0, mD=0;
            db.forEach(item => {
                const total = item.g * item.r, cash = parseFloat(item.c) || 0, due = total - cash;
                mG += parseFloat(item.g); mT += total; mC += cash; mD += due;
                b.innerHTML += `
                    <tr>
                        <td><input class="inline-edit" value="${item.n}" onchange="update(${item.id},'n',this.value)"></td>
                        <td><input class="inline-edit" value="${item.g}" onchange="update(${item.id},'g',this.value)"></td>
                        <td><input class="inline-edit" value="${item.r}" onchange="update(${item.id},'r',this.value)"></td>
                        <td>${total.toLocaleString()}</td>
                        <td><input class="inline-edit text-emerald-600" value="${item.c}" onchange="update(${item.id},'c',this.value)"></td>
                        <td class="text-rose-600">${due.toLocaleString()}</td>
                        <td class="no-print"><button onclick="del(${item.id})" class="text-slate-300 hover:text-red-500">✕</button></td>
                    </tr>`;
            });
            document.getElementById('sG').innerText = mG; document.getElementById('s1').innerText = mT.toLocaleString();
            document.getElementById('s2').innerText = mC.toLocaleString(); document.getElementById('s3').innerText = mD.toLocaleString();
            document.getElementById('ps1').innerText = "গন্ডা: "+mG; document.getElementById('ps2').innerText = "বিক্রি: "+mT.toLocaleString();
            document.getElementById('ps3').innerText = "নগদ: "+mC.toLocaleString(); document.getElementById('ps4').innerText = "বাকি: "+mD.toLocaleString();
        }

        function del(id) { if(confirm('ডিলিট?')){ db=db.filter(x=>x.id!==id); localStorage.setItem('land_v25_db', JSON.stringify(db)); render(); } }

        function exportPDF() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', 'a4');
            const target = document.getElementById('exportTarget');
            document.getElementById('expH').style.display = 'block'; document.getElementById('expS').style.display = 'flex';
            target.classList.add('export-mode');

            html2canvas(target, { scale: 4 }).then(canvas => {
                const img = canvas.toDataURL('image/png');
                const w = doc.internal.pageSize.getWidth(); const h = (canvas.height * w) / canvas.width;
                doc.addImage(img, 'PNG', 0, 0, w, h); doc.save('Report.pdf');
                target.classList.remove('export-mode');
                document.getElementById('expH').style.display = 'none'; document.getElementById('expS').style.display = 'none';
            });
        }

        function exportJPG() {
            const target = document.getElementById('exportTarget');
            document.getElementById('expH').style.display = 'block'; document.getElementById('expS').style.display = 'flex';
            target.classList.add('export-mode');
            html2canvas(target, { scale: 4 }).then(canvas => {
                const a = document.createElement('a'); a.download = 'Report.jpg'; a.href = canvas.toDataURL('image/jpeg', 1.0); a.click();
                target.classList.remove('export-mode');
                document.getElementById('expH').style.display = 'none'; document.getElementById('expS').style.display = 'none';
            });
        }
        init();
    </script>
</body>
</html>
