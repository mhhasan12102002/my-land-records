<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Pro - Professional Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f8fafc; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .print-area { border: 2px solid #000 !important; width: 100% !important; box-shadow: none !important; border-radius: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; border: 2px solid #000 !important; }
            /* লেখা বড় করা */
            th { border: 2px solid #000 !important; padding: 15px 5px !important; font-size: 20px !important; background: #eee !important; color: #000 !important; }
            td { border: 1.5px solid #000 !important; padding: 12px 5px !important; font-size: 18px !important; color: #000 !important; font-weight: 900 !important; }
            .summary-text-print { display: flex !important; justify-content: space-between; padding: 20px; font-weight: 900; font-size: 22px; border-top: 2px solid #000; }
            @page { size: A4 landscape; margin: 10mm; }
        }
        
        /* ইনপুট বক্সের লেখা বড় করা */
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 900; outline: none; font-size: 18px; }
        .summary-text-print { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-gray-900 text-white p-6 rounded-2xl mb-6 flex flex-wrap justify-between items-center gap-4 no-print shadow-2xl">
            <h1 class="text-2xl font-black italic">LAND ADMIN SYSTEM</h1>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg font-bold text-sm">🖨️ প্রিন্ট টেবিল</button>
                <button onclick="exportImg('captureArea', 'png')" class="bg-indigo-600 hover:bg-indigo-700 px-5 py-2 rounded-lg font-bold text-sm">💾 PNG সেভ</button>
                <button onclick="exportImg('captureArea', 'jpg')" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2 rounded-lg font-bold text-sm">📸 JPG সেভ</button>
                <button onclick="createNewFile()" class="bg-red-600 px-5 py-2 rounded-lg font-bold text-sm">🗑️ নতুন ফাইল</button>
            </div>
        </div>

        <div id="captureArea" class="bg-white border shadow-xl rounded-xl overflow-hidden print-area">
            <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-2xl font-black">জমির হিসাব তালিকা</h2>
                <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-black text-xl border rounded px-3 py-1 text-blue-700">
            </div>

            <table class="w-full text-center">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="p-5 border-r border-gray-700 text-xl">নাম</th>
                        <th class="p-5 border-r border-gray-700 text-xl">জমি (গন্ডা)</th>
                        <th class="p-5 border-r border-gray-700 text-xl">রেট</th>
                        <th class="p-5 border-r border-gray-700 text-xl">মোট টাকা</th>
                        <th class="p-5 border-r border-gray-700 text-green-400 text-xl">নগদ</th>
                        <th class="p-5 text-red-400 text-xl">বাকি</th>
                        <th class="p-5 no-print">#</th>
                    </tr>
                </thead>
                <tbody id="mainTableBody"></tbody>
            </table>

            <div class="summary-text-print">
                <span>মোট বিক্রি: <span id="printTotal">0</span></span>
                <span>মোট নগদ: <span id="printCash">0</span></span>
                <span>মোট বাকি: <span id="printDue">0</span></span>
            </div>
        </div>

        <button onclick="addRow()" class="w-full p-5 bg-white border-4 border-dashed border-gray-200 text-gray-400 font-black hover:bg-gray-50 no-print mt-6 rounded-2xl text-lg">
            + নতুন কাস্টমার এন্ট্রি করুন
        </button>

        <div id="dueCaptureArea" class="mt-12 bg-white rounded-3xl shadow-2xl border-2 border-red-200 overflow-hidden print-area">
            <div class="p-6 bg-red-600 text-white flex justify-between items-center no-print">
                <h3 class="text-xl font-black italic">আজকের বাকি টাকা</h3>
                <div class="flex gap-2">
                    <button onclick="printSection('dueCaptureArea')" class="bg-white text-red-600 px-4 py-1 rounded-lg font-black text-xs">🖨️ প্রিন্ট</button>
                    <button onclick="exportImg('dueCaptureArea', 'png')" class="bg-blue-500 text-white px-4 py-1 rounded-lg font-black text-xs">PNG</button>
                    <button onclick="exportImg('dueCaptureArea', 'jpg')" class="bg-emerald-500 text-white px-4 py-1 rounded-lg font-black text-xs">JPG</button>
                </div>
            </div>
            <div id="dueListView" class="p-4 bg-white">
                </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_pro_v12')) || [];
        let curDate = localStorage.getItem('land_date_v12') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = curDate;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_date_v12', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_pro_v12', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = `<table class="w-full border-collapse">
                <tr class="bg-gray-100"><th class="p-3 border">তারিখ</th><th class="p-3 border">নাম</th><th class="p-3 border">বাকি টাকা</th></tr>`;
            
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const tot = j * r, due = tot - a;
                tS += tot; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.rt').innerText = tot.toLocaleString();
                    row.querySelector('.rd').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<tr class="text-center font-bold text-lg">
                        <td class="p-3 border">${curDate}</td>
                        <td class="p-3 border">${item.n || 'N/A'}</td>
                        <td class="p-3 border text-red-600">${due.toLocaleString()} ৳</td>
                    </tr>`;
                }
            });
            dueHTML += `</table>`;
            
            ['sumTotal', 'printTotal', 'sumCash', 'printCash', 'sumDue', 'printDue'].forEach((id, i) => {
                const val = [tS, tS, tC, tC, tD, tD][i];
                document.getElementById(id).innerText = val.toLocaleString();
            });
            
            document.getElementById('dueListView').innerHTML = tD > 0 ? dueHTML : "<p class='p-10 text-center text-gray-400 font-bold'>আজ কোনো বাকি নেই।</p>";
        }

        function render() {
            const container = document.getElementById('mainTableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const tot = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = tot-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.innerHTML = `
                    <td class="p-4 border-r"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-box" placeholder="..."></td>
                    <td class="p-4 border-r"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-4 border-r"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-4 border-r font-black rt text-xl">${tot.toLocaleString()}</td>
                    <td class="p-4 border-r"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-box text-green-700" placeholder="0"></td>
                    <td class="p-4 font-black text-red-600 rd text-xl">${due.toLocaleString()}</td>
                    <td class="p-4 no-print"><button onclick="removeRow(${item.id})" class="text-gray-300 hover:text-red-500">✖</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function removeRow(id) { if(confirm('মুছবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_pro_v12', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('সব ডাটা মুছে যাবে!')) { db=[]; localStorage.removeItem('land_pro_v12'); addRow(); } }

        function exportImg(areaId, format) {
            html2canvas(document.getElementById(areaId), { scale: 3 }).then(canvas => {
                let link = document.createElement('a');
                link.download = `Land_Record_${Date.now()}.${format}`;
                link.href = canvas.toDataURL(format === 'png' ? "image/png" : "image/jpeg", 1.0);
                link.click();
            });
        }

        function printSection(elId) {
            const content = document.getElementById(elId).innerHTML;
            const win = window.open('', '', 'height=700,width=900');
            win.document.write('<html><head><title>Print Section</title><style>table{width:100%;border-collapse:collapse;}th,td{border:1px solid #000;padding:10px;text-align:center;font-family:sans-serif;}.no-print{display:none;}</style></head><body>');
            win.document.write(content);
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }

        init();
    </script>
</body>
</html>
