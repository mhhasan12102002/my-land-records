<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Land Admin v20 - Hybrid Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        /* সার্বিক শার্প ডিজাইন - নো রাউন্ড কোণা */
        * { border-radius: 0 !important; font-family: 'Hind Siliguri', sans-serif; }
        
        body { background-color: #0f172a; color: #f8fafc; margin: 0; }

        /* প্রিমিয়াম অ্যাপ UI ইনপুট */
        .premium-input { 
            border: none; 
            background: transparent; 
            width: 100%; 
            text-align: center; 
            font-weight: 700; 
            font-size: 20px; 
            outline: none; 
            padding: 18px 5px; 
            color: #f8fafc;
            transition: all 0.2s;
        }
        .premium-input:focus { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }

        /* এক্সেল শিট প্রিন্ট ইঞ্জিন (Pure Excel/Google Sheet Style) */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .main-container { max-width: 100% !important; border: none !important; }
            
            table { 
                width: 100% !important; 
                border-collapse: collapse !important; 
                border: 1px solid #000 !important; /* এক্সেল স্টাইল চিকন বর্ডার */
            }
            th { 
                border: 1px solid #000 !important; 
                background-color: #f2f2f2 !important; 
                color: black !important; 
                font-size: 14px !important; 
                padding: 8px !important; 
                font-weight: bold !important;
            }
            td { 
                border: 1px solid #000 !important; 
                color: black !important; 
                font-size: 13px !important; 
                padding: 6px !important; 
                background: white !important;
            }
            .premium-input { color: black !important; font-size: 13px !important; padding: 4px !important; font-weight: normal !important; }
            .print-only-header { display: block !important; text-align: left; margin-bottom: 10px; font-weight: bold; }
            .due-chart-print { margin-top: 20px; border-top: 2px solid #000; }
            @page { size: A4 portrait; margin: 10mm; }
        }
        
        .print-only-header { display: none; }
        .table-container { background: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-full mx-auto main-container">
        <div class="bg-blue-700 p-6 flex flex-wrap justify-between items-center no-print shadow-2xl border-b-4 border-blue-900 mb-1">
            <div>
                <h1 class="text-white text-2xl font-black italic tracking-tighter">LAND ADMIN PRO <span class="bg-white text-blue-700 px-2 py-0.5 ml-2">v20</span></h1>
                <p class="text-blue-200 text-[10px] font-bold uppercase mt-1">Premium Interface / Excel Export</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-black text-white px-6 py-3 font-black text-sm border border-blue-400 hover:bg-zinc-900 transition">🖨️ PRINT SHEET</button>
                <button onclick="saveHighRes('png')" class="bg-white text-blue-700 px-6 py-3 font-black text-sm shadow-xl active:scale-95 transition">SAVE IMAGE</button>
            </div>
        </div>

        <div id="sheetArea" class="table-container">
            <div class="print-only-header">
                <h2 style="font-size: 20px;">জমির হিসাব বিবরণী (গুগল শিট ফরম্যাট)</h2>
                <p>তারিখ: <span id="pDate"></span></p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-px bg-slate-700 no-print">
                <div class="bg-slate-800 p-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">তারিখ নির্বাচন:</span><br>
                    <input type="date" id="dateInp" onchange="updateDate(this.value)" class="bg-transparent text-blue-400 font-bold outline-none">
                </div>
                <div class="bg-slate-800 p-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase">মোট বিক্রি</span>
                    <h3 id="t1" class="text-xl font-black text-white">0</h3>
                </div>
                <div class="bg-slate-800 p-4">
                    <span class="text-[10px] font-bold text-emerald-500 uppercase">মোট নগদ</span>
                    <h3 id="t2" class="text-xl font-black text-emerald-500">0</h3>
                </div>
                <div class="bg-slate-800 p-4">
                    <span class="text-[10px] font-bold text-rose-500 uppercase">মোট বাকি</span>
                    <h3 id="t3" class="text-xl font-black text-rose-500">0</h3>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse">
                    <thead class="bg-slate-900 text-slate-400 text-[11px] uppercase tracking-widest no-print">
                        <tr>
                            <th class="p-4 border-r border-slate-800 min-w-[250px]">ক্রেতার নাম</th>
                            <th class="p-4 border-r border-slate-800">জমি (গন্ডা)</th>
                            <th class="p-4 border-r border-slate-800">রেট</th>
                            <th class="p-4 border-r border-slate-800">মোট টাকা</th>
                            <th class="p-4 border-r border-slate-800">নগদ</th>
                            <th class="p-4 bg-rose-950/30 text-rose-500">বাকি টাকা</th>
                            <th class="p-4 no-print w-10">#</th>
                        </tr>
                    </thead>
                    <thead class="hidden print:table-header-group bg-gray-100">
                        <tr>
                            <th>ক্রেতার নাম</th>
                            <th>জমি (গন্ডা)</th>
                            <th>রেট</th>
                            <th>মোট টাকা</th>
                            <th>নগদ</th>
                            <th>বাকি টাকা</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody" class="bg-transparent print:bg-white divide-y divide-slate-800 print:divide-black">
                        </tbody>
                </table>
            </div>

            <div id="dueChartArea" class="p-6 border-t border-slate-700 bg-slate-900/50 print:bg-white print:border-black print:mt-4">
                <h2 class="text-sm font-black text-rose-500 mb-4 uppercase tracking-widest print:text-black print:text-lg">বাকি পাওনা তালিকা (Excel Summary):</h2>
                <div id="dueListGrid" class="grid grid-cols-1 md:grid-cols-3 gap-2 print:block">
                    </div>
            </div>
        </div>

        <button onclick="addRow()" class="w-full bg-blue-600 text-white p-6 font-black text-xl no-print hover:bg-blue-500 transition shadow-2xl active:scale-95">
            + নতুন কাস্টমার এন্ট্রি (ADD NEW ROW)
        </button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_v20_db')) || [];
        let dateVal = localStorage.getItem('land_v20_dt') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInp').value = dateVal;
            document.getElementById('pDate').innerText = dateVal;
            if(db.length === 0) addRow(); else render();
        }

        function updateDate(v) { localStorage.setItem('land_v20_dt', v); location.reload(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function edit(id, k, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][k] = v;
            localStorage.setItem('land_v20_db', JSON.stringify(db));
            calc();
        }

        function calc() {
            let v1=0, v2=0, v3=0;
            let dueHTML = "";

            db.forEach(item => {
                const total = (parseFloat(item.j)||0) * (parseFloat(item.r)||0);
                const cash = parseFloat(item.a)||0;
                const due = total - cash;
                v1 += total; v2 += cash; v3 += due;

                const tr = document.querySelector(`[data-id="${item.id}"]`);
                if(tr) {
                    tr.querySelector('.r-total').innerText = total.toLocaleString();
                    tr.querySelector('.r-due').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<div class="p-3 border border-slate-700 print:border-black flex justify-between bg-slate-800 print:bg-white mb-1">
                        <span class="font-bold print:text-black">${item.n || 'N/A'}</span>
                        <span class="font-black text-rose-500 print:text-black">${due.toLocaleString()} ৳</span>
                    </div>`;
                }
            });

            document.getElementById('t1').innerText = v1.toLocaleString();
            document.getElementById('t2').innerText = v2.toLocaleString();
            document.getElementById('t3').innerText = v3.toLocaleString();
            document.getElementById('dueListGrid').innerHTML = dueHTML || "<p class='text-slate-500'>সব পরিশোধিত।</p>";
        }

        function render() {
            const body = document.getElementById('dataBody');
            body.innerHTML = '';
            db.forEach(item => {
                const total = (parseFloat(item.j)||0) * (parseFloat(item.r)||0);
                const due = total - (parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.innerHTML = `
                    <td class="print:border-black"><input type="text" value="${item.n}" oninput="edit(${item.id},'n',this.value)" class="premium-input" placeholder="..."></td>
                    <td class="print:border-black"><input type="number" value="${item.j}" oninput="edit(${item.id},'j',this.value)" class="premium-input" placeholder="0"></td>
                    <td class="print:border-black"><input type="number" value="${item.r}" oninput="edit(${item.id},'r',this.value)" class="premium-input" placeholder="0"></td>
                    <td class="font-black text-blue-400 print:text-black r-total">${total.toLocaleString()}</td>
                    <td class="print:border-black"><input type="number" value="${item.a}" oninput="edit(${item.id},'a',this.value)" class="premium-input text-emerald-500 print:text-black" placeholder="0"></td>
                    <td class="font-black text-rose-500 print:text-black r-due">${due.toLocaleString()}</td>
                    <td class="no-print"><button onclick="del(${item.id})" class="text-slate-600 hover:text-red-500 font-bold">✕</button></td>
                `;
                body.appendChild(tr);
            });
            calc();
        }

        function del(id) { if(confirm('Delete?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_v20_db', JSON.stringify(db)); render(); } }
        
        function saveHighRes(fmt) {
            const area = document.getElementById('sheetArea');
            html2canvas(area, { scale: 4, backgroundColor: "#ffffff", windowWidth: 1400 }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Sheet_Report_${Date.now()}.${fmt}`;
                a.href = canvas.toDataURL(fmt === 'png' ? 'image/png' : 'image/jpeg');
                a.click();
            });
        }

        init();
    </script>
</body>
</html>
