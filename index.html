<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
  <title>HARVESTER PRO TITANIUM X | Cinematic Financial OS</title>
  <!-- Core Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', 'Hind Siliguri', sans-serif; overflow-x: hidden; background: #02040A; min-height: 100vh; }
    
    /* Aurora Canvas Background */
    #auroraCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .cursorGlow { position: fixed; width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; pointer-events: none; z-index: 2; transform: translate(-50%, -50%); transition: transform 0.05s ease-out; }
    
    /* Premium Glass Layers */
    .glassPremium { background: rgba(6, 12, 24, 0.7); backdrop-filter: blur(18px); border: 1px solid rgba(59, 130, 246, 0.25); box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5); }
    .glassCard { background: rgba(10, 18, 32, 0.6); backdrop-filter: blur(14px); border: 1px solid rgba(59,130,246,0.2); transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
    .glassCard:active { transform: scale(0.98); }
    
    /* Typography */
    .gradientText { background: linear-gradient(135deg, #FFFFFF, #7AC7FF, #3B82F6, #A855F7); background-size: 300% 300%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradientFlow 6s ease infinite; }
    @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    /* Scrollbar */
    .scrollCustom::-webkit-scrollbar { width: 3px; }
    .scrollCustom::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); border-radius: 10px; }
    .scrollCustom::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    
    /* Record Cards - Compact */
    .recordCard { transition: all 0.2s ease; cursor: pointer; }
    .recordCard:active { transform: scale(0.99); }
    .dueHigh { background: linear-gradient(95deg, rgba(220,38,38,0.15), rgba(185,28,28,0.03)); border-left: 3px solid #ef4444; }
    .dueMedium { background: linear-gradient(95deg, rgba(245,158,11,0.1), rgba(245,158,11,0.02)); border-left: 3px solid #f59e0b; }
    
    /* Ripple Effect */
    .ripple { position: absolute; border-radius: 50%; background: rgba(59,130,246,0.5); transform: scale(0); animation: rippleAnim 0.5s linear; pointer-events: none; }
    @keyframes rippleAnim { to { transform: scale(6); opacity: 0; } }
    
    /* FAB Pulse */
    .fabPulse { animation: pulseRing 2s infinite; }
    @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); } 70% { box-shadow: 0 0 0 15px rgba(59,130,246,0); } 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); } }
    
    /* Modal */
    .modalGlass { background: rgba(3, 10, 25, 0.98); backdrop-filter: blur(28px); border: 1px solid rgba(59,130,246,0.5); animation: modalEntry 0.35s cubic-bezier(0.34, 1.2, 0.64, 1); }
    @keyframes modalEntry { from { opacity: 0; transform: scale(0.92) translateY(25px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    
    /* Inputs */
    input, select { transition: all 0.2s ease; background: rgba(0,0,0,0.5); border: 1.5px solid rgba(255,255,255,0.1); color: white; }
    input:focus { transform: scale(1.01); border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); background: rgba(0,0,0,0.7); outline: none; }
    button { cursor: pointer; transition: all 0.2s ease; }
    button:active { transform: scale(0.96); }
    
    /* Stats */
    .statCard { transition: all 0.2s; }
    .statCard:active { transform: scale(0.96); }
    
    /* Insight Badge */
    .insightPill { background: rgba(59,130,246,0.15); border-radius: 40px; padding: 4px 12px; font-size: 10px; font-weight: 600; backdrop-filter: blur(4px); }
  </style>
</head>
<body>

  <canvas id="auroraCanvas"></canvas>
  <div class="cursorGlow" id="cursorGlow"></div>

  <div class="relative z-10 max-w-5xl mx-auto px-4 pb-32 pt-5 md:pt-7">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
      <div>
        <h1 class="text-3xl md:text-4xl font-black tracking-tight"><span class="gradientText">HARVESTER PRO</span><span class="text-[10px] bg-white/10 backdrop-blur px-2.5 py-1 rounded-full ml-2 align-middle">Ti X</span></h1>
        <div class="flex items-center gap-2 mt-1"><i class="fas fa-crown text-yellow-500/60 text-xs"></i><span class="text-white/40 text-xs font-semibold" id="greetingText">Loading...</span></div>
      </div>
      <div class="glassPremium rounded-2xl px-3 py-1.5 text-[10px] font-bold"><i class="fas fa-bolt text-blue-400 mr-1"></i> OFFLINE · TITANIUM</div>
    </div>

    <!-- Financial Health + Insight -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="glassPremium rounded-2xl p-3">
        <div class="text-[10px] opacity-50 uppercase">Financial Health</div>
        <div class="text-2xl font-black" id="healthPercent">0%</div>
        <div class="w-full bg-white/10 rounded-full h-1.5 mt-2"><div class="bg-gradient-to-r from-emerald-400 to-blue-500 h-1.5 rounded-full transition-all duration-500" id="healthBarFill" style="width:0%"></div></div>
      </div>
      <div class="glassPremium rounded-2xl p-3">
        <div class="text-[10px] opacity-50 uppercase"><i class="fas fa-brain mr-1"></i> AI Insight</div>
        <div class="text-xs font-semibold mt-1" id="aiInsightText">Ready</div>
      </div>
    </div>

    <!-- Dashboard Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-7">
      <div class="glassCard rounded-2xl p-3.5 text-center statCard"><div class="text-2xl md:text-3xl font-black text-cyan-300" id="statGonda">0</div><div class="text-[9px] uppercase tracking-wider opacity-60 mt-0.5"><i class="fas fa-cubes mr-1"></i> GONDA</div></div>
      <div class="glassCard rounded-2xl p-3.5 text-center statCard"><div class="text-2xl md:text-3xl font-black text-emerald-300" id="statSales">0</div><div class="text-[9px] uppercase tracking-wider opacity-60 mt-0.5"><i class="fas fa-chart-line mr-1"></i> SALES</div></div>
      <div class="glassCard rounded-2xl p-3.5 text-center statCard"><div class="text-2xl md:text-3xl font-black text-blue-300" id="statCash">0</div><div class="text-[9px] uppercase tracking-wider opacity-60 mt-0.5"><i class="fas fa-wallet mr-1"></i> CASH</div></div>
      <div class="glassCard rounded-2xl p-3.5 text-center statCard"><div class="text-2xl md:text-3xl font-black text-rose-300" id="statDue">0</div><div class="text-[9px] uppercase tracking-wider opacity-60 mt-0.5"><i class="fas fa-clock mr-1"></i> DUE</div></div>
    </div>

    <!-- Efficiency -->
    <div class="glassPremium rounded-3xl p-4 mb-7 flex flex-wrap items-center justify-between gap-3">
      <div><span class="text-[10px] opacity-50 uppercase"><i class="fas fa-chart-simple"></i> Collection Efficiency</span><div class="text-2xl font-black" id="efficiencyValue">0%</div></div>
      <div class="w-20 h-20"><canvas id="efficiencyDonut" width="80" height="80"></canvas></div>
      <div class="insightPill"><i class="fas fa-chart-line text-green-400 mr-1"></i> Live</div>
    </div>

    <!-- Form Panel -->
    <div class="glassCard rounded-3xl p-5 mb-7" id="formPanel">
      <div class="grid grid-cols-1 gap-3 mb-3"><input type="text" id="customerName" placeholder="Customer Name *" class="rounded-2xl px-4 py-3.5 w-full"></div>
      <div class="grid grid-cols-2 gap-3 mb-3"><input type="number" id="gondaInput" value="0" step="1" placeholder="Gonda" class="rounded-2xl px-4 py-3.5"><input type="number" id="rateInput" value="0" step="any" placeholder="Rate (৳)" class="rounded-2xl px-4 py-3.5"></div>
      <div class="grid grid-cols-2 gap-3 mb-4"><input type="number" id="cashInput" value="0" step="any" placeholder="Cash Paid" class="rounded-2xl px-4 py-3.5"><input type="text" id="duePreview" readonly placeholder="Due will appear" class="rounded-2xl px-4 py-3.5 bg-blue-900/40 border-blue-500/50 font-bold"></div>
      <div class="flex gap-3"><button id="saveButton" class="bg-gradient-to-r from-blue-600 to-indigo-700 py-3.5 rounded-2xl font-bold w-full shadow-xl"><i class="fas fa-save mr-2"></i> Save Record</button><button id="cancelButton" class="bg-white/10 border border-white/20 rounded-2xl w-28 hidden">Cancel</button></div>
    </div>

    <!-- Search & Filters -->
    <div class="flex flex-wrap gap-3 mb-4">
      <div class="flex-1 glassPremium rounded-full flex items-center px-4"><i class="fas fa-search text-blue-400"></i><input type="text" id="searchInput" placeholder="Search customer..." class="bg-transparent p-3.5 w-full outline-none text-sm"></div>
      <button id="dueFilterBtn" class="bg-rose-500/20 px-5 rounded-full text-sm font-semibold border border-rose-500/40"><i class="fas fa-exclamation-triangle"></i> Due Only</button>
      <button id="resetBtn" class="bg-white/5 px-4 rounded-full text-sm"><i class="fas fa-undo-alt"></i></button>
    </div>
    <div class="flex gap-3 mb-6 flex-wrap">
      <input type="date" id="startDateInput" class="bg-black/40 border border-white/20 rounded-full px-4 py-2.5 text-sm">
      <input type="date" id="endDateInput" class="bg-black/40 border border-white/20 rounded-full px-4 py-2.5 text-sm">
      <button id="dateFilterBtn" class="bg-blue-600/40 px-5 rounded-full text-sm font-medium"><i class="fas fa-calendar-alt"></i> Apply</button>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2 mb-5 border-b border-white/10 pb-1">
      <button id="tabAll" class="px-5 py-2.5 text-sm font-semibold border-b-2 border-blue-500 text-blue-300"><i class="fas fa-list-ul mr-1"></i> All Records</button>
      <button id="tabDue" class="px-5 py-2.5 text-sm font-semibold text-white/40"><i class="fas fa-hand-holding-usd mr-1"></i> Due Priority</button>
    </div>

    <!-- Records Container -->
    <div id="recordsContainer" class="space-y-2.5 max-h-[400px] overflow-y-auto scrollCustom pr-1"></div>
  </div>

  <!-- FAB -->
  <div class="fixed bottom-6 right-5 w-14 h-14 rounded-full flex items-center justify-center shadow-2xl z-50 cursor-pointer fabPulse" id="fabBtn" style="background: linear-gradient(135deg, #2563eb, #1e3a8a);"><i class="fas fa-file-export text-2xl text-white"></i></div>
  
  <!-- Export Modal -->
  <div id="exportModal" class="fixed inset-0 bg-black/85 backdrop-blur-xl z-50 hidden justify-center items-center">
    <div class="modalGlass rounded-3xl p-6 w-11/12 max-w-md">
      <div class="flex justify-between items-center mb-5"><h3 class="text-2xl font-black"><i class="fas fa-download text-blue-400"></i> Export Center</h3><span id="closeModalBtn" class="text-3xl cursor-pointer hover:text-white/70">&times;</span></div>
      <button id="pdfExport" class="w-full bg-gradient-to-r from-red-600 to-rose-800 py-3.5 rounded-xl mb-3 font-bold shadow-lg"><i class="fas fa-file-pdf mr-2"></i> PDF Report</button>
      <button id="excelExport" class="w-full bg-gradient-to-r from-green-700 to-emerald-800 py-3.5 rounded-xl mb-3 font-bold shadow-lg"><i class="fas fa-file-excel mr-2"></i> Excel Sheet</button>
      <button id="jpgExport" class="w-full bg-gradient-to-r from-purple-700 to-fuchsia-800 py-3.5 rounded-xl font-bold shadow-lg"><i class="fas fa-camera mr-2"></i> JPG Snapshot</button>
    </div>
  </div>

  <script>
    // ========== DATA STATE ==========
    let records = [];
    let editId = null;
    let dueOnlyMode = false;
    let currentTab = "all";
    let startDateVal = "";
    let endDateVal = "";
    let efficiencyChart = null;

    // ========== HELPER FUNCTIONS ==========
    function saveToLocal() { localStorage.setItem("harvester_titanium_data", JSON.stringify(records)); renderAll(); }
    
    function loadFromLocal() { 
      const stored = localStorage.getItem("harvester_titanium_data"); 
      if(stored) records = JSON.parse(stored); 
      else records = []; 
      renderAll(); 
    }
    
    function updateDuePreview() {
      let g = parseFloat(document.getElementById('gondaInput').value) || 0;
      let r = parseFloat(document.getElementById('rateInput').value) || 0;
      let c = parseFloat(document.getElementById('cashInput').value) || 0;
      let total = g * r;
      let due = total - c > 0 ? total - c : 0;
      document.getElementById('duePreview').value = due.toFixed(2);
    }
    
    document.getElementById('gondaInput').addEventListener('input', updateDuePreview);
    document.getElementById('rateInput').addEventListener('input', updateDuePreview);
    document.getElementById('cashInput').addEventListener('input', updateDuePreview);
    
    // ========== FILTER LOGIC ==========
    function getFilteredRecords() {
      let filtered = [...records];
      let search = document.getElementById('searchInput').value.toLowerCase();
      if(search) filtered = filtered.filter(r => r.name.toLowerCase().includes(search));
      if(dueOnlyMode) filtered = filtered.filter(r => (r.gonda * r.rate - r.cash) > 0.5);
      if(startDateVal || endDateVal) {
        filtered = filtered.filter(r => {
          if(!r.date) return false;
          let d = r.date.split('T')[0];
          if(startDateVal && d < startDateVal) return false;
          if(endDateVal && d > endDateVal) return false;
          return true;
        });
      }
      if(currentTab === "due") {
        filtered = filtered.filter(r => (r.gonda * r.rate - r.cash) > 0.5);
        filtered.sort((a,b) => ((b.gonda*b.rate - b.cash) - (a.gonda*a.rate - a.cash)));
      } else {
        filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
      }
      return filtered;
    }
    
    // ========== DASHBOARD & CHARTS ==========
    function updateDashboard() {
      let totalG = 0, totalSales = 0, totalCashSum = 0, totalDueSum = 0;
      records.forEach(r => {
        totalG += r.gonda;
        let sale = r.gonda * r.rate;
        totalSales += sale;
        totalCashSum += r.cash;
        totalDueSum += (sale - r.cash > 0 ? sale - r.cash : 0);
      });
      document.getElementById('statGonda').innerText = totalG;
      document.getElementById('statSales').innerText = totalSales.toFixed(2);
      document.getElementById('statCash').innerText = totalCashSum.toFixed(2);
      document.getElementById('statDue').innerText = totalDueSum.toFixed(2);
      
      let efficiency = totalSales === 0 ? 0 : (totalCashSum / totalSales) * 100;
      document.getElementById('efficiencyValue').innerText = efficiency.toFixed(1) + "%";
      let health = Math.min(100, Math.floor(efficiency));
      document.getElementById('healthPercent').innerText = health + "%";
      document.getElementById('healthBarFill').style.width = health + "%";
      
      if(efficiencyChart) {
        efficiencyChart.data.datasets[0].data = [efficiency, 100 - efficiency];
        efficiencyChart.update();
      }
      
      // AI Insight
      if(records.length > 0) {
        let maxDue = 0, maxDueName = "";
        records.forEach(r => { let due = (r.gonda * r.rate) - r.cash; if(due > maxDue) { maxDue = due; maxDueName = r.name; } });
        if(maxDue > 0) document.getElementById('aiInsightText').innerHTML = `<i class="fas fa-lightbulb text-yellow-400"></i> Collect from ${maxDueName} (৳${maxDue.toFixed(0)})`;
        else document.getElementById('aiInsightText').innerHTML = `<i class="fas fa-check-circle text-green-400"></i> All dues cleared!`;
      } else {
        document.getElementById('aiInsightText').innerHTML = "Add records to see insights";
      }
      
      // Greeting
      let hour = new Date().getHours();
      if(hour < 12) document.getElementById('greetingText').innerHTML = "☀️ Good Morning, Titan";
      else if(hour < 18) document.getElementById('greetingText').innerHTML = "🌤️ Good Afternoon, King";
      else document.getElementById('greetingText').innerHTML = "🌙 Good Evening, Master";
    }
    
    // ========== RENDER COMPACT CARDS ==========
    function renderRecords() {
      const container = document.getElementById('recordsContainer');
      const filtered = getFilteredRecords();
      if(filtered.length === 0) {
        container.innerHTML = `<div class="glassPremium rounded-2xl p-10 text-center opacity-60"><i class="fas fa-database text-3xl mb-2"></i><p class="text-sm">No records found</p></div>`;
        return;
      }
      let html = '';
      filtered.forEach(rec => {
        let total = rec.gonda * rec.rate;
        let due = total - rec.cash;
        let dueClass = due > 500 ? "dueHigh" : (due > 0 ? "dueMedium" : "");
        let dueBadge = due > 0 ? `<span class="bg-red-500/25 text-red-200 px-2 py-0.5 rounded-full text-[9px] font-bold">Due ৳${due.toFixed(2)}</span>` : `<span class="bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full text-[9px]">Paid</span>`;
        html += `<div class="glassCard rounded-xl p-3 recordCard ${dueClass}">
          <div class="flex justify-between items-start">
            <div class="flex-1">
              <div class="font-extrabold text-sm flex items-center gap-1.5"><i class="fas fa-user-tie text-blue-300 text-xs"></i> ${escapeHtml(rec.name)}</div>
              <div class="flex flex-wrap gap-2 text-[10px] mt-1.5 opacity-80">
                <span><i class="fas fa-cubes"></i> ${rec.gonda}</span>
                <span><i class="fas fa-tag"></i> ৳${rec.rate}</span>
                <span><i class="fas fa-chart-line"></i> ৳${total.toFixed(2)}</span>
                <span><i class="fas fa-wallet"></i> ৳${rec.cash}</span>
                ${dueBadge}
                <span><i class="far fa-calendar-alt"></i> ${rec.date ? rec.date.split('T')[0] : '-'}</span>
              </div>
            </div>
            <div class="flex gap-2">
              <button class="editRecord text-blue-300 text-sm w-7 h-7 rounded-full hover:bg-white/10" data-id="${rec.id}"><i class="fas fa-pen"></i></button>
              <button class="deleteRecord text-rose-300 text-sm w-7 h-7 rounded-full hover:bg-white/10" data-id="${rec.id}"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        </div>`;
      });
      container.innerHTML = html;
      
      document.querySelectorAll('.editRecord').forEach(btn => {
        btn.addEventListener('click', (e) => { let id = btn.getAttribute('data-id'); startEdit(id); e.stopPropagation(); });
      });
      document.querySelectorAll('.deleteRecord').forEach(btn => {
        btn.addEventListener('click', (e) => { if(confirm("Delete permanently?")) { records = records.filter(r => r.id != btn.getAttribute('data-id')); saveToLocal(); } e.stopPropagation(); });
      });
    }
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, (m) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    function startEdit(id) {
      const rec = records.find(r => r.id == id);
      if(rec) {
        editId = id;
        document.getElementById('customerName').value = rec.name;
        document.getElementById('gondaInput').value = rec.gonda;
        document.getElementById('rateInput').value = rec.rate;
        document.getElementById('cashInput').value = rec.cash;
        updateDuePreview();
        document.getElementById('saveButton').innerHTML = '<i class="fas fa-pen-fancy"></i> Update';
        document.getElementById('cancelButton').style.display = 'block';
        gsap.fromTo('#formPanel', { y: 8 }, { y: 0, boxShadow: "0 0 15px rgba(59,130,246,0.3)", duration: 0.3 });
      }
    }
    
    function cancelEdit() {
      editId = null;
      document.getElementById('customerName').value = '';
      document.getElementById('gondaInput').value = '0';
      document.getElementById('rateInput').value = '0';
      document.getElementById('cashInput').value = '0';
      updateDuePreview();
      document.getElementById('saveButton').innerHTML = '<i class="fas fa-save"></i> Save Record';
      document.getElementById('cancelButton').style.display = 'none';
    }
    
    function isDuplicateExcept(name, excludeId) {
      return records.some(r => r.name.toLowerCase().trim() === name.toLowerCase().trim() && r.id != excludeId);
    }
    
    function saveRecord() {
      let name = document.getElementById('customerName').value.trim();
      if(!name) { alert("Customer name required"); return; }
      let gonda = parseFloat(document.getElementById('gondaInput').value) || 0;
      let rate = parseFloat(document.getElementById('rateInput').value) || 0;
      let cash = parseFloat(document.getElementById('cashInput').value) || 0;
      if(isDuplicateExcept(name, editId)) { alert("Duplicate entry prevented!"); return; }
      let today = new Date().toISOString();
      if(editId) {
        let idx = records.findIndex(r => r.id == editId);
        if(idx !== -1) records[idx] = { ...records[idx], name, gonda, rate, cash, date: today };
        editId = null;
      } else {
        records.push({ id: Date.now().toString() + Math.random().toString(36), name, gonda, rate, cash, date: today });
      }
      saveToLocal();
      cancelEdit();
      gsap.fromTo('#recordsContainer', { opacity: 0.95 }, { opacity: 1, duration: 0.2 });
    }
    
    function renderAll() { updateDashboard(); renderRecords(); }
    
    // ========== EXPORT FUNCTIONS ==========
    async function exportPDF() {
      const filtered = getFilteredRecords();
      let totalS = filtered.reduce((a,b)=>a+(b.gonda*b.rate),0);
      let totalC = filtered.reduce((a,b)=>a+b.cash,0);
      let totalD = totalS - totalC;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'mm', 'a4');
      doc.setFont('helvetica');
      doc.setFontSize(16);
      doc.setTextColor(37,99,235);
      doc.text('HARVESTER PRO TITANIUM X - FINANCIAL REPORT', 20, 20);
      doc.setFontSize(9);
      doc.setTextColor(100,100,120);
      doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 30);
      const headers = [['Customer','Gonda','Rate','Total','Cash','Due','Date']];
      const rows = filtered.map(r => { let total = r.gonda * r.rate; let due = total - r.cash >0 ? total - r.cash : 0; return [r.name, r.gonda, r.rate, total.toFixed(2), r.cash.toFixed(2), due.toFixed(2), r.date?.split('T')[0]||''] });
      doc.autoTable({ head: headers, body: rows, startY: 40, theme: 'striped', headStyles: { fillColor: [37,99,235] }, styles: { fontSize: 8 } });
      let finalY = doc.lastAutoTable.finalY + 10;
      doc.setFontSize(11);
      doc.text(`Total Sales: ৳${totalS.toFixed(2)} | Cash: ৳${totalC.toFixed(2)} | Due: ৳${totalD>0?totalD.toFixed(2):0}`, 20, finalY);
      doc.save('Harvester_Report.pdf');
    }

    }
