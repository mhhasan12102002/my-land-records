<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Records Pro - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f4f7fa; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .print-area { border: 3px solid #000 !important; width: 100% !important; border-radius: 0 !important; }
            table { width: 100% !important; border: 2.5px solid #000 !important; border-collapse: collapse !important; }
            th { border: 2.5px solid #000 !important; padding: 15px !important; font-size: 24px !important; background: #e5e7eb !important; color: #000 !important; }
            td { border: 2px solid #000 !important; padding: 12px !important; font-size: 22px !important; font-weight: 900 !important; }
            .summary-box-print { display: flex !important; justify-content: space-around; padding: 20px; border-top: 3px solid #000; font-size: 26px; font-weight: 900; }
            @page { size: A4 landscape; margin: 10mm; }
        }
        
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 900; outline: none; font-size: 22px; }
        .summary-box-print { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="bg-slate-900 text-white p-6 rounded-3xl mb-8 flex flex-wrap justify-between items-center gap-4 no-print shadow-2xl border-b-4 border-blue-500">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter">LAND RECORDS SYSTEM</h1>
                <p class="text-xs text-blue-300 font-bold uppercase tracking-widest">Premium Business Manager</p>
            </div>
            <div class="flex gap-3">
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-xl font-black text-sm transition-all shadow-lg">🖨️ PRINT TABLE</button>
                <button onclick="exportImg('captureArea', 'png')" class="bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-xl font-black text-sm transition-all shadow-lg">💾 SAVE PNG</button>
                <button onclick="exportImg('captureArea', 'jpg')" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-xl font-black text-sm transition-all shadow-lg">📸 SAVE JPG</button>
                <button onclick="createNewFile()" class="bg-red-600 hover:bg-red-700 px-6 py-2 rounded-xl font-black text-sm">🗑️ RESET</button>
            </div>
        </div>

        <div id="captureArea" class="bg-white border-2 border-gray-200 rounded-3xl overflow-hidden shadow-2xl print-area">
            <div class="p-8 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-3xl font-black text-slate-800">জমির হিসাব তালিকা</h2>
                <div class="flex items-center gap-3">
                    <span class="font-black text-gray-500 uppercase text-sm">Date:</span>
                    <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-black text-2xl border-2 border-blue-200 rounded-xl px-4 py-1 text-blue-700 outline-none focus:border-blue-500">
                </div>
            </div>

            <table class="w-full text-center">
                <thead class="bg-slate-800 text-white">
                    <tr>
                        <th class="p-6 border-r border-slate-700 text-2xl font-black">ক্রেতার নাম</th>
                        <th class="p-6 border-r border-slate-700 text-2xl font-black text-amber-300">জমি (গন্ডা)</th>
                        <th class="p-6 border-r border-slate-700 text-2xl font-black">রেট</th>
                        <th class="p-6 border-r border-slate-700 text-2xl font-black text-blue-300">মোট টাকা</th>
                        <th class="p-6 border-r border-slate-700 text-green-400 text-2xl font-black">নগদ</th>
                        <th class="p-6 text-red-400 text-2xl font-black">বাকি</th>
                        <th class="p-6 no-print">#</th>
                    </tr>
                </thead>
                <tbody id="mainTableBody"></tbody>
            </table>

            <div class="summary-box-print">
                <span>মোট বিক্রি: <span id="printTotal" class="text-blue-700">0</span></span>
                <span>মোট নগদ: <span id="printCash" class="text-green-700">0</span></span>
                <span>মোট বাকি: <span id="printDue" class="text-red-700">0</span></span>
            </div>
        </div>

        <button onclick="addRow()" class="w-full p-6 bg-white border-4 border-dashed border-gray-300 text-gray-400 font-black hover:bg-gray-50 no-print mt-8 rounded-3xl text-2xl transition-all shadow-md">
            + নতুন এন্ট্রি যোগ করুন
        </button>

        <div id="dueCaptureArea" class="mt-16 bg-white rounded-3xl shadow-2xl border-2 border-red-100 overflow-hidden print-area">
            <div class="p-8 bg-red-700 text-white flex justify-between items-center no-print">
                <div>
                    <h3 class="text-3xl font-black italic tracking-wider">আজকের বাকি টাকা</h3>
                    <p class="text-xs font-bold text-red-200 uppercase">Pending Payments Ledger</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="printSection('dueCaptureArea')" class="bg-white text-red-700 px-6 py-2 rounded-xl font-black text-sm shadow-lg hover:scale-105 transition-all">🖨️ PRINT</button>
                    <button onclick="exportImg('dueCaptureArea', 'png')" class="bg-blue-500 text-white px-6 py-2 rounded-xl font-black text-sm shadow-lg">PNG</button>
                    <button onclick="exportImg('dueCaptureArea', 'jpg')" class="bg-emerald-500 text-white px-6 py-2 rounded-xl font-black text-sm shadow-lg">JPG</button>
                </div>
            </div>
            <div id="dueListView" class="p-6 bg-white">
                </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_pro_v15')) || [];
        let curDate = localStorage.getItem('land_date_v15') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = curDate;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_date_v15', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_pro_v15', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = `<table class="w-full border-collapse">
                <tr class="bg-slate-50"><th class="p-5 border-2 text-xl">তারিখ</th><th class="p-5 border-2 text-xl">নাম</th><th class="p-5 border-2 text-xl text-red-600">বাকি টাকা</th></tr>`;
            
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const tot = j * r, due = tot - a;
                tS += tot; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.rt').innerText = tot.toLocaleString();
                    row.querySelector('.rd').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<tr class="text-center font-black text-2xl">
                        <td class="p-5 border-2">${curDate}</td>
                        <td class="p-5 border-2">${item.n || '---'}</td>
                        <td class="p-5 border-2 text-red-600">${due.toLocaleString()} ৳</td>
                    </tr>`;
                }
            });
            dueHTML += `</table>`;
            
            ['printTotal', 'printCash', 'printDue'].forEach((id, i) => {
                const val = [tS, tC, tD][i];
                document.getElementById(id).innerText = val.toLocaleString() + " ৳";
            });
            
            document.getElementById('dueListView').innerHTML = tD > 0 ? dueHTML : "<p class='p-20 text-center text-gray-300 font-black text-2xl'>সব হিসাব পরিশোধিত আছে!</p>";
        }

        function render() {
            const container = document.getElementById('mainTableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const tot = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = tot-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.className = "hover:bg-blue-50 transition-all border-b-2";
                tr.innerHTML = `
                    <td class="p-5 border-r-2"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-box" placeholder="..."></td>
                    <td class="p-5 border-r-2"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-box text-amber-600" placeholder="0"></td>
                    <td class="p-5 border-r-2"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-5 border-r-2 font-black rt text-2xl text-blue-800 bg-gray-50">${tot.toLocaleString()}</td>
                    <td class="p-5 border-r-2"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-box text-green-700" placeholder="0"></td>
                    <td class="p-5 font-black text-red-600 rd text-2xl">${due.toLocaleString()}</td>
                    <td class="p-5 no-print"><button onclick="removeRow(${item.id})" class="text-gray-300 hover:text-red-500 transition-all">✖</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function removeRow(id) { if(confirm('এটি কি ডিলিট করবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_pro_v15', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('সতর্কবাণী: সব ডাটা পার্মানেন্টলি ডিলিট হয়ে যাবে!')) { db=[]; localStorage.removeItem('land_pro_v15'); addRow(); } }

        function exportImg(areaId, format) {
            html2canvas(document.getElementById(areaId), { scale: 3 }).then(canvas => {
                let link = document.createElement('a');
                link.download = `Record_${Date.now()}.${format}`;
                link.href = canvas.toDataURL(format === 'png' ? "image/png" : "image/jpeg", 1.0);
                link.click();
            });
        }

        function printSection(elId) {
            const content = document.getElementById(elId).innerHTML;
            const win = window.open('', '', 'height=800,width=1000');
            win.document.write('<html><head><title>Print Report</title><style>table{width:100%;border-collapse:collapse;margin-top:20px;}th,td{border:2px solid #000;padding:15px;text-align:center;font-family:sans-serif;font-size:22px;}.no-print{display:none;}</style></head><body>');
            win.document.write('<h1 style="text-align:center;font-size:30px;">বাকি টাকার রিপোর্ট</h1>');
            win.document.write(content);
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }

        init();
    </script>
</body>
</html>
