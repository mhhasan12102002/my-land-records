<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=yes">
  <title>Harvester Pro V33 | Premium Mobile Suite</title>
  <!-- GSAP + Font Awesome + Google Fonts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- html2canvas + SheetJS (XLSX) for exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #0A0F1E 0%, #0C1222 100%);
      color: #F1F5F9;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* main container - comfortable margins */
    .app-container {
      max-width: 520px;
      margin: 0 auto;
      padding: 18px 16px 100px 16px;
    }

    /* premium glass morphism */
    .glass-card {
      background: rgba(18, 25, 45, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(66, 153, 225, 0.25);
      border-radius: 36px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    /* dashboard stats - touch friendly */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-item {
      background: linear-gradient(135deg, rgba(15, 25, 45, 0.85), rgba(10, 18, 35, 0.9));
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 14px 6px;
      text-align: center;
      border: 1px solid rgba(59, 130, 246, 0.3);
      transition: transform 0.18s ease;
    }
    .stat-item:active { transform: scale(0.96); }
    .stat-value {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #BEF0FF, #60A5FA);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .stat-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.75;
      margin-top: 5px;
    }

    /* header premium */
    .saas-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .logo h1 {
      font-size: 1.85rem;
      font-weight: 800;
      background: linear-gradient(115deg, #FFFFFF, #7AC7FF, #3B82F6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.25);
      backdrop-filter: blur(4px);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
      border: 0.5px solid rgba(96, 165, 250, 0.5);
    }

    /* form panel - large tap targets */
    .form-panel {
      padding: 22px 20px;
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 18px;
    }
    .input-group label {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.8;
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    input, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      padding: 14px 18px;
      border-radius: 44px;
      color: white;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      background: rgba(0, 0, 0, 0.65);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .row-2col {
      display: flex;
      gap: 14px;
    }
    .row-2col > div { flex: 1; }
    .btn-primary {
      background: linear-gradient(105deg, #2563eb, #1d4ed8);
      border: none;
      padding: 14px;
      border-radius: 48px;
      font-weight: 700;
      color: white;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:active { transform: scale(0.97); background: #1e40af; }
    .btn-secondary {
      background: rgba(37, 99, 235, 0.2);
      border: 1.5px solid #3b82f6;
      padding: 12px;
      border-radius: 48px;
      color: white;
      font-weight: 600;
    }
    .flex-btns {
      display: flex;
      gap: 14px;
      margin-top: 10px;
    }

    /* search + filters - improved spacing */
    .search-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .search-box {
      flex: 2.5;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 50px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .search-box i { color: #60a5fa; font-size: 1rem; }
    .search-box input {
      background: transparent;
      border: none;
      padding: 14px 0;
      font-size: 0.9rem;
    }
    .filter-chip {
      background: rgba(59,130,246,0.18);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-chip.active {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 12px rgba(37,99,235,0.4);
    }
    /* date row */
    .date-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .date-row input {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.8rem;
    }
    .date-row button {
      padding: 0 20px;
      white-space: nowrap;
    }

    /* record cards - super comfortable for mobile */
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 54vh;
      overflow-y: auto;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .records-list::-webkit-scrollbar {
      width: 4px;
    }
    .records-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    .records-list::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 10px;
    }
    .record-card {
      background: rgba(12, 20, 35, 0.8);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 16px 18px;
      border-left: 5px solid #3b82f6;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      cursor: pointer;
    }
    .record-card:active { transform: scale(0.99); background: rgba(20, 35, 55, 0.9); }
    .record-info {
      flex: 3;
    }
    .cust-name {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
      color: #E2E8F0;
    }
    .record-meta {
      font-size: 0.7rem;
      opacity: 0.75;
      display: flex;
      gap: 14px;
      margin-top: 6px;
      flex-wrap: wrap;
      row-gap: 6px;
    }
    .record-actions i {
      margin-left: 14px;
      font-size: 1.3rem;
      cursor: pointer;
      opacity: 0.75;
      transition: 0.2s;
    }
    .record-actions i:active { opacity: 1; transform: scale(1.1); }
    .due-badge {
      background: rgba(220, 38, 38, 0.75);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    /* FAB - improved for thumb reach */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 20px;
      background: linear-gradient(145deg, #2563eb, #1e3a8a);
      width: 60px;
      height: 60px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(96,165,250,0.3);
      cursor: pointer;
      z-index: 99;
      transition: 0.18s;
    }
    .fab:active { transform: scale(0.92); background: #1d4ed8; }
    .fab i { font-size: 30px; color: white; }

    /* Modal premium */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5, 10, 22, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      width: 85%;
      max-width: 400px;
      background: rgba(18, 28, 45, 0.98);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 28px 24px;
      border: 1px solid rgba(59,130,246,0.5);
      box-shadow: 0 25px 40px black;
    }
    .close-modal {
      float: right;
      font-size: 2rem;
      cursor: pointer;
      font-weight: 300;
      line-height: 1;
    }
    .modal button {
      margin-bottom: 14px;
      font-size: 1rem;
      font-weight: 700;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: rgba(255,255,255,0.02);
      border-radius: 48px;
    }

    @media (max-width: 460px) {
      .stats-grid { gap: 8px; }
      .stat-value { font-size: 1.4rem; }
      .stat-label { font-size: 0.6rem; }
      .record-meta { gap: 8px; }
      .cust-name { font-size: 1rem; }
    }
    /* touch friendly larger buttons everywhere */
    button, .filter-chip, .fab, .stat-item { cursor: pointer; touch-action: manipulation; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="saas-header">
    <div class="logo"><h1>🌾 HARVESTER <span style="font-weight:700;">PRO</span></h1></div>
    <div class="badge"><i class="fas fa-chart-simple"></i> PREMIUM V33</div>
  </div>

  <!-- Dashboard stats with better readability -->
  <div class="stats-grid" id="dashboardStats">
    <div class="stat-item"><div class="stat-value" id="totalGonda">0</div><div class="stat-label"><i class="fas fa-cubes"></i> Gonda</div></div>
    <div class="stat-item"><div class="stat-value" id="totalSales">0</div><div class="stat-label"><i class="fas fa-dollar-sign"></i> Sales</div></div>
    <div class="stat-item"><div class="stat-value" id="totalCash">0</div><div class="stat-label"><i class="fas fa-wallet"></i> Cash</div></div>
    <div class="stat-item"><div class="stat-value" id="totalDue">0</div><div class="stat-label"><i class="fas fa-clock"></i> Due</div></div>
  </div>

  <!-- Add / Edit form panel Glass card -->
  <div class="glass-card form-panel" id="formPanel">
    <div class="input-group"><label><i class="fas fa-user-circle"></i> Customer Name</label><input type="text" id="custName" placeholder="e.g., Alom Traders" autocomplete="off"></div>
    <div class="row-2col">
      <div><label><i class="fas fa-weight-hanging"></i> Gonda (Qty)</label><input type="number" id="gondaQty" value="0" step="1" min="0"></div>
      <div><label><i class="fas fa-tag"></i> Rate / Gonda</label><input type="number" id="rateVal" value="0" step="any"></div>
    </div>
    <div class="row-2col">
      <div><label><i class="fas fa-money-bill-wave"></i> Cash Paid</label><input type="number" id="cashPaid" value="0" step="any"></div>
      <div><label><i class="fas fa-calculator"></i> Due (Auto)</label><input type="text" id="dueAuto" readonly style="background:#1f2a3e; font-weight:bold;"></div>
    </div>
    <div class="flex-btns">
      <button class="btn-primary" id="saveBtn"><i class="fas fa-save"></i> Save Record</button>
      <button class="btn-secondary" id="editCancelBtn" style="display:none;"><i class="fas fa-times"></i> Cancel</button>
    </div>
  </div>

  <!-- Smart search + due only + reset -->
  <div class="search-filters">
    <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search customer..."></div>
    <div class="filter-chip" id="dueOnlyChip"><i class="fas fa-exclamation-triangle"></i> Due Only</div>
    <div class="filter-chip" id="resetFilterChip"><i class="fas fa-eraser"></i> Reset</div>
  </div>
  <!-- date-wise filtering improve -->
  <div class="date-row">
    <input type="date" id="startDate" placeholder="From date">
    <input type="date" id="endDate" placeholder="To date">
    <button class="btn-secondary" id="applyDateFilter" style="padding: 0 20px;"><i class="fas fa-filter"></i> Apply</button>
  </div>

  <!-- Records container smooth -->
  <div class="records-list" id="recordsContainer"></div>
</div>

<div class="fab" id="exportFab"><i class="fas fa-file-export"></i></div>

<!-- Export modal -->
<div id="exportModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <h3 style="margin-bottom: 20px; font-weight:800;"><i class="fas fa-print"></i> Export Financials</h3>
    <button id="pdfExportBtn" class="btn-primary" style="margin-bottom: 14px;"><i class="fas fa-file-pdf"></i> 📄 PDF Corporate</button>
    <button id="excelExportBtn" class="btn-primary" style="margin-bottom: 14px; background:#0f5c3e;"><i class="fas fa-file-excel"></i> 📊 Excel Sheet</button>
    <button id="jpgExportBtn" class="btn-primary" style="background:#7e22ce;"><i class="fas fa-camera-retro"></i> 🖼️ JPG Report</button>
  </div>
</div>

<script>
  // ---------- DATA ----------
  let records = [];
  let editModeId = null;
  let dueOnlyActive = false;
  let currentStartDate = "", currentEndDate = "";

  function loadData() {
    const stored = localStorage.getItem("harvester_pro_v33");
    if(stored) records = JSON.parse(stored);
    else records = [];
    renderDashboard();
    renderRecords();
  }

  function saveToLocal() {
    localStorage.setItem("harvester_pro_v33", JSON.stringify(records));
    renderDashboard();
    renderRecords();
  }

  function computeDue(gonda, rate, cash) {
    let total = gonda * rate;
    let due = total - cash;
    return due > 0 ? due : 0;
  }

  function updateDueField() {
    let g = parseFloat(document.getElementById('gondaQty').value) || 0;
    let r = parseFloat(document.getElementById('rateVal').value) || 0;
    let c = parseFloat(document.getElementById('cashPaid').value) || 0;
    let total = g * r;
    let due = total - c;
    if(due < 0) due = 0;
    document.getElementById('dueAuto').value = due.toFixed(2);
  }

  document.getElementById('gondaQty').addEventListener('input', updateDueField);
  document.getElementById('rateVal').addEventListener('input', updateDueField);
  document.getElementById('cashPaid').addEventListener('input', updateDueField);

  function renderDashboard() {
    let totalGonda = 0, totalSales = 0, totalCash = 0, totalDue = 0;
    records.forEach(rec => {
      totalGonda += rec.gonda;
      let saleVal = rec.gonda * rec.rate;
      totalSales += saleVal;
      totalCash += rec.cash;
      totalDue += (saleVal - rec.cash > 0 ? saleVal - rec.cash : 0);
    });
    document.getElementById('totalGonda').innerText = totalGonda;
    document.getElementById('totalSales').innerText = totalSales.toFixed(2);
    document.getElementById('totalCash').innerText = totalCash.toFixed(2);
    document.getElementById('totalDue').innerText = totalDue.toFixed(2);
  }

  function getFilteredRecords() {
    let filtered = [...records];
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    if(searchTerm) filtered = filtered.filter(r => r.customerName.toLowerCase().includes(searchTerm));
    if(dueOnlyActive) {
      filtered = filtered.filter(r => { let total = r.gonda * r.rate; let due = total - r.cash; return due > 0.01; });
    }
    if(currentStartDate || currentEndDate) {
      filtered = filtered.filter(r => {
        if(!r.date) return false;
        let recDate = r.date.split('T')[0];
        if(currentStartDate && recDate < currentStartDate) return false;
        if(currentEndDate && recDate > currentEndDate) return false;
        return true;
      });
    }
    return filtered;
  }

  function escapeHtml(str) { 
    if(!str) return '';
    return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});
  }

  function renderRecords() {
    const container = document.getElementById('recordsContainer');
    const filtered = getFilteredRecords();
    if(filtered.length === 0) {
      container.innerHTML = `<div class="empty-state glass-card"><i class="fas fa-database" style="font-size:3rem; opacity:0.5;"></i><p style="margin-top:12px;">No records found</p></div>`;
      return;
    }
    let html = '';
    filtered.forEach(rec => {
      let totalVal = rec.gonda * rec.rate;
      let dueAmount = totalVal - rec.cash;
      if(dueAmount < 0) dueAmount = 0;
      let dueClass = dueAmount > 0 ? 'due-badge' : '';
      html += `
        <div class="record-card" data-id="${rec.id}">
          <div class="record-info">
            <div class="cust-name">${escapeHtml(rec.customerName)}</div>
            <div class="record-meta">
              <span><i class="fas fa-layer-group"></i> ${rec.gonda} G</span>
              <span><i class="fas fa-rupee-sign"></i> ৳${rec.rate}</span>
              <span><i class="fas fa-chart-line"></i> T: ৳${totalVal.toFixed(2)}</span>
              <span><i class="fas fa-coins"></i> C: ৳${rec.cash.toFixed(2)}</span>
              <span class="${dueClass}"><i class="fas fa-hand-holding-usd"></i> D: ৳${dueAmount.toFixed(2)}</span>
              <span><i class="far fa-calendar-check"></i> ${rec.date ? rec.date.split('T')[0] : 'N/A'}</span>
            </div>
          </div>
          <div class="record-actions">
            <i class="fas fa-pen edit-record" data-id="${rec.id}"></i>
            <i class="fas fa-trash-alt delete-record" data-id="${rec.id}"></i>
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
    document.querySelectorAll('.delete-record').forEach(btn => {
      btn.addEventListener('click', (e) => {
        let id = btn.getAttribute('data-id');
        if(confirm('Delete this record permanently?')) {
          records = records.filter(r => r.id != id);
          saveToLocal();
        }
        e.stopPropagation();
      });
    });
    document.querySelectorAll('.edit-record').forEach(btn => {
      btn.addEventListener('click', (e) => {
        let id = btn.getAttribute('data-id');
        const record = records.find(r => r.id == id);
        if(record) {
          editModeId = id;
          document.getElementById('custName').value = record.customerName;
          document.getElementById('gondaQty').value = record.gonda;
          document.getElementById('rateVal').value = record.rate;
          document.getElementById('cashPaid').value = record.cash;
          updateDueField();
          document.getElementById('saveBtn').innerHTML = '<i class="fas fa-pen-fancy"></i> Update Record';
          document.getElementById('editCancelBtn').style.display = 'block';
          gsap.fromTo('#formPanel', {y: 12, opacity:0.9}, {y:0, opacity:1, duration:0.3});
        }
        e.stopPropagation();
      });
    });
  }

  function isDuplicateNameExceptEdit(name, excludeId) {
    return records.some(r => r.customerName.toLowerCase().trim() === name.toLowerCase().trim() && r.id != excludeId);
  }

  function saveRecord() {
    let name = document.getElementById('custName').value.trim();
    if(!name) { alert("Please enter customer name"); return; }
    let gonda = parseFloat(document.getElementById('gondaQty').value) || 0;
    let rate = parseFloat(document.getElementById('rateVal').value) || 0;
    let cash = parseFloat(document.getElementById('cashPaid').value) || 0;
    if(gonda < 0) gonda = 0;
    if(rate < 0) rate = 0;
    let today = new Date().toISOString();
    if(editModeId !== null) {
      if(isDuplicateNameExceptEdit(name, editModeId)) { alert("Customer name already exists! Duplicate prevented."); return; }
      let index = records.findIndex(r => r.id == editModeId);
      if(index !== -1) {
        records[index] = { ...records[index], customerName: name, gonda, rate, cash, date: today };
        editModeId = null;
      }
    } else {
      if(isDuplicateNameExceptEdit(name, null)) { alert("Duplicate entry! This customer already exists."); return; }
      let newId = Date.now().toString() + Math.floor(Math.random()*10000);
      records.push({ id: newId, customerName: name, gonda, rate, cash, date: today });
    }
    saveToLocal();
    resetForm();
    renderRecords();
    gsap.fromTo('#recordsContainer', {opacity:0.9}, {opacity:1, duration:0.2});
  }

  function resetForm() {
    document.getElementById('custName').value = '';
    document.getElementById('gondaQty').value = '0';
    document.getElementById('rateVal').value = '0';
    document.getElementById('cashPaid').value = '0';
    updateDueField();
    editModeId = null;
    document.getElementById('saveBtn').innerHTML = '<i class="fas fa-save"></i> Save Record';
    document.getElementById('editCancelBtn').style.display = 'none';
  }

  // ========= EXPORTS (premium) ==========
  async function exportAsPDF() {
    const filtered = getFilteredRecords();
    let totalSales = filtered.reduce((s,r)=> s+(r.gonda*r.rate),0);
    let totalCash = filtered.reduce((s,r)=> s+r.cash,0);
    let totalDue = totalSales - totalCash;
    let htmlContent = `<html><head><style>body{font-family:'Inter',sans-serif;padding:30px; background:#fff} h1{color:#1e3a8a;} .report-header{border-bottom:2px solid #2563eb} table{border-collapse:collapse;width:100%} th,td{border:1px solid #cbd5e1;padding:10px;text-align:left} .totals-box{background:#f0f9ff;padding:18px;border-radius:16px;margin-top:24px}</style></head><body>
      <h1>📑 HARVESTER PRO FINANCIAL REPORT</h1><p>Generated: ${new Date().toLocaleString()}</p>
