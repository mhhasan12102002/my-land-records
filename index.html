<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harvester Master v23</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; border-radius: 0 !important; font-family: 'Hind Siliguri', sans-serif; }
        
        body { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; background-attachment: fixed; min-height: 100vh; margin: 0; padding: 20px;
        }

        /* UI: Premium Glass Design */
        .glass-ui {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 25px; border: 1px solid #fff;
            max-width: 800px; margin: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .input-col {
            background: white; border: 2px solid #e2e8f0;
            display: flex; align-items: center; margin-bottom: 10px;
        }
        .label-box { width: 120px; padding: 15px; background: #f8fafc; font-weight: 700; border-right: 2px solid #e2e8f0; }
        .data-input { flex: 1; padding: 15px; font-size: 20px; font-weight: 700; outline: none; border: none; }

        /* Excel-Style Table (Screen) */
        .master-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        .master-table th { background: #0f172a; color: white; padding: 12px; border: 1px solid #334155; font-size: 14px; }
        .master-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; color: #1e293b; }
        .edit-input { width: 100%; border: 2px solid #3b82f6; text-align: center; font-weight: bold; outline: none; }

        /* Excel Print Engine - একদম পরিষ্কার কালো বর্ডার */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .glass-ui { background: white !important; max-width: 100% !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
            table { width: 100% !important; border: 1px solid black !important; }
            th, td { border: 1px solid black !important; color: black !important; padding: 10px !important; font-size: 14px !important; }
            .print-head { display: block !important; text-align: center; margin-bottom: 20px; }
            .print-summary { display: flex !important; justify-content: space-around; border: 1px solid black; border-top: none; padding: 15px; font-weight: bold; }
        }
        .print-head, .print-summary { display: none; }
    </style>
</head>
<body>

    <div class="glass-ui">
        <div class="flex justify-between items-center mb-6 no-print border-b-2 border-slate-200 pb-4">
            <h1 class="text-2xl font-black text-slate-800">Harvester <span class="text-blue-600">v23 PRO</span></h1>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-2 font-bold hover:bg-blue-700">PRINT SHEET</button>
                <button onclick="downloadImage()" class="bg-slate-800 text-white px-6 py-2 font-bold hover:bg-slate-900">SAVE IMAGE</button>
            </div>
        </div>

        <div class="no-print grid grid-cols-1 gap-1">
            <div class="input-col"><span class="label-box">তারিখ</span><input type="date" id="fDate" class="data-input" onchange="localStorage.setItem('v23_date', this.value)"></div>
            <div class="input-col"><span class="label-box">নাম</span><input type="text" id="fName" class="data-input" placeholder="ক্রেতার নাম লিখুন"></div>
            <div class="grid grid-cols-2 gap-1">
                <div class="input-col"><span class="label-box">গন্ডা</span><input type="number" id="fGonda" class="data-input" placeholder="0"></div>
                <div class="input-col"><span class="label-box">রেট</span><input type="number" id="fRate" class="data-input" placeholder="0"></div>
            </div>
            <div class="input-col"><span class="label-box">নগদ</span><input type="number" id="fCash" class="data-input text-emerald-600" placeholder="0"></div>
            
            <button onclick="addEntry()" class="w-full bg-slate-900 text-white py-5 text-2xl font-black mt-2 hover:bg-blue-600 transition-all">
                + SAVE DATA
            </button>
        </div>

        <div id="exportArea" class="bg-white p-2">
            <div class="print-head">
                <h2 style="font-size: 26px; font-weight: 900;">জমির হিসাব বিবরণী</h2>
                <p>তারিখ: <span id="pDate"></span></p>
            </div>

            <table class="master-table">
                <thead>
                    <tr>
                        <th>নাম (ক্লিক করে এডিট)</th>
                        <th>গন্ডা</th>
                        <th>রেট</th>
                        <th>মোট</th>
                        <th>নগদ</th>
                        <th>বাকি</th>
                        <th class="no-print">✕</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>

            <div class="print-summary">
                <div id="ps1"></div><div id="ps2"></div><div id="ps3"></div><div id="ps4"></div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-1 mt-6 no-print">
            <div class="bg-slate-100 p-4 border-b-4 border-slate-400">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট গন্ডা</p>
                <h4 id="sGonda" class="text-xl font-black text-slate-800">0</h4>
            </div>
            <div class="bg-slate-100 p-4 border-b-4 border-blue-500">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট বিক্রি</p>
                <h4 id="sTotal" class="text-xl font-black text-blue-700">0</h4>
            </div>
            <div class="bg-slate-100 p-4 border-b-4 border-emerald-500">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট নগদ</p>
                <h4 id="sCash" class="text-xl font-black text-emerald-700">0</h4>
            </div>
            <div class="bg-slate-100 p-4 border-b-4 border-rose-500">
                <p class="text-[10px] font-bold text-slate-500 uppercase">মোট বাকি</p>
                <h4 id="sDue" class="text-xl font-black text-rose-700">0</h4>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_v23_db')) || [];

        function init() {
            const d = localStorage.getItem('v23_date') || new Date().toISOString().split('T')[0];
            document.getElementById('fDate').value = d;
            document.getElementById('pDate').innerText = d;
            render();
        }

        function addEntry() {
            const n = document.getElementById('fName').value;
            const g = document.getElementById('fGonda').value;
            const r = document.getElementById('fRate').value;
            const c = document.getElementById('fCash').value;

            if(!n || !g || !r) return alert("সব ঘর পূরণ করুন!");

            db.push({ id: Date.now(), n, g, r, c });
            localStorage.setItem('land_v23_db', JSON.stringify(db));
            ['fName','fGonda','fRate','fCash'].forEach(id => document.getElementById(id).value = '');
            render();
        }

        function updateItem(id, key, val) {
            const idx = db.findIndex(x => x.id === id);
            db[idx][key] = val;
            localStorage.setItem('land_v23_db', JSON.stringify(db));
            render();
        }

        function render() {
            const body = document.getElementById('dataTable');
            body.innerHTML = '';
            let mG=0, mT=0, mC=0, mD=0;

            db.forEach(item => {
                const total = item.g * item.r;
                const cash = parseFloat(item.c) || 0;
                const due = total - cash;
                
                mG += parseFloat(item.g); mT += total; mC += cash; mD += due;

                body.innerHTML += `
                    <tr>
                        <td><input class="edit-input" type="text" value="${item.n}" onchange="updateItem(${item.id}, 'n', this.value)"></td>
                        <td><input class="edit-input" type="number" value="${item.g}" onchange="updateItem(${item.id}, 'g', this.value)"></td>
                        <td><input class="edit-input" type="number" value="${item.r}" onchange="updateItem(${item.id}, 'r', this.value)"></td>
                        <td class="font-bold">${total.toLocaleString()}</td>
                        <td><input class="edit-input text-emerald-600" type="number" value="${item.c}" onchange="updateItem(${item.id}, 'c', this.value)"></td>
                        <td class="font-bold text-rose-600">${due.toLocaleString()}</td>
                        <td class="no-print"><button onclick="del(${item.id})" class="text-slate-300 hover:text-red-600 font-bold">✕</button></td>
                    </tr>
                `;
            });

            document.getElementById('sGonda').innerText = mG;
            document.getElementById('sTotal').innerText = mT.toLocaleString();
            document.getElementById('sCash').innerText = mC.toLocaleString();
            document.getElementById('sDue').innerText = mD.toLocaleString();
            
            // Print Summary Setup
            document.getElementById('ps1').innerText = "মোট গন্ডা: " + mG;
            document.getElementById('ps2').innerText = "মোট বিক্রি: " + mT.toLocaleString();
            document.getElementById('ps3').innerText = "মোট নগদ: " + mC.toLocaleString();
            document.getElementById('ps4').innerText = "মোট বাকি: " + mD.toLocaleString();
        }

        function del(id) { if(confirm('Delete?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_v23_db', JSON.stringify(db)); render(); } }

        function downloadImage() {
            const target = document.getElementById('exportArea');
            html2canvas(target, { scale: 4, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Land_Report_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        init();
    </script>
</body>
</html>
