<!-- GOOGLE FONT FOR BANGLA -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>

.report-sheet{
    width:1400px;
    background:white;
    padding:50px;
    font-family:'Noto Sans Bengali',sans-serif;
    color:#111827;
}

.report-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:6px solid #2563eb;
    padding-bottom:25px;
    margin-bottom:35px;
}

.report-brand h1{
    font-size:52px;
    font-weight:900;
    color:#2563eb;
    line-height:1;
}

.report-brand p{
    font-size:20px;
    margin-top:8px;
    color:#475569;
    font-weight:700;
}

.report-meta{
    text-align:right;
}

.report-meta h3{
    font-size:20px;
    color:#64748b;
}

.report-meta h2{
    font-size:30px;
    font-weight:900;
    margin-top:6px;
}

.report-table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.report-table thead tr{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.report-table th{
    padding:24px 18px;
    color:white;
    font-size:24px;
    font-weight:900;
    text-align:center;
    border:2px solid #dbeafe;
}

.report-table td{
    padding:22px 18px;
    font-size:22px;
    font-weight:800;
    border:1px solid #cbd5e1;
    text-align:center;
}

.report-table tbody tr:nth-child(even){
    background:#f8fafc;
}

.report-table tbody tr:hover{
    background:#eff6ff;
}

.total-box{
    margin-top:35px;
    background:linear-gradient(135deg,#eff6ff,#dbeafe);
    border:3px solid #2563eb;
    border-radius:26px;
    padding:28px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.total-card{
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 20px rgba(37,99,235,.08);
}

.total-card h5{
    font-size:16px;
    color:#64748b;
    margin-bottom:10px;
    font-weight:800;
}

.total-card h2{
    font-size:34px;
    font-weight:900;
}

.blue-text{
    color:#2563eb;
}

.green-text{
    color:#10b981;
}

.red-text{
    color:#ef4444;
}

.signature{
    margin-top:60px;
    display:flex;
    justify-content:space-between;
}

.sign-box{
    width:260px;
    text-align:center;
}

.sign-line{
    border-top:3px solid #111827;
    margin-bottom:10px;
}

.sign-box h4{
    font-size:18px;
    font-weight:800;
}

</style>

<script>

function createProfessionalReport(){

    const totalSales = database.reduce((sum,item)=>
        sum + (item.gonda * item.rate),0);

    const totalCash = database.reduce((sum,item)=>
        sum + item.cash,0);

    const totalDue = totalSales - totalCash;

    let rows = '';

    database.forEach(item=>{

        const total = item.gonda * item.rate;
        const due = total - item.cash;

        rows += `
        <tr>
            <td>${item.name}</td>
            <td>${item.gonda}</td>
            <td>৳ ${item.rate}</td>
            <td class="blue-text">৳ ${total}</td>
            <td class="green-text">৳ ${item.cash}</td>
            <td class="red-text">৳ ${due}</td>
            <td>${item.date}</td>
        </tr>
        `;
    });

    return `
    <div class="report-sheet" id="professionalReport">

        <div class="report-header">

            <div class="report-brand">
                <h1>HARVESTER REPORT</h1>
                <p>Professional Business Accounting Report</p>
            </div>

            <div class="report-meta">
                <h3>Generated Date</h3>
                <h2>${new Date().toLocaleDateString('bn-BD')}</h2>
            </div>

        </div>

        <table class="report-table">

            <thead>
                <tr>
                    <th>কাস্টমার</th>
                    <th>গন্ডা</th>
                    <th>রেট</th>
                    <th>মোট</th>
                    <th>নগদ</th>
                    <th>বাকি</th>
                    <th>তারিখ</th>
                </tr>
            </thead>

            <tbody>
                ${rows}
            </tbody>

        </table>

        <div class="total-box">

            <div class="total-card">
                <h5>মোট বিক্রি</h5>
                <h2 class="blue-text">৳ ${totalSales}</h2>
            </div>

            <div class="total-card">
                <h5>মোট নগদ</h5>
                <h2 class="green-text">৳ ${totalCash}</h2>
            </div>

            <div class="total-card">
                <h5>মোট বাকি</h5>
                <h2 class="red-text">৳ ${totalDue}</h2>
            </div>

        </div>

        <div class="signature">

            <div class="sign-box">
                <div class="sign-line"></div>
                <h4>Customer Signature</h4>
            </div>

            <div class="sign-box">
                <div class="sign-line"></div>
                <h4>Authorized Signature</h4>
            </div>

        </div>

    </div>
    `;
}

function exportPDF(){

    const temp = document.createElement('div');

    temp.innerHTML = createProfessionalReport();

    document.body.appendChild(temp);

    const report = document.getElementById('professionalReport');

    html2canvas(report,{
        scale:3,
        useCORS:true
    }).then(canvas=>{

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF('l','mm','a4');

        const width = pdf.internal.pageSize.getWidth();

        const height = canvas.height * width / canvas.width;

        pdf.addImage(
            canvas.toDataURL('image/png'),
            'PNG',
            0,
            0,
            width,
            height
        );

        pdf.save('harvester-report.pdf');

        document.body.removeChild(temp);

        showToast('Professional PDF Exported');

    });

}

function exportJPG(){

    const temp = document.createElement('div');

    temp.innerHTML = createProfessionalReport();

    document.body.appendChild(temp);

    const report = document.getElementById('professionalReport');

    html2canvas(report,{
        scale:3,
        useCORS:true
    }).then(canvas=>{

        const a = document.createElement('a');

        a.href = canvas.toDataURL('image/jpeg',1);

        a.download = 'harvester-report.jpg';

        a.click();

        document.body.removeChild(temp);

        showToast('Professional Image Exported');

    });

}

</script>
