<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Admin Pro - Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f0f2f5; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
            .print-area { border: 2px solid #000 !important; width: 100% !important; }
            .summary-text { display: block !important; border-top: 2px solid #000; padding-top: 10px; font-weight: 900; }
        }
        
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; outline: none; }
        .btn { transition: all 0.2s; font-weight: bold; padding: 8px 16px; rounded: 8px; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-6xl mx-auto">
        <div class="bg-gray-900 text-white p-5 rounded-2xl mb-6 flex flex-wrap justify-between items-center gap-3 no-print shadow-xl">
            <div>
                <h1 class="text-xl font-black italic">ADMIN CLOUD PANEL</h1>
                <p class="text-[10px] text-blue-400 uppercase">Secure Land Records System</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="exportImg('png')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs">💾 PNG</button>
                <button onclick="exportImg('jpg')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs">📸 JPG</button>
                <button onclick="syncToCloud()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-xs">☁️ SYNC ONLINE</button>
                <button onclick="createNewFile()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-xs">+ NEW</button>
            </div>
        </div>

        <div id="captureArea" class="bg-white border shadow-sm rounded-xl overflow-hidden print-area">
            <div class="p-5 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-lg font-black text-gray-700">জমির হিসাব (অনলাইন ব্যাকআপ সচল)</h2>
                <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-bold border rounded px-2 py-1 text-blue-600">
            </div>

            <table class="w-full">
                <thead class="bg-gray-800 text-white text-[10px] uppercase">
                    <tr>
                        <th class="p-3 border-r border-gray-700">নাম</th>
                        <th class="p-3 border-r border-gray-700">জমি (গন্ডা)</th>
                        <th class="p-3 border-r border-gray-700">রেট</th>
                        <th class="p-3 border-r border-gray-700">মোট টাকা</th>
                        <th class="p-3 border-r border-gray-700 text-green-400">নগদ</th>
                        <th class="p-3 text-red-400">বাকি</th>
                        <th class="p-3 no-print">#</th>
                    </tr>
                </thead>
                <tbody id="mainTableBody"></tbody>
            </table>

            <div class="p-5 bg-gray-50 border-t summary-text text-lg font-black flex justify-around">
                <p>মোট বিক্রি: <span id="sumTotal" class="text-blue-600">0</span></p>
                <p>মোট নগদ: <span id="sumCash" class="text-green-600">0</span></p>
                <p>মোট বাকি: <span id="sumDue" class="text-red-600">0</span></p>
            </div>
        </div>

        <button onclick="addRow()" class="w-full mt-4 p-3 bg-gray-200 hover:bg-gray-300 font-black no-print rounded-lg">
            + নতুন এন্ট্রি যোগ করুন
        </button>

        <div class="mt-8 bg-white rounded-xl shadow border border-red-100 no-print">
            <div class="p-4 bg-red-50 border-b flex justify-between items-center">
                <h3 class="font-black text-red-700">বাকি টাকার অ্যাডমিন হিস্ট্রি</h3>
            </div>
            <div id="dueListView" class="p-2"></div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_cloud_v10')) || [];
        let curDate = localStorage.getItem('land_date_v10') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = curDate;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_date_v10', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_cloud_v10', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = "";
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const tot = j * r, due = tot - a;
                tS += tot; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.rt').innerText = tot.toLocaleString();
                    row.querySelector('.rd').innerText = due.toLocaleString();
                }
                if(due > 0) {
                    dueHTML += `<div class="p-3 border-b flex justify-between text-sm font-bold">
                        <span>${curDate} | ${item.n || 'N/A'}</span>
                        <span class="text-red-600">${due.toLocaleString()} ৳</span>
                    </div>`;
                }
            });
            document.getElementById('sumTotal').innerText = tS.toLocaleString();
            document.getElementById('sumCash').innerText = tC.toLocaleString();
            document.getElementById('sumDue').innerText = tD.toLocaleString();
            document.getElementById('dueListView').innerHTML = dueHTML || "<p class='p-4 text-center text-gray-400'>সব পরিশোধিত</p>";
        }

        function render() {
            const container = document.getElementById('mainTableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const tot = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = tot-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.className = "border-b text-sm font-bold";
                tr.setAttribute('data-id', item.id);
                tr.innerHTML = `
                    <td class="p-2 border-r"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-box"></td>
                    <td class="p-2 border-r"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-box"></td>
                    <td class="p-2 border-r"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-box"></td>
                    <td class="p-2 border-r bg-gray-50 rt">${tot.toLocaleString()}</td>
                    <td class="p-2 border-r"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-box text-green-700"></td>
                    <td class="p-2 text-red-600 rd">${due.toLocaleString()}</td>
                    <td class="p-2 no-print"><button onclick="removeRow(${item.id})" class="text-gray-300 hover:text-red-500">✖</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function removeRow(id) { if(confirm('মুছবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_cloud_v10', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('সব মুছে যাবে। নিশ্চিত?')) { db=[]; localStorage.removeItem('land_cloud_v10'); addRow(); } }

        // Export JPG/PNG
        function exportImg(format) {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                let link = document.createElement('a');
                link.download = `Land_Record_${curDate}.${format}`;
                link.href = canvas.toDataURL(format === 'png' ? "image/png" : "image/jpeg");
                link.click();
            });
        }

        // Online Sync System (Admin Panel Simulation)
        async function syncToCloud() {
            const btn = event.target;
            btn.innerText = "Syncing...";
            // এখানে আমরা JSONBin API ব্যবহার করছি ডাটা অনলাইনে রাখার জন্য
            const data = { date: curDate, records: db };
            try {
                const response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2b$10$Your_Key_Here_If_Needed' },
                    body: JSON.stringify(data)
                });
                alert("ডাটা অনলাইনে সেভ হয়েছে! আপনার এই ব্রাউজার বা ফোন হারালেও ডাটা নিরাপদ।");
            } catch (e) {
                alert("অফলাইন মোডে সেভ হয়েছে। নেট কানেকশন চেক করুন।");
            }
            btn.innerText = "☁️ SYNC ONLINE";
        }

        init();
    </script>
</body>
</html>
