<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Harvester Pro Mobile V33</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--bg:#050816;
--card:#0f172a;
--glass:rgba(255,255,255,.06);
--border:rgba(255,255,255,.08);
--primary:#2563eb;
--secondary:#06b6d4;
--success:#10b981;
--danger:#ef4444;
--warning:#f59e0b;
--text:#ffffff;
--muted:#94a3b8;
--radius:26px;
--shadow:0 20px 50px rgba(0,0,0,.35);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
font-family:'Hind Siliguri',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#1d4ed8 0%,transparent 25%),
radial-gradient(circle at bottom right,#0f766e 0%,transparent 25%),
linear-gradient(135deg,#020617,#0f172a,#111827);
min-height:100vh;
color:white;
overflow-x:hidden;
padding-bottom:120px;
}

::-webkit-scrollbar{
width:0;
}

.app{
max-width:700px;
margin:auto;
padding:18px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:24px;
}

.brand h1{
font-size:32px;
font-weight:900;
line-height:1;
}

.brand span{
color:#3b82f6;
}

.brand p{
color:#94a3b8;
font-size:13px;
margin-top:6px;
}

.live{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
padding:12px 18px;
border-radius:18px;
font-size:12px;
font-weight:800;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-bottom:22px;
}

.card{
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border-radius:28px;
padding:22px;
position:relative;
overflow:hidden;
box-shadow:var(--shadow);
}

.card::before{
content:'';
position:absolute;
width:120px;
height:120px;
background:rgba(255,255,255,.05);
right:-40px;
top:-40px;
border-radius:50%;
}

.card h5{
font-size:12px;
text-transform:uppercase;
letter-spacing:1px;
color:#cbd5e1;
margin-bottom:8px;
}

.card h2{
font-size:28px;
font-weight:900;
}

.blue{color:#60a5fa;}
.green{color:#34d399;}
.red{color:#f87171;}
.orange{color:#fbbf24;}

.panel{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:30px;
padding:20px;
margin-bottom:20px;
box-shadow:var(--shadow);
}

.section{
font-size:22px;
font-weight:900;
margin-bottom:18px;
}

.search{
width:100%;
height:58px;
border:none;
outline:none;
background:rgba(255,255,255,.06);
border-radius:18px;
padding:0 18px;
font-size:16px;
font-weight:700;
color:white;
margin-bottom:18px;
}

.search::placeholder{
color:#94a3b8;
}

.list{
display:flex;
flex-direction:column;
gap:14px;
}

.item{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:18px;
transition:.35s;
}

.item:hover{
transform:translateY(-3px);
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.name{
font-size:18px;
font-weight:900;
}

.date{
font-size:12px;
color:#94a3b8;
margin-top:4px;
}

.price{
font-size:20px;
font-weight:900;
}

.meta{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:14px;
}

.meta-box{
background:rgba(255,255,255,.04);
padding:12px;
border-radius:16px;
text-align:center;
}

.meta-box h6{
font-size:10px;
text-transform:uppercase;
color:#94a3b8;
margin-bottom:6px;
}

.meta-box p{
font-size:16px;
font-weight:800;
}

.actions{
display:flex;
gap:10px;
margin-top:14px;
}

.btn{
flex:1;
height:46px;
border:none;
border-radius:16px;
font-size:15px;
font-weight:900;
color:white;
cursor:pointer;
}

.edit{
background:linear-gradient(135deg,#0ea5e9,#2563eb);
}

.delete{
background:linear-gradient(135deg,#ef4444,#dc2626);
}

.fab{
position:fixed;
right:22px;
bottom:95px;
width:78px;
height:78px;
border:none;
border-radius:50%;
background:linear-gradient(135deg,#2563eb,#06b6d4);
color:white;
font-size:42px;
font-weight:900;
box-shadow:0 20px 40px rgba(37,99,235,.4);
z-index:999;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.75);
backdrop-filter:blur(10px);
display:flex;
align-items:flex-end;
justify-content:center;
opacity:0;
pointer-events:none;
transition:.35s;
z-index:9999;
}

.modal.active{
opacity:1;
pointer-events:auto;
}

.sheet{
width:100%;
max-width:700px;
background:#08101f;
border-radius:34px 34px 0 0;
padding:26px 20px 40px;
transform:translateY(100px);
transition:.35s;
max-height:92vh;
overflow:auto;
}

.modal.active .sheet{
transform:translateY(0);
}

.handle{
width:80px;
height:6px;
background:#334155;
border-radius:20px;
margin:0 auto 20px;
}

.input{
width:100%;
height:62px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:0 18px;
margin-bottom:14px;
font-size:17px;
font-weight:700;
color:white;
outline:none;
}

.input::placeholder{
color:#94a3b8;
}

.save{
width:100%;
height:64px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
font-size:18px;
font-weight:900;
color:white;
margin-top:10px;
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
height:74px;
background:rgba(2,6,23,.9);
backdrop-filter:blur(20px);
border-top:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-around;
align-items:center;
z-index:999;
}

.nav-btn{
background:none;
border:none;
color:#94a3b8;
font-size:12px;
font-weight:800;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
}

.nav-btn.active{
color:white;
}

.export-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:10px;
}

.export-btn{
height:58px;
border:none;
border-radius:18px;
font-size:14px;
font-weight:900;
color:white;
}

.pdf{background:linear-gradient(135deg,#ef4444,#dc2626);}

.jpg{background:linear-gradient(135deg,#0ea5e9,#2563eb);}

.csv{background:linear-gradient(135deg,#10b981,#059669);}

.backup{background:linear-gradient(135deg,#f59e0b,#d97706);}

.empty{
padding:50px 20px;
text-align:center;
color:#94a3b8;
font-weight:800;
}

.toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%) translateY(-100px);
background:#10b981;
padding:16px 24px;
border-radius:20px;
font-weight:900;
transition:.4s;
z-index:99999;
}

.toast.show{
transform:translateX(-50%) translateY(0);
}

@media(max-width:480px){
.brand h1{
font-size:28px;
}

.card h2{
font-size:22px;
}

.grid{
gap:10px;
}

.card{
padding:18px;
}
}
</style>
</head>
<body>

<div class="toast" id="toast">Saved Successfully</div>

<div class="app">

<div class="top">
<div class="brand">
<h1>HARVESTER <span>PRO</span></h1>
<p>Mobile Business Manager</p>
</div>

<div class="live" id="clock">00:00</div>
</div>

<div class="grid">
<div class="card">
<h5>Total Gonda</h5>
<h2 class="orange" id="gonda">0</h2>
</div>

<div class="card">
<h5>Total Sales</h5>
<h2 class="blue" id="sales">0</h2>
</div>

<div class="card">
<h5>Total Cash</h5>
<h2 class="green" id="cash">0</h2>
</div>

<div class="card">
<h5>Total Due</h5>
<h2 class="red" id="due">0</h2>
</div>
</div>

<div class="panel">
<div class="section">Records</div>
<input type="text" class="search" id="search" placeholder="Search customer...">
<div class="list" id="list"></div>
</div>

<div class="panel">
<div class="section">Export Center</div>
<p style="color:#94a3b8;font-size:14px;margin-bottom:16px;">Professional Excel Style Export System</p>
<div class="export-grid">
<button class="export-btn pdf" onclick="exportPDF()">EXPORT PDF</button>
<button class="export-btn jpg" onclick="exportJPG()">EXPORT IMAGE</button>
<button class="export-btn csv" onclick="exportExcelStyle()">EXPORT EXCEL</button>
</div>
</div>

<div class="panel">
<div class="section">Due Collection List</div>
<div id="dueList" class="list"></div>
</div>

</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="modal">
<div class="sheet">
<div class="handle"></div>

<div style="font-size:26px;font-weight:900;margin-bottom:18px;">Add Record</div>

<input type="date" class="input" id="date">
<input type="text" class="input" id="name" placeholder="Customer Name">
<input type="number" class="input" id="gondaInput" placeholder="Gonda">
<input type="number" class="input" id="rate" placeholder="Rate">
<input type="number" class="input" id="cashInput" placeholder="Cash Paid">
<input type="text" class="input" id="phone" placeholder="Phone Number">

<button class="save" onclick="saveRecord()">SAVE RECORD</button>
</div>
</div>

<script>
let database = JSON.parse(localStorage.getItem('harvester_mobile_v33')) || [];
let editId = null;

const modal = document.getElementById('modal');
const list = document.getElementById('list');
const toast = document.getElementById('toast');

function init(){
document.getElementById('date').value = new Date().toISOString().split('T')[0];
render();
clock();
intro();
}

function intro(){
gsap.from('.card',{
y:40,
opacity:0,
duration:1,
stagger:.12,
ease:'power4.out'
});

gsap.from('.panel',{
y:50,
opacity:0,
duration:1,
stagger:.15,
ease:'power4.out'
});
}

function clock(){
setInterval(()=>{
const d = new Date();
const time = d.toLocaleTimeString();
document.getElementById('clock').innerText = time;
},1000);
}

function showToast(text){
toast.innerText = text;
toast.classList.add('show');

setTimeout(()=>{
toast.classList.remove('show');
},2200);
}

function openModal(){
modal.classList.add('active');
}

modal.addEventListener('click',e=>{
if(e.target === modal){
modal.classList.remove('active');
}
});

function clearForm(){
['name','gondaInput','rate','cashInput','phone'].forEach(id=>{
document.getElementById(id).value = '';
});
}

function saveRecord(){
const data = {
id: editId || Date.now(),
date: document.getElementById('date').value,
name: document.getElementById('name').value,
gonda: Number(document.getElementById('gondaInput').value),
rate: Number(document.getElementById('rate').value),
cash: Number(document.getElementById('cashInput').value || 0),
phone: document.getElementById('phone').value
};

if(!data.name || !data.gonda || !data.rate){
showToast('Fill Required Fields');
return;
}

if(editId){
database = database.map(item=>item.id===editId ? data : item);
showToast('Record Updated');
editId = null;
}else{
database.unshift(data);
showToast('Record Saved');
}

localStorage.setItem('harvester_mobile_v33',JSON.stringify(database));

clearForm();
modal.classList.remove('active');
render();
}

function render(){
const keyword = document.getElementById('search').value?.toLowerCase() || '';

const filtered = database.filter(item=>
item.name.toLowerCase().includes(keyword)
);

if(filtered.length===0){
list.innerHTML = '<div class="empty">No Records Found</div>';
}else{
list.innerHTML = filtered.map(item=>{
const total = item.gonda * item.rate;
const due = total - item.cash;

return `
<div class="item">
<div class="row">
<div>
<div class="name">${item.name}</div>
<div class="date">${item.date}</div>
</div>
<div class="price">৳ ${total}</div>
</div>

<div class="meta">
<div class="meta-box">
<h6>Gonda</h6>
<p>${item.gonda}</p>
</div>

<div class="meta-box">
<h6>Cash</h6>
<p class="green">${item.cash}</p>
</div>

<div class="meta-box">
<h6>Due</h6>
<p class="red">${due}</p>
</div>
</div>

<div class="actions">
<button class="btn edit" onclick="editRecord(${item.id})">EDIT</button>
<button class="btn delete" onclick="deleteRecord(${item.id})">DELETE</button>
</div>
</div>
`;
}).join('');
}

renderDueList();
calculate();
}

function calculate(){
let totalGonda = 0;
let totalSales = 0;
let totalCash = 0;
let totalDue = 0;

database.forEach(item=>{
const total = item.gonda * item.rate;
const due = total - item.cash;

totalGonda += item.gonda;
totalSales += total;
totalCash += item.cash;
totalDue += due;
});

document.getElementById('gonda').innerText = totalGonda;
document.getElementById('sales').innerText = '৳ ' + totalSales;
document.getElementById('cash').innerText = '৳ ' + totalCash;
document.getElementById('due').innerText = '৳ ' + totalDue;
}

function deleteRecord(id){
if(confirm('Delete Record?')){
database = database.filter(item=>item.id!==id);
localStorage.setItem('harvester_mobile_v33',JSON.stringify(database));
render();
showToast('Deleted');
}
}

function editRecord(id){
const item = database.find(i=>i.id===id);
if(!item) return;

editId = id;

openModal();

document.getElementById('date').value = item.date;
document.getElementById('name').value = item.name;
document.getElementById('gondaInput').value = item.gonda;
document.getElementById('rate').value = item.rate;
document.getElementById('cashInput').value = item.cash;
document.getElementById('phone').value = item.phone;

showToast('Edit Mode');
}

function scrollToTop(){
window.scrollTo({top:0,behavior:'smooth'});
}

function exportPDF(){
html2canvas(document.body,{scale:2}).then(canvas=>{
const { jsPDF } = window.jspdf;
const pdf = new jsPDF('p','mm','a4');
const width = pdf.internal.pageSize.getWidth();
const height = canvas.height * width / canvas.width;

pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,width,height);
pdf.save('harvester-report.pdf');

showToast('PDF Saved');
});
}

function exportJPG(){
html2canvas(document.body,{scale:2}).then(canvas=>{
const a = document.createElement('a');
a.href = canvas.toDataURL('image/jpeg',1);
a.download = 'harvester-report.jpg';
a.click();

showToast('JPG Saved');
});
}

function exportExcelStyle(){
let html = `
<html>
<head>
<meta charset="UTF-8">
<style>
body{
font-family:Arial;
padding:30px;
}

table{
width:100%;
border-collapse:collapse;
font-size:18px;
}

th{
background:#2563eb;
color:white;
padding:14px;
border:2px solid #000;
}

td{
padding:12px;
border:1px solid #000;
font-weight:bold;
}

h1{
text-align:center;
margin-bottom:30px;
}
</style>
</head>
<body>
<h1>HARVESTER PROFESSIONAL REPORT</h1>
<table>
<tr>
<th>Name</th>
<th>Gonda</th>
<th>Rate</th>
<th>Total</th>
<th>Cash</th>
<th>Due</th>
<th>Date</th>
</tr>
`;

database.forEach(item=>{
const total = item.gonda * item.rate;
const due = total - item.cash;

html += `
<tr>
<td>${item.name}</td>
<td>${item.gonda}</td>
<td>${item.rate}</td>
<td>${total}</td>
<td>${item.cash}</td>
<td>${due}</td>
<td>${item.date}</td>
</tr>
`;
});

html += `</table></body></html>`;

const blob = new Blob([html],{type:'application/vnd.ms-excel'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'harvester-report.xls';
a.click();

showToast('Excel Report Exported');
}

function renderDueList(){
const dueList = document.getElementById('dueList');

const dueItems = database.filter(item=>{
const total = item.gonda * item.rate;
return total - item.cash > 0;
});

if(dueItems.length===0){
dueList.innerHTML = '<div class="empty">No Due Remaining</div>';
return;
}

dueList.innerHTML = dueItems.map(item=>{
const total = item.gonda * item.rate;
const due = total - item.cash;

return `
<div class="item">
<div class="row">
<div>
<div class="name">${item.name}</div>
<div class="date">Pending Payment</div>
</div>
<div class="price red">৳ ${due}</div>
</div>
</div>
`;
}).join('');
}

document.getElementById('search').addEventListener('input',render);

window.addEventListener('keydown',e=>{
if(e.ctrlKey && e.key==='s'){
e.preventDefault();
saveRecord();
}
});

init();
</script>

</body>
</html>
