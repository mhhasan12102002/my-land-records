<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Admin Pro - Full System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans Bengali', sans-serif; background: #f3f4f6; color: #1f2937; }
        
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .print-area { border: none !important; box-shadow: none !important; width: 100% !important; }
            table { width: 100% !important; border: 2px solid #000 !important; border-collapse: collapse !important; }
            th, td { border: 1.5px solid #000 !important; padding: 8px !important; color: black !important; font-weight: bold !important; text-align: center !important; }
            .summary-text { display: block !important; border-top: 2px dashed #000; padding-top: 15px; margin-top: 15px; font-weight: 900; font-size: 18px; }
            @page { size: A4 landscape; margin: 10mm; }
        }
        
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; outline: none; }
        .due-list-item { border-bottom: 1px solid #e5e7eb; padding: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="bg-slate-900 text-white p-6 rounded-2xl mb-6 flex flex-wrap justify-between items-center gap-4 no-print shadow-2xl">
            <div>
                <h1 class="text-2xl font-black tracking-tighter">LAND ADMIN PANEL</h1>
                <p class="text-xs text-blue-400 font-bold uppercase">Workforce & Land Records</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg font-bold text-sm transition">🖨️ PRINT</button>
                <button onclick="exportJPG()" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2 rounded-lg font-bold text-sm transition">📸 SAVE JPG</button>
                <button onclick="createNewFile()" class="bg-rose-600 hover:bg-rose-700 px-5 py-2 rounded-lg font-bold text-sm transition">+ NEW</button>
            </div>
        </div>

        <div id="captureArea" class="bg-white border-2 border-gray-200 rounded-xl overflow-hidden shadow-lg print-area">
            <div class="p-6 bg-gray-50 border-b flex justify-between items-center">
                <h2 class="text-xl font-black">জমির হিসাব তালিকা</h2>
                <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-bold text-blue-700 outline-none border p-1 rounded">
            </div>

            <table class="w-full">
                <thead class="bg-gray-800 text-white text-xs uppercase tracking-widest">
                    <tr>
                        <th class="p-4 border-r border-gray-700">নাম</th>
                        <th class="p-4 border-r border-gray-700">জমি (গন্ডা)</th>
                        <th class="p-4 border-r border-gray-700">রেট</th>
                        <th class="p-4 border-r border-gray-700">মোট টাকা</th>
                        <th class="p-4 border-r border-gray-700 text-green-400">নগদ</th>
                        <th class="p-4 text-red-400">বাকি</th>
                        <th class="p-4 no-print">#</th>
                    </tr>
                </thead>
                <tbody id="mainTableBody"></tbody>
            </table>

            <div class="p-6 bg-gray-50 border-t summary-text">
                <div class="flex flex-col md:flex-row justify-between gap-4">
                    <span>মোট বিক্রি: <span id="sumTotal" class="text-blue-700">0</span></span>
                    <span>মোট নগদ: <span id="sumCash" class="text-green-700">0</span></span>
                    <span>মোট বাকি: <span id="sumDue" class="text-red-700">0</span></span>
                </div>
            </div>
        </div>

        <button onclick="addRow()" class="w-full p-4 bg-gray-200 text-gray-700 font-black hover:bg-gray-300 no-print mt-4 rounded-xl uppercase text-xs">
            + নতুন ক্রেতার এন্ট্রি করুন
        </button>

        <div class="mt-12 bg-white rounded-2xl shadow-xl border-2 border-red-100 no-print overflow-hidden">
            <div class="p-5 bg-red-50 border-b border-red-100 flex justify-between items-center">
                <h3 class="text-lg font-black text-red-800">বাকি টাকার লিস্ট (পেন্ডিং)</h3>
                <button onclick="printDueOnly()" class="text-xs bg-red-600 text-white px-4 py-1 rounded-full font-bold">প্রিন্ট লিস্ট</button>
            </div>
            <div id="dueListView" class="p-4 max-h-80 overflow-y-auto">
                </div>
        </div>
    </div>

    <div id="duePrintArea" class="hidden"></div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_v9_db')) || [];
        let curDate = localStorage.getItem('land_v9_date') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = curDate;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_v9_date', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_v9_db', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = "";
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const tot = j * r, due = tot - a;
                tS += tot; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.rt').innerText = tot.toLocaleString();
                    row.querySelector('.rd').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<div class="due-list-item">
                        <span class="font-bold text-gray-700">${curDate} - ${item.n || 'নামহীন'}</span>
                        <span class="font-black text-red-600">${due.toLocaleString()} টাকা</span>
                    </div>`;
                }
            });
            document.getElementById('sumTotal').innerText = tS.toLocaleString();
            document.getElementById('sumCash').innerText = tC.toLocaleString();
            document.getElementById('sumDue').innerText = tD.toLocaleString();
            document.getElementById('dueListView').innerHTML = dueHTML || "<p class='text-center text-gray-400'>কোনো বাকি নেই</p>";
        }

        function render() {
            const container = document.getElementById('mainTableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const tot = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = tot-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-gray-50 transition";
                tr.setAttribute('data-id', item.id);
                tr.innerHTML = `
                    <td class="p-3 border-r"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-box" placeholder="..."></td>
                    <td class="p-3 border-r"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-3 border-r"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-3 border-r bg-gray-50 font-black rt">${tot.toLocaleString()}</td>
                    <td class="p-3 border-r"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-box text-green-700" placeholder="0"></td>
                    <td class="p-3 font-black text-red-600 rd">${due.toLocaleString()}</td>
                    <td class="p-3 no-print"><button onclick="removeRow(${item.id})" class="text-gray-300 hover:text-red-500">✖</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function removeRow(id) { if(confirm('ডিলিট করবেন?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_v9_db', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('সব ডাটা মুছে যাবে। নিশ্চিত?')) { db=[]; localStorage.removeItem('land_v9_db'); addRow(); } }

        // JPG Export
        function exportJPG() {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                let link = document.createElement('a');
                link.download = `Land_Record_${curDate}.jpg`;
                link.href = canvas.toDataURL("image/jpeg");
                link.click();
            });
        }

        // Print Due List Only
        function printDueOnly() {
            let content = `<h2>বাকি টাকার লিস্ট - তারিখ: ${curDate}</h2>` + document.getElementById('dueListView').innerHTML;
            let win = window.open('', '', 'height=700,width=900');
            win.document.write('<html><head><title>Due List</title><style>body{font-family:sans-serif;padding:20px;}.due-list-item{border-bottom:1px solid #000;padding:10px;display:flex;justify-content:space-between;}</style></head><body>');
            win.document.write(content);
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }

        init();
    </script>
</body>
</html>
