<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARVESTER PRO V32</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
--bg:#07111f;
--card:#ffffff10;
--glass:#ffffff14;
--border:#ffffff20;
--primary:#3b82f6;
--secondary:#06b6d4;
--danger:#ef4444;
--success:#10b981;
--warning:#f59e0b;
--text:#ffffff;
--dark:#020617;
--radius:26px;
--shadow:0 20px 60px rgba(0,0,0,.4);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Hind Siliguri',sans-serif;
}

body{
background:
radial-gradient(circle at top left,#1d4ed8 0%,transparent 30%),
radial-gradient(circle at bottom right,#0f766e 0%,transparent 30%),
linear-gradient(135deg,#020617,#0f172a,#111827);
min-height:100vh;
overflow-x:hidden;
color:white;
}

::-webkit-scrollbar{
width:10px;
}

::-webkit-scrollbar-thumb{
background:#3b82f6;
border-radius:20px;
}

.app{
display:grid;
grid-template-columns:280px 1fr;
min-height:100vh;
}

.sidebar{
background:rgba(255,255,255,.06);
backdrop-filter:blur(20px);
border-right:1px solid rgba(255,255,255,.1);
padding:30px 20px;
position:sticky;
top:0;
height:100vh;
}

.logo{
font-size:32px;
font-weight:900;
letter-spacing:2px;
margin-bottom:40px;
}

.logo span{
color:#3b82f6;
}

.menu{
display:flex;
flex-direction:column;
gap:14px;
}

.menu button{
height:60px;
border:none;
border-radius:18px;
background:rgba(255,255,255,.06);
color:white;
font-size:16px;
font-weight:700;
transition:.35s;
cursor:pointer;
}

.menu button:hover{
transform:translateX(10px);
background:linear-gradient(90deg,#2563eb,#06b6d4);
}

.main{
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title{
font-size:42px;
font-weight:900;
line-height:1;
}

.subtitle{
color:#cbd5e1;
margin-top:8px;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:28px;
box-shadow:var(--shadow);
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
padding:26px;
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
width:160px;
height:160px;
background:rgba(255,255,255,.06);
border-radius:50%;
right:-60px;
top:-60px;
}

.card h3{
font-size:14px;
text-transform:uppercase;
letter-spacing:2px;
color:#cbd5e1;
margin-bottom:10px;
}

.card h1{
font-size:42px;
font-weight:900;
}

.grid2{
display:grid;
grid-template-columns:1.1fr .9fr;
gap:24px;
}

.panel{
padding:30px;
}

.section-title{
font-size:28px;
font-weight:900;
margin-bottom:24px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.input-box{
height:68px;
background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:0 18px;
display:flex;
align-items:center;
transition:.35s;
}

.input-box:focus-within{
transform:translateY(-2px);
border-color:#3b82f6;
box-shadow:0 10px 30px rgba(59,130,246,.2);
}

.input-box input{
width:100%;
height:100%;
background:transparent;
border:none;
outline:none;
color:white;
font-size:18px;
font-weight:700;
}

.input-box input::placeholder{
color:#94a3b8;
}

.big-btn{
margin-top:20px;
width:100%;
height:68px;
border:none;
border-radius:22px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
font-size:18px;
font-weight:900;
color:white;
cursor:pointer;
transition:.35s;
}

.big-btn:hover{
transform:translateY(-4px) scale(1.01);
box-shadow:0 20px 40px rgba(37,99,235,.4);
}

.table{
margin-top:24px;
display:flex;
flex-direction:column;
gap:12px;
max-height:700px;
overflow:auto;
padding-right:6px;
}

.row{
display:grid;
grid-template-columns:2fr 1fr 1fr 1fr 1fr auto auto;
gap:10px;
align-items:center;
padding:18px;
border-radius:20px;
background:rgba(255,255,255,.05);
transition:.3s;
}

.row:hover{
transform:scale(1.01);
background:rgba(255,255,255,.09);
}

.action-btn{
width:42px;
height:42px;
border:none;
border-radius:12px;
font-weight:900;
font-size:18px;
cursor:pointer;
}

.edit{
background:#0ea5e9;
color:white;
}

.delete{
background:#ef4444;
color:white;
}

.search{
height:60px;
width:100%;
border:none;
border-radius:20px;
padding:0 20px;
font-size:17px;
font-weight:700;
background:rgba(255,255,255,.06);
color:white;
outline:none;
margin-bottom:20px;
}

.chart-box{
height:350px;
}

.fab{
position:fixed;
right:30px;
bottom:30px;
width:80px;
height:80px;
border-radius:50%;
border:none;
background:linear-gradient(135deg,#2563eb,#06b6d4);
font-size:40px;
color:white;
font-weight:900;
box-shadow:0 20px 50px rgba(37,99,235,.5);
cursor:pointer;
z-index:999;
}

.toast{
position:fixed;
top:30px;
right:30px;
padding:18px 28px;
border-radius:20px;
background:#10b981;
font-weight:800;
transform:translateX(400px);
transition:.4s;
z-index:99999;
}

.toast.show{
transform:translateX(0);
}

.empty{
padding:50px;
text-align:center;
color:#94a3b8;
font-size:20px;
font-weight:700;
}

@media(max-width:1100px){
.grid2{
grid-template-columns:1fr;
}
}

@media(max-width:900px){
.app{
grid-template-columns:1fr;
}
.sidebar{
height:auto;
position:relative;
}
}

@media(max-width:700px){
.form-grid{
grid-template-columns:1fr;
}
.row{
font-size:12px;
padding:14px 10px;
}
.title{
font-size:30px;
}
.card h1{
font-size:30px;
}
}
</style>
</head>

<body>

<div class="toast" id="toast">Saved Successfully</div>

<div class="app">

<div class="sidebar">
<div class="logo">HARVESTER <span>PRO</span></div>

<div class="menu">
<button>Dashboard</button>
<button>Sales Records</button>
<button>Due Analytics</button>
<button>Export Reports</button>
<button>Backup Data</button>
<button>Settings</button>
</div>
</div>

<div class="main">

<div class="topbar">
<div>
<div class="title">Advanced Harvest Management</div>
<div class="subtitle">Professional Business Analytics System</div>
</div>
</div>

<div class="dashboard">
<div class="card glass">
<h3>Total Gonda</h3>
<h1 id="totalGonda">0</h1>
</div>

<div class="card glass">
<h3>Total Sales</h3>
<h1 id="totalSales">0</h1>
</div>

<div class="card glass">
<h3>Total Cash</h3>
<h1 id="totalCash">0</h1>
</div>

<div class="card glass">
<h3>Total Due</h3>
<h1 id="totalDue">0</h1>
</div>
</div>

<div class="grid2">

<div class="panel glass">
<div class="section-title">Add New Record</div>

<div class="form-grid">
<div class="input-box">
<input type="date" id="date">
</div>

<div class="input-box">
<input type="text" id="name" placeholder="Customer Name">
</div>

<div class="input-box">
<input type="number" id="gonda" placeholder="Total Gonda">
</div>

<div class="input-box">
<input type="number" id="rate" placeholder="Rate">
</div>

<div class="input-box">
<input type="number" id="cash" placeholder="Cash Paid">
</div>

<div class="input-box">
<input type="text" id="phone" placeholder="Phone Number">
</div>
</div>

<button class="big-btn" onclick="saveRecord()">SAVE RECORD</button>
</div>

<div class="panel glass">
<div class="section-title">Sales Analytics</div>
<div class="chart-box">
<canvas id="chart"></canvas>
</div>
</div>

</div>

<div class="panel glass" style="margin-top:24px;">
<div class="section-title">All Records</div>

<input type="text" class="search" id="search" placeholder="Search customer...">

<div class="table" id="table"></div>
</div>

</div>

</div>

<button class="fab" onclick="scrollToTop()">↑</button>

<script>
let database = JSON.parse(localStorage.getItem('harvester_pro_db')) || [];
let editMode = null;

const toast = document.getElementById('toast');
const table = document.getElementById('table');

function init(){
document.getElementById('date').value = new Date().toISOString().split('T')[0];
render();
initChart();
introAnimation();
}

function showToast(message){
toast.innerText = message;
toast.classList.add('show');
setTimeout(()=>{
toast.classList.remove('show');
},2500);
}

function saveRecord(){
const data = {
id: editMode || Date.now(),
date: document.getElementById('date').value,
name: document.getElementById('name').value,
gonda: Number(document.getElementById('gonda').value),
rate: Number(document.getElementById('rate').value),
cash: Number(document.getElementById('cash').value || 0),
phone: document.getElementById('phone').value
};

if(!data.name || !data.gonda || !data.rate){
showToast('Fill all required fields');
return;
}

if(editMode){
database = database.map(item=>item.id===editMode ? data : item);
showToast('Record Updated');
editMode = null;
}else{
database.unshift(data);
showToast('Record Saved');
}

saveDatabase();
clearForm();
render();
updateChart();
}

function saveDatabase(){
localStorage.setItem('harvester_pro_db',JSON.stringify(database));
}

function clearForm(){
['name','gonda','rate','cash','phone'].forEach(id=>{
document.getElementById(id).value='';
});
}

function render(){
const keyword = document.getElementById('search')?.value?.toLowerCase() || '';

const filtered = database.filter(item=>
item.name.toLowerCase().includes(keyword)
);

if(filtered.length===0){
table.innerHTML = '<div class="empty">No records found</div>';
}else{
table.innerHTML = filtered.map(item=>{
const total = item.gonda * item.rate;
const due = total - item.cash;

return `
<div class="row">
<div>
<div style="font-weight:900">${item.name}</div>
<div style="font-size:12px;color:#94a3b8">${item.phone || 'No Phone'}</div>
</div>
<div>${item.gonda}</div>
<div>৳ ${total}</div>
<div style="color:#10b981">৳ ${item.cash}</div>
<div style="color:#ef4444">৳ ${due}</div>
<button class="action-btn edit" onclick="editRecord(${item.id})">✎</button>
<button class="action-btn delete" onclick="deleteRecord(${item.id})">✕</button>
</div>
`;
}).join('');
}

calculateStats();
}

function calculateStats(){
let g = 0;
let sales = 0;
let cash = 0;
let due = 0;

database.forEach(item=>{
const total = item.gonda * item.rate;
const remaining = total - item.cash;

g += item.gonda;
sales += total;
cash += item.cash;
due += remaining;
});

document.getElementById('totalGonda').innerText = g;
document.getElementById('totalSales').innerText = '৳ ' + sales;
document.getElementById('totalCash').innerText = '৳ ' + cash;
document.getElementById('totalDue').innerText = '৳ ' + due;
}

function deleteRecord(id){
if(confirm('Delete this record?')){
database = database.filter(item=>item.id!==id);
saveDatabase();
render();
updateChart();
showToast('Record Deleted');
}
}

function editRecord(id){
const item = database.find(i=>i.id===id);
if(!item) return;

editMode = id;

document.getElementById('date').value = item.date;
document.getElementById('name').value = item.name;
document.getElementById('gonda').value = item.gonda;
document.getElementById('rate').value = item.rate;
document.getElementById('cash').value = item.cash;
document.getElementById('phone').value = item.phone;

window.scrollTo({top:0,behavior:'smooth'});
showToast('Edit Mode Enabled');
}

function scrollToTop(){
window.scrollTo({top:0,behavior:'smooth'});
}

function exportJSON(){
const blob = new Blob([
JSON.stringify(database,null,2)
],{type:'application/json'});

const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'backup.json';
a.click();
}

function exportPDF(){
html2canvas(document.body,{scale:2}).then(canvas=>{
const { jsPDF } = window.jspdf;
const pdf = new jsPDF('p','mm','a4');
const width = pdf.internal.pageSize.getWidth();
const height = canvas.height * width / canvas.width;
pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,width,height);
pdf.save('report.pdf');
});
}

function exportCSV(){
let csv = 'Name,Gonda,Rate,Cash\n';

database.forEach(item=>{
csv += `${item.name},${item.gonda},${item.rate},${item.cash}\n`;
});

const blob = new Blob([csv],{type:'text/csv'});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'report.csv';
a.click();
}

let chart;

function initChart(){
const ctx = document.getElementById('chart');

chart = new Chart(ctx,{
type:'doughnut',
data:{
labels:['Sales','Cash','Due'],
datasets:[{
data:[0,0,0],
borderWidth:0
}]
},
options:{
responsive:true,
plugins:{
legend:{
labels:{
color:'white'
}
}
}
}
});

updateChart();
}

function updateChart(){
let sales = 0;
let cash = 0;
let due = 0;

database.forEach(item=>{
const total = item.gonda * item.rate;
const remaining = total - item.cash;

sales += total;
cash += item.cash;
due += remaining;
});

chart.data.datasets[0].data = [sales,cash,due];
chart.update();
}

function introAnimation(){
gsap.from('.card',{
y:40,
opacity:0,
duration:1,
stagger:.15,
ease:'power4.out'
});

gsap.from('.panel',{
y:60,
opacity:0,
duration:1.2,
stagger:.2,
ease:'power4.out'
});
}

document.getElementById('search').addEventListener('input',render);

window.addEventListener('keydown',e=>{
if(e.ctrlKey && e.key==='s'){
e.preventDefault();
saveRecord();
}
});

init();
</script>

</body>
</html>
