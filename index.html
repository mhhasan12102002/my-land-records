<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>HARVESTER PRO TITANIUM X | Financial OS</title>
  <!-- Google Fonts + Inter + SF Pro style -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- Chart.js for mini analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- html2canvas + jspdf for exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 10% 20%, #0a0c12, #030507);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f0f2f8;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    /* animated aurora + floating blobs */
    .aurora-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
    }
    .blob {
      position: absolute;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.2), rgba(0, 119, 255, 0.05));
      filter: blur(80px);
      border-radius: 50%;
      animation: floatBlob 18s infinite alternate ease-in-out;
    }
    .blob2 { background: radial-gradient(circle, rgba(210, 0, 255, 0.2), rgba(255, 0, 150, 0.05)); width: 60vw; height: 60vw; bottom: 0; right: 0; animation-duration: 22s; }
    .blob3 { background: radial-gradient(circle, rgba(255, 180, 0, 0.15), rgba(255, 80, 0, 0.05)); width: 50vw; height: 50vw; top: 30%; left: -20%; animation-duration: 25s; }
    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      100% { transform: translate(8%, 10%) scale(1.2); opacity: 0.8; }
    }

    /* main container */
    .app-container {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 32px;
      position: relative;
      z-index: 2;
    }

    /* glass cards & luxury components */
    .glass-card {
      background: rgba(18, 22, 35, 0.55);
      backdrop-filter: blur(16px);
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.05) inset;
      transition: transform 0.25s ease, box-shadow 0.3s;
    }
    .glass-card:active { transform: scale(0.98); }

    /* header cinematic */
    .titanium-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 20px;
      padding: 8px 0;
    }
    .logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF, #5bc0ff, #b76eff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .logo p { font-size: 0.7rem; opacity: 0.7; letter-spacing: 1px; }

    /* dynamic greeting */
    .dynamic-greeting {
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 20px;
      border-radius: 40px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
      font-weight: 600;
      border-left: 3px solid #3b82f6;
    }

    /* analytics grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: rgba(12, 16, 28, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      padding: 16px 12px;
      border: 1px solid rgba(72, 187, 255, 0.2);
      transition: all 0.2s;
    }
    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
    .stat-number { font-size: 1.8rem; font-weight: 800; line-height: 1.2; margin-top: 6px; word-break: break-word; }
    .trend { font-size: 0.7rem; display: flex; align-items: center; gap: 4px; margin-top: 6px; color: #4ade80; }

    /* financial health meter */
    .health-meter {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 40px;
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(12px);
    }
    .meter-bar {
      width: 60%;
      height: 6px;
      background: #2a2e45;
      border-radius: 10px;
      overflow: hidden;
    }
    .meter-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f97316, #10b981);
      border-radius: 10px;
    }

    /* floating insight */
    .smart-insight {
      background: linear-gradient(105deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2));
      border-radius: 28px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,240,0.1);
    }

    /* add record form */
    .form-panel {
      padding: 20px;
      margin-bottom: 28px;
    }
    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .input-row input, .input-row select {
      flex: 1;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 14px 16px;
      border-radius: 28px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }
    .input-row input:focus { border-color: #3b82f6; box-shadow: 0 0 12px rgba(59,130,246,0.3); }
    .btn-primary {
      background: linear-gradient(95deg, #3b82f6, #9333ea);
      border: none;
      padding: 14px;
      border-radius: 48px;
      font-weight: 700;
      color: white;
      font-size: 1rem;
      transition: all 0.2s;
      box-shadow: 0 5px 12px rgba(59,130,246,0.3);
    }
    .btn-primary:active { transform: scale(0.97); }

    /* search & filters */
    .search-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 2;
      background: rgba(0,0,0,0.55);
      border-radius: 60px;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
    }
    .filter-btn {
      background: rgba(30,35,55,0.8);
      border-radius: 60px;
      padding: 0 16px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* Record cards - compact */
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .record-card {
      background: rgba(12, 18, 28, 0.75);
      backdrop-filter: blur(12px);
      border-radius: 1.2rem;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.2s;
    }
    .record-info h4 { font-size: 1rem; font-weight: 700; }
    .record-info p { font-size: 0.7rem; opacity: 0.7; display: flex; gap: 12px; margin-top: 4px; }
    .record-amounts { text-align: right; }
    .due-badge { font-weight: 800; color: #facc15; }
    .due-high { color: #ff4d4d; text-shadow: 0 0 4px rgba(255,0,0,0.5); }
    .action-buttons { display: flex; gap: 8px; margin-left: 12px; }
    .icon-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }

    /* export bar */
    .export-bar {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .export-btn {
      background: rgba(0,0,0,0.6);
      padding: 8px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* FAB pulse */
    .fab-add {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: linear-gradient(145deg, #3b82f6, #7e22ce);
      width: 56px;
      height: 56px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      z-index: 20;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* modal */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .modal.active { visibility: visible; opacity: 1; }
    .modal-content { width: 85%; background: #10141e; border-radius: 2rem; padding: 24px; }

    @media (max-width: 480px) {
      .stat-number { font-size: 1.3rem; }
      .record-card { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
<div class="aurora-bg"><div class="blob"></div><div class="blob blob2"></div><div class="blob blob3"></div></div>
<div class="app-container">
  <div class="titanium-header">
    <div class="logo"><h1>⚡HARVESTER<br>PRO X</h1><p>TITANIUM OS</p></div>
    <div class="health-meter" id="healthMeterWidget" style="width:auto; padding:8px 14px;">💎 HEALTH <span id="healthPercent">0</span>%</div>
  </div>
  <div class="dynamic-greeting" id="greetingMsg">🌙 Good Evening, Titan</div>
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label">TOTAL SALES</div><div class="stat-number" id="totalSales">0</div></div>
    <div class="stat-card"><div class="stat-label">CASH COLLECTED</div><div class="stat-number" id="totalCash">0</div></div>
    <div class="stat-card"><div class="stat-label">TOTAL DUE</div><div class="stat-number" id="totalDue">0</div><div class="trend" id="dueTrend">⚖️ pending</div></div>
    <div class="stat-card"><div class="stat-label">GONDA (KG)</div><div class="stat-number" id="totalGonda">0</div></div>
  </div>
  <div class="smart-insight" id="smartInsight">✨ AI Insight: Loading intelligence...</div>
  
  <!-- Form Panel (compact) -->
  <div class="glass-card form-panel">
    <div class="form-grid">
      <div class="input-row"><input type="text" id="custName" placeholder="Customer name"></div>
      <div class="input-row"><input type="number" id="gonda" placeholder="Gonda (KG)" step="any"></div>
      <div class="input-row"><input type="number" id="rate" placeholder="Rate / KG" step="any"></div>
      <div class="input-row"><input type="number" id="cash" placeholder="Cash paid" step="any"></div>
      <div class="input-row"><input type="date" id="dateRec" value="2026-05-03"></div>
      <div class="input-row"><button class="btn-primary" id="addRecordBtn">➕ ADD RECORD</button></div>
    </div>
    <div id="liveCalcPreview" style="text-align:center; margin-top: 12px; font-size:0.8rem;">💵 Total: 0 | Due: 0</div>
  </div>
  
  <!-- Search & filter -->
  <div class="search-section"><input type="text" id="searchInput" class="search-input" placeholder="🔍 search customer..."><button id="filterDueBtn" class="filter-btn">⚠️ DUE ONLY</button><button id="filterAllBtn" class="filter-btn">ALL</button></div>
  
  <div class="records-list" id="recordsContainer"></div>
  
  <div class="export-bar"><button id="exportPDFBtn" class="export-btn">📄 PDF REPORT</button><button id="exportImageBtn" class="export-btn">🖼️ HD IMAGE</button><button id="exportExcelBtn" class="export-btn">📊 EXCEL SHEET</button></div>
</div>
<div class="fab-add" id="fabAdd">+</div>

<!-- Edit Modal -->
<div id="editModal" class="modal"><div class="modal-content"><h3>✏️ Edit Record</h3><input id="editId" type="hidden"><input id="editName" placeholder="Name"><input id="editGonda" placeholder="Gonda"><input id="editRate" placeholder="Rate"><input id="editCash" placeholder="Cash"><input id="editDate" type="date"><button id="saveEditBtn" class="btn-primary" style="margin-top:16px;">SAVE</button><button id="closeModal" style="margin-top:8px;background:none;">Cancel</button></div></div>

<script>
  // ---------- DATA MODEL ----------
  let records = [];
  let editTargetId = null;
  const STORAGE_KEY = "harvester_pro_data";

  function loadData() { const stored = localStorage.getItem(STORAGE_KEY); if(stored) records = JSON.parse(stored); else records = []; renderAll(); }
  function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); renderAll(); }

  // helpers
  function calcTotal(gonda, rate) { return (parseFloat(gonda) || 0) * (parseFloat(rate) || 0); }
  function calcDue(total, cash) { return Math.max(0, total - (parseFloat(cash) || 0)); }

  // live preview
  function updateLivePreview() {
    let g = parseFloat(document.getElementById('gonda').value) || 0;
    let r = parseFloat(document.getElementById('rate').value) || 0;
    let cash = parseFloat(document.getElementById('cash').value) || 0;
    let total = g * r;
    let due = Math.max(0, total - cash);
    document.getElementById('liveCalcPreview').innerHTML = `💵 Total: ${total.toFixed(2)} | 🔻 Due: ${due.toFixed(2)}`;
    if(due>0) document.getElementById('liveCalcPreview').style.textShadow = "0 0 5px #f97316";
    else document.getElementById('liveCalcPreview').style.textShadow = "none";
  }
  document.getElementById('gonda').addEventListener('input', updateLivePreview);
  document.getElementById('rate').addEventListener('input', updateLivePreview);
  document.getElementById('cash').addEventListener('input', updateLivePreview);

  // analytics/dashboard update
  function computeStats() {
    let totalSales = 0, totalCash = 0, totalDue = 0, totalGonda = 0;
    records.forEach(r => { let t = (parseFloat(r.gonda)||0)*(parseFloat(r.rate)||0); totalSales += t; totalCash += parseFloat(r.cash)||0; totalDue += calcDue(t, r.cash); totalGonda += parseFloat(r.gonda)||0; });
    return { totalSales, totalCash, totalDue, totalGonda };
  }
  function updateDashboard() {
    let s = computeStats();
    document.getElementById('totalSales').innerText = s.totalSales.toFixed(2);
    document.getElementById('totalCash').innerText = s.totalCash.toFixed(2);
    document.getElementById('totalDue').innerText = s.totalDue.toFixed(2);
    document.getElementById('totalGonda').innerText = s.totalGonda.toFixed(1);
    let health = 100;
    if(s.totalSales>0) health = Math.min(100, (s.totalCash / s.totalSales) * 100);
    document.getElementById('healthPercent').innerText = Math.floor(health);
    let meterFill = document.querySelector('.meter-fill'); if(meterFill) meterFill.style.width = health+"%";
    // financial insight
    let insightMsg = "";
    if(s.totalDue > 5000) insightMsg = "⚠️ High due amount — prioritize collection from top debtors.";
    else if(s.totalDue > 1000) insightMsg = "📊 Moderate due. Try contacting largest due client today.";
    else insightMsg = "🏆 Excellent! Your collection efficiency is elite.";
    document.getElementById('smartInsight').innerHTML = `✨ ${insightMsg}  Best customer: ${getBestCustomer()}`;
  }
  function getBestCustomer() { if(!records.length) return "none"; let best = records.reduce((a,b)=>((parseFloat(b.cash)||0) > (parseFloat(a.cash)||0) ? b : a), records[0]); return best.customerName || "N/A"; }
  
  // render records compact
  let currentFilter = "all", searchQuery = "";
  function renderAll() {
    let filtered = records.filter(rec => {
      let matchSearch = rec.customerName?.toLowerCase().includes(searchQuery.toLowerCase()) || '';
      if(currentFilter === "due") return matchSearch && calcDue((rec.gonda*rec.rate), rec.cash) > 0;
      return matchSearch;
    });
    const container = document.getElementById('recordsContainer');
    container.innerHTML = '';
    if(filtered.length===0){ container.innerHTML='<div class="glass-card" style="padding: 30px; text-align:center;">✨ No records — add your first transaction ✨</div>'; updateDashboard(); return; }
    filtered.forEach(rec => {
      let total = (rec.gonda*rec.rate);
      let due = calcDue(total, rec.cash);
      let dueClass = due>500 ? "due-high" : "";
      const card = document.createElement('div'); card.className = "record-card";
      card.innerHTML = `<div class="record-info"><h4>${escapeHtml(rec.customerName)}</h4><p>📅 ${rec.date || "N/A"} | ⚖️ ${rec.gonda}kg | 💰 ${rec.rate}/kg</p></div>
      <div class="record-amounts"><div>💰 ${total.toFixed(2)}</div><div>💵 Cash: ${(rec.cash||0).toFixed(2)}</div><div class="due-badge ${dueClass}">🔻 Due: ${due.toFixed(2)}</div></div>
      <div class="action-buttons"><button class="icon-btn edit-btn" data-id="${rec.id}">✏️</button><button class="icon-btn del-btn" data-id="${rec.id}">🗑️</button></div>`;
      container.appendChild(card);
    });
    document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => { let id = btn.getAttribute('data-id'); openEditModal(id); }));
    document.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', (e) => { let id = btn.getAttribute('data-id'); if(confirm('Delete record?')) deleteRecordById(id); }));
    updateDashboard();
    gsap.fromTo(".record-card", {opacity:0, y:15}, {opacity:1, y:0, stagger:0.03, duration:0.4, ease:"back.out(0.6)"});
  }
  function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}
  function deleteRecordById(id){ records = records.filter(r=>r.id!=id); saveData(); renderAll(); }
  function openEditModal(id){ let rec = records.find(r=>r.id==id); if(!rec) return; editTargetId = id; document.getElementById('editName').value = rec.customerName; document.getElementById('editGonda').value = rec.gonda; document.getElementById('editRate').value = rec.rate; document.getElementById('editCash').value = rec.cash; document.getElementById('editDate').value = rec.date; document.getElementById('editModal').classList.add('active'); }
  function saveEdit(){ let newName = document.getElementById('editName').value; let newGonda = parseFloat(document.getElementById('editGonda').value); let newRate = parseFloat(document.getElementById('editRate').value); let newCash = parseFloat(document.getElementById('editCash').value); let newDate = document.getElementById('editDate').value; if(!newName) return; let idx = records.findIndex(r=>r.id==editTargetId); if(idx!==-1){ records[idx].customerName = newName; records[idx].gonda = newGonda; records[idx].rate = newRate; records[idx].cash = newCash; records[idx].date = newDate; saveData(); } document.getElementById('editModal').classList.remove('active'); renderAll(); }
  document.getElementById('saveEditBtn').onclick = saveEdit; document.getElementById('closeModal').onclick = ()=>document.getElementById('editModal').classList.remove('active');
  function addNewRecord(){ let name = document.getElementById('custName').value.trim(); let gonda = parseFloat(document.getElementById('gonda').value); let rate = parseFloat(document.getElementById('rate').value); let cash = parseFloat(document.getElementById('cash').value); let date = document.getElementById('dateRec').value; if(!name || isNaN(gonda) || isNaN(rate)){ alert("Enter valid details"); return; } let total = gonda*rate; let due = total - cash; if(due<0) due=0; let newRecord = { id: Date.now().toString(), customerName: name, gonda: gonda, rate: rate, cash: cash||0, date: date, total: total }; records.unshift(newRecord); saveData(); document.getElementById('custName').value=''; document.getElementById('gonda').value=''; document.getElementById('rate').value=''; document.getElementById('cash').value=''; updateLivePreview(); renderAll(); gsap.to(".form-panel", {scale:1.02, duration:0.2, yoyo:true, repeat:1}); }
  document.getElementById('addRecordBtn').onclick = addNewRecord; document.getElementById('fabAdd').onclick = ()=> { document.querySelector('.form-panel').scrollIntoView({behavior:'smooth'}); gsap.to(".fab-add",{scale:0.9, yoyo:true, repeat:1}); };
  document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery = e.target.value; renderAll(); });
  document.getElementById('filterDueBtn').onclick = ()=>{ currentFilter="due"; renderAll(); };
  document.getElementById('filterAllBtn').onclick = ()=>{ currentFilter="all"; renderAll(); };

  // ---------- EXPORT SYSTEMS ----------
  async function generateReportElement() { let stats = computeStats(); let div = document.createElement('div'); div.style.width='800px'; div.style.background='white'; div.style.padding='40px'; div.style.fontFamily='Inter'; div.innerHTML = `<h1 style="color:#0f172a;">⚡ HARVESTER PRO TITANIUM X</h1><h3>Financial Report | ${new Date().toLocaleString()}</h3><hr/><table style="width:100%; border-collapse:collapse;">${records.map(r=>`<tr><td>${r.customerName}</td><td>${r.gonda}kg</td><td>${r.rate}</td><td>${(r.gonda*r.rate).toFixed(2)}</td><td>${(r.cash||0).toFixed(2)}</td><td>${calcDue(r.gonda*r.rate, r.cash).toFixed(2)}</td></tr>`).join('')}</table><br/><div>Total Sales: ${stats.totalSales.toFixed(2)} | Cash: ${stats.totalCash.toFixed(2)} | Due: ${stats.totalDue.toFixed(2)}</div>`; return div; }
  document.getElementById('exportPDFBtn').onclick = async ()=>{ const { jsPDF } = window.jspdf; let element = await generateReportElement(); document.body.appendChild(element); html2canvas(element, {scale:2}).then(canvas=>{ let imgData = canvas.toDataURL('image/png'); let pdf = new jsPDF('p','mm','a4'); pdf.addImage(imgData,'PNG',10,10,190,0); pdf.save('harvester_report.pdf'); document.body.removeChild(element); }); };
  document.getElementById('exportImageBtn').onclick = async ()=>{ let element = await generateReportElement(); document.body.appendChild(element); html2canvas(element, {scale:3}).then(canvas=>{ let link = document.createElement('a'); link.download='harvester_hd.png'; link.href=canvas.toDataURL(); link.click(); document.body.removeChild(element); }); };
  document.getElementById('exportExcelBtn').onclick = ()=>{ let csvRows=[["Customer","Gonda","Rate","Total","Cash","Due"]]; records.forEach(r=>{ let total = r.gonda*r.rate; let due = total-(r.cash||0); csvRows.push([r.customerName, r.gonda, r.rate, total.toFixed(2), (r.cash||0).toFixed(2), due.toFixed(2)]); }); let csv = csvRows.map(row=>row.join(",")).join("\n"); let blob = new Blob([csv],{type:'text/csv'}); let a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='financial_sheet.csv'; a.click(); };

  // greeting dynamic
  function setGreeting(){ let hour = new Date().getHours(); let msg = hour<12 ? "🌞 Good Morning, Business King 👑" : hour<18 ? "⚡ Good Afternoon, Titan" : "🌙 Good Evening, Visionary Leader"; document.getElementById('greetingMsg').innerHTML = msg + " | Harvester OS"; }
  setGreeting(); setInterval(setGreeting, 3600000);
  // add animations and intro
  window.onload = ()=>{ loadData(); gsap.from(".glass-card", {opacity:0, y:30, duration:0.8, stagger:0.1, ease:"power3.out"}); gsap.from(".stat-card",{scale:0.9, opacity:0, duration:0.6, stagger:0.05}); };
  // financial health meter element wrapper
  const meterDiv = document.createElement('div'); meterDiv.className='meter-bar'; meterDiv.innerHTML='<div class="meter-fill" style="width:0%"></div>'; document.getElementById('healthMeterWidget').appendChild(meterDiv);
  function updateMeterFill(){ let fillDiv = document.querySelector('.meter-fill'); if(fillDiv){ let health = parseFloat(document.getElementById('healthPercent').innerText); fillDiv.style.width = health+'%'; } }
  setInterval(updateMeterFill, 200);
  updateLivePreview();
</script>
</body>
