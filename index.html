<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Land Admin v16</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        /* Mobile Premium UI */
        .admin-card { background: white; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .input-box { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; font-size: 16px; outline: none; padding: 12px 2px; color: #334155; }
        .input-box:focus { background: #f0f7ff; border-radius: 12px; color: #2563eb; }

        /* Print-Perfect System */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .admin-card { border: none !important; box-shadow: none !important; border-radius: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; border: 3px solid #000 !important; }
            th { background: #000 !important; color: #fff !important; border: 2px solid #000 !important; padding: 15px !important; font-size: 20px !important; }
            td { border: 2px solid #000 !important; padding: 12px !important; font-size: 18px !important; font-weight: 900 !important; color: black !important; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; border-bottom: 3px double #000; padding-bottom: 10px; }
            .signature-area { display: flex !important; justify-content: space-between; margin-top: 80px; }
            .sig-box { border-top: 2px solid #000; width: 200px; text-align: center; font-weight: 900; }
            @page { size: A4 landscape; margin: 10mm; }
        }
        .print-header, .signature-area { display: none; }
    </style>
</head>
<body class="p-2 md:p-10">

    <div class="max-w-6xl mx-auto">
        <div class="bg-slate-900 p-6 rounded-[35px] mb-8 flex flex-wrap justify-between items-center gap-4 no-print shadow-2xl">
            <div class="flex items-center gap-4">
                <div class="h-12 w-12 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow-lg">T</div>
                <div>
                    <h1 class="text-white text-xl font-black tracking-tight">TITAN ADMIN</h1>
                    <p class="text-blue-400 text-[9px] font-bold uppercase tracking-[4px]">Advanced Records v16</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-800 p-3 rounded-2xl hover:bg-slate-700 transition">🖨️</button>
                <button onclick="saveHighDef('png')" class="bg-blue-600 hover:bg-blue-700 px-5 py-2.5 rounded-2xl font-black text-xs text-white shadow-xl">SAVE PNG</button>
                <button onclick="saveHighDef('jpg')" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2.5 rounded-2xl font-black text-xs text-white shadow-xl">SAVE JPG</button>
            </div>
        </div>

        <div id="captureNode" class="admin-card overflow-hidden bg-white">
            <div class="print-header">
                <h1 style="font-size: 32px; font-weight: 900;">জমির হিসাব ও বিক্রয় রশিদ</h1>
                <p style="font-size: 16px;">তারিখ: <span id="pDateText"></span></p>
            </div>

            <div class="p-6 bg-slate-50 border-b flex justify-between items-center no-print">
                <h2 class="text-xl font-black text-slate-800">কাস্টমার হিসাব তালিকা</h2>
                <input type="date" id="dateSelect" onchange="setDate(this.value)" class="bg-white border rounded-xl px-4 py-2 font-bold text-blue-600 outline-none shadow-sm cursor-pointer">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center">
                    <thead class="bg-slate-900 text-white text-xs uppercase tracking-widest">
                        <tr>
                            <th class="p-5 border-r border-slate-700 min-w-[180px]">ক্রেতার নাম</th>
                            <th class="p-5 border-r border-slate-700">জমি (গন্ডা)</th>
                            <th class="p-5 border-r border-slate-700">রেট</th>
                            <th class="p-5 border-r border-slate-700 bg-blue-900/20 text-blue-400">মোট টাকা</th>
                            <th class="p-5 border-r border-slate-700 bg-emerald-900/20 text-emerald-400">নগদ</th>
                            <th class="p-5 bg-rose-900/20 text-rose-400">বাকি</th>
                            <th class="p-5 no-print">#</th>
                        </tr>
                    </thead>
                    <tbody id="tableRows" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>

            <div class="p-8 bg-slate-50 grid grid-cols-1 md:grid-cols-3 gap-6 no-print">
                <div class="bg-white p-6 rounded-[25px] border-b-4 border-blue-500 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">সর্বমোট বিক্রি</p>
                    <h3 id="dashTotal" class="text-3xl font-black text-slate-900">0</h3>
                </div>
                <div class="bg-white p-6 rounded-[25px] border-b-4 border-emerald-500 shadow-sm">
                    <p class="text-[10px] font-black text-emerald-400 uppercase mb-1">সর্বমোট নগদ</p>
                    <h3 id="dashCash" class="text-3xl font-black text-emerald-600">0</h3>
                </div>
                <div class="bg-white p-6 rounded-[25px] border-b-4 border-rose-500 shadow-sm">
                    <p class="text-[10px] font-black text-rose-400 uppercase mb-1">সর্বমোট বাকি</p>
                    <h3 id="dashDue" class="text-3xl font-black text-rose-600">0</h3>
                </div>
            </div>

            <div class="signature-area px-10 pb-10">
                <div class="sig-box">ক্রেতার স্বাক্ষর</div>
                <div class="sig-box">অ্যাডমিন স্বাক্ষর</div>
            </div>
        </div>

        <div class="mt-8 flex gap-4 no-print">
            <button onclick="addNewRow()" class="flex-1 bg-slate-900 text-white p-5 rounded-[25px] font-black tracking-widest shadow-2xl active:scale-95 transition">+ নতুন কাস্টমার এন্ট্রি</button>
            <button onclick="clearAll()" class="bg-white text-rose-500 border border-rose-100 px-8 rounded-[25px] font-bold text-xs uppercase">Reset</button>
        </div>

        <div id="dueVisualCard" class="mt-12 admin-card border-rose-100 overflow-hidden no-print">
            <div class="p-6 bg-rose-50 border-b border-rose-100 flex justify-between items-center">
                <h3 class="font-black text-rose-700 italic">পেন্ডিং কালেকশন লিস্ট</h3>
                <button onclick="saveHighDef('png', 'dueVisualCard')" class="text-[10px] font-black bg-rose-600 text-white px-4 py-1.5 rounded-full">সেভ লিস্ট</button>
            </div>
            <div id="dueListContent" class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3">
                </div>
        </div>
    </div>

    <script>
        let storage = JSON.parse(localStorage.getItem('titan_v16_data')) || [];
        let activeDate = localStorage.getItem('titan_v16_date') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateSelect').value = activeDate;
            document.getElementById('pDateText').innerText = activeDate;
            if(storage.length === 0) addNewRow(); else render();
        }

        function setDate(v) { localStorage.setItem('titan_v16_date', v); location.reload(); }

        function addNewRow() {
            storage.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function updateVal(id, key, val) {
            let idx = storage.findIndex(x => x.id === id);
            storage[idx][key] = val;
            localStorage.setItem('titan_v16_data', JSON.stringify(storage));
            calculate();
        }

        function calculate() {
            let totalSell = 0, totalCash = 0, totalDue = 0;
            let dueHTML = "";

            storage.forEach(item => {
                const sell = (parseFloat(item.j)||0) * (parseFloat(item.r)||0);
                const cash = parseFloat(item.a)||0;
                const due = sell - cash;
                
                totalSell += sell; totalCash += cash; totalDue += due;

                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.c-total').innerText = sell.toLocaleString();
                    row.querySelector('.c-due').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<div class="flex justify-between p-4 bg-rose-50/50 rounded-2xl border border-rose-100">
                        <span class="font-bold text-slate-700">${item.n || 'নতুন ক্রেতা'}</span>
                        <span class="font-black text-rose-600">${due.toLocaleString()} ৳</span>
                    </div>`;
                }
            });

            document.getElementById('dashTotal').innerText = totalSell.toLocaleString();
            document.getElementById('dashCash').innerText = totalCash.toLocaleString();
            document.getElementById('dashDue').innerText = totalDue.toLocaleString();
            document.getElementById('dueListContent').innerHTML = dueHTML || "<p class='col-span-full p-10 text-center text-slate-300 font-bold'>সব বাকি পরিশোধিত।</p>";
        }

        function render() {
            const body = document.getElementById('tableRows');
            body.innerHTML = '';
            storage.forEach(item => {
                const sell = (parseFloat(item.j)||0) * (parseFloat(item.r)||0);
                const due = sell - (parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="p-2 border-r border-slate-50"><input type="text" value="${item.n}" oninput="updateVal(${item.id},'n',this.value)" class="input-box" placeholder="..."></td>
                    <td class="p-2 border-r border-slate-50"><input type="number" value="${item.j}" oninput="updateVal(${item.id},'j',this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-2 border-r border-slate-50"><input type="number" value="${item.r}" oninput="updateVal(${item.id},'r',this.value)" class="input-box" placeholder="0"></td>
                    <td class="p-2 border-r border-slate-50 font-black text-blue-600 c-total text-lg">${sell.toLocaleString()}</td>
                    <td class="p-2 border-r border-slate-50"><input type="number" value="${item.a}" oninput="updateVal(${item.id},'a',this.value)" class="input-box text-emerald-600" placeholder="0"></td>
                    <td class="p-2 font-black text-rose-600 c-due text-lg">${due.toLocaleString()}</td>
                    <td class="p-2 no-print"><button onclick="deleteRow(${item.id})" class="text-slate-300 hover:text-rose-500 px-3">✕</button></td>
                `;
                body.appendChild(tr);
            });
            calculate();
        }

        function deleteRow(id) { if(confirm('ডিলিট করবেন?')) { storage = storage.filter(x => x.id !== id); localStorage.setItem('titan_v16_data', JSON.stringify(storage)); render(); } }
        function clearAll() { if(confirm('সব ডাটা মুছে যাবে!')) { storage = []; localStorage.removeItem('titan_v16_data'); addNewRow(); } }

        // Advanced High-Def Image Capture Fix
        function saveHighDef(format, elementId = 'captureNode') {
            const el = document.getElementById(elementId);
            html2canvas(el, {
                scale: 4, // 4X Resolution
                useCORS: true,
                backgroundColor: "#ffffff", // লিনাক্স/এন্ড্রয়েড গ্যালারিতে কালো আসা বন্ধ করবে
                windowWidth: 1200 
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Land_Report_${Date.now()}.${format}`;
                link.href = canvas.toDataURL(format === 'png' ? 'image/png' : 'image/jpeg', 1.0);
                link.click();
            });
        }

        init();
    </script>
</body>
</html>
