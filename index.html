<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Land Pro Admin - Elite Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        
        :root { --primary: #1e293b; --accent: #2563eb; }
        body { font-family: 'Hind Siliguri', sans-serif; background: #f1f5f9; -webkit-tap-highlight-color: transparent; }

        /* মোবাইল ও স্ক্রিন ভিউ */
        .card { background: white; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3); }
        .input-cell { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; outline: none; font-size: 16px; padding: 10px 2px; transition: 0.2s; }
        .input-cell:focus { background: rgba(37, 99, 235, 0.05); }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .container { max-width: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .card { border: none !important; box-shadow: none !important; border-radius: 0 !important; }
            
            table { width: 100% !important; border-collapse: collapse !important; border: 2.5px solid #000 !important; table-layout: fixed; }
            th { background: #f8fafc !important; color: black !important; border: 2px solid #000 !important; font-size: 18px !important; padding: 12px 2px !important; }
            td { border: 1.5px solid #000 !important; font-size: 16px !important; font-weight: 700 !important; color: black !important; padding: 10px 2px !important; }
            
            .print-footer { display: flex !important; justify-content: space-around; border: 2.5px solid #000; border-top: none; padding: 15px; font-weight: 900; font-size: 20px; background: #fff !important; color: black !important; }
            @page { size: A4 landscape; margin: 8mm; }
        }

        .print-footer { display: none; }
        /* মোবাইল স্ক্রলবার লুকানো */
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-2 md:p-8 pb-20">

    <div class="max-w-6xl mx-auto container">
        <div class="bg-slate-900 text-white p-5 rounded-[25px] mb-6 flex flex-wrap justify-between items-center gap-4 no-print shadow-2xl border-b-4 border-blue-600">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-black shadow-lg">L</div>
                <div>
                    <h1 class="text-lg font-black tracking-tight leading-tight">LAND ADMIN</h1>
                    <p class="text-[9px] text-blue-400 font-bold uppercase tracking-widest">Premium Records Management</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-white/10 hover:bg-white/20 p-2 rounded-xl transition no-print" title="Print">🖨️</button>
                <button onclick="exportImg('mainContent', 'png')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-xl font-bold text-xs shadow-lg">PNG</button>
                <button onclick="exportImg('mainContent', 'jpg')" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl font-bold text-xs shadow-lg">JPG</button>
                <button onclick="createNewFile()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-2 rounded-xl font-bold text-xs transition">Reset</button>
            </div>
        </div>

        <div id="mainContent" class="card overflow-hidden">
            <div class="p-5 md:p-8 bg-slate-50 border-b flex justify-between items-center">
                <h2 class="text-xl font-black text-slate-800 border-l-4 border-blue-600 pl-3">জমির হিসাব তালিকা</h2>
                <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border shadow-sm">
                    <span class="text-[10px] font-black text-slate-400 uppercase">তারিখ:</span>
                    <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-bold text-blue-600 outline-none text-sm">
                </div>
            </div>

            <div class="overflow-x-auto hide-scroll">
                <table class="w-full text-center">
                    <thead class="bg-slate-800 text-white text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4 min-w-[140px]">নাম</th>
                            <th class="p-4">জমি (গন্ডা)</th>
                            <th class="p-4">রেট</th>
                            <th class="p-4">মোট টাকা</th>
                            <th class="p-4 text-emerald-400">নগদ</th>
                            <th class="p-4 text-rose-400">বাকি</th>
                            <th class="p-4 no-print w-10">#</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="print-footer">
                <span>মোট বিক্রি: <span id="pTotal">0</span></span>
                <span>মোট নগদ: <span id="pCash">0</span></span>
                <span>মোট বাকি: <span id="pDue">0</span></span>
            </div>

            <div class="p-6 bg-slate-50 border-t no-print">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col items-center">
                        <span class="text-[10px] font-black text-slate-400 uppercase mb-1">মোট বিক্রি</span>
                        <span id="sTotal" class="text-2xl font-black text-slate-900">0</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col items-center">
                        <span class="text-[10px] font-black text-emerald-400 uppercase mb-1">মোট নগদ</span>
                        <span id="sCash" class="text-2xl font-black text-emerald-600">0</span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border shadow-sm flex flex-col items-center border-rose-100">
                        <span class="text-[10px] font-black text-rose-400 uppercase mb-1">মোট বাকি</span>
                        <span id="sDue" class="text-2xl font-black text-rose-600">0</span>
                    </div>
                </div>
            </div>
        </div>

        <button onclick="addRow()" class="w-full mt-6 p-5 bg-blue-600 text-white font-black hover:bg-blue-700 no-print rounded-2xl shadow-lg transition active:scale-95 uppercase text-xs">
            + নতুন কাস্টমার যোগ করুন
        </button>

        <div id="dueSection" class="mt-12 card border-rose-200 overflow-hidden">
            <div class="p-6 bg-rose-600 text-white flex justify-between items-center no-print">
                <h3 class="text-lg font-black italic tracking-tight">আজকের বাকি তালিকা</h3>
                <div class="flex gap-2">
                    <button onclick="printDiv('dueSection')" class="bg-white/20 hover:bg-white/40 p-2 rounded-lg text-xs">🖨️</button>
                    <button onclick="exportImg('dueSection', 'png')" class="bg-white/20 hover:bg-white/40 p-2 rounded-lg text-xs font-bold">PNG</button>
                </div>
            </div>
            <div id="dueList" class="p-4 bg-white min-h-[100px]">
                </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_app_v13')) || [];
        let date = localStorage.getItem('land_date_v13') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = date;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_date_v13', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_app_v13', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = `<div class="grid grid-cols-1 gap-2">`;
            
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const total = j * r, due = total - a;
                tS += total; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.total-cell').innerText = total.toLocaleString();
                    row.querySelector('.due-cell').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<div class="flex justify-between items-center p-4 bg-rose-50 rounded-xl border border-rose-100">
                        <span class="font-bold text-slate-700">${date} — ${item.n || 'নতুন কাস্টমার'}</span>
                        <span class="font-black text-rose-600">${due.toLocaleString()} ৳</span>
                    </div>`;
                }
            });
            dueHTML += `</div>`;
            
            // Sync UI
            ['sTotal','pTotal','sCash','pCash','sDue','pDue'].forEach((id, i) => {
                const val = [tS, tS, tC, tC, tD, tD][i];
                document.getElementById(id).innerText = val.toLocaleString();
            });
            
            document.getElementById('dueList').innerHTML = tD > 0 ? dueHTML : "<p class='p-10 text-center text-slate-300 font-bold'>সব হিসাব ক্লিয়ার!</p>";
        }

        function render() {
            const container = document.getElementById('tableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const total = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = total-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.className = "border-b transition hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="border-r"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-cell" placeholder="..."></td>
                    <td class="border-r"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-cell" placeholder="0"></td>
                    <td class="border-r"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-cell" placeholder="0"></td>
                    <td class="border-r bg-slate-50 font-black total-cell text-slate-900">${total.toLocaleString()}</td>
                    <td class="border-r"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-cell text-emerald-600" placeholder="0"></td>
                    <td class="font-black text-rose-600 due-cell">${due.toLocaleString()}</td>
                    <td class="no-print"><button onclick="deleteRow(${item.id})" class="text-slate-300 hover:text-rose-500 px-2 transition">✕</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function deleteRow(id) { if(confirm('মুছতে চান?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_app_v13', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('নতুন ফাইল শুরু করবেন? আগের সব ডাটা মুছে যাবে।')) { db=[]; localStorage.removeItem('land_app_v13'); addRow(); } }

        function exportImg(elId, format) {
            const el = document.getElementById(elId);
            html2canvas(el, { scale: 3, useCORS: true }).then(canvas => {
                let a = document.createElement('a');
                a.download = `Land_Pro_${Date.now()}.${format}`;
                a.href = canvas.toDataURL(format === 'png' ? "image/png" : "image/jpeg", 1.0);
                a.click();
            });
        }

        function printDiv(id) {
            const content = document.getElementById(id).innerHTML;
            const win = window.open('', '', 'height=700,width=900');
            win.document.write('<html><head><title>Print</title><style>body{font-family:sans-serif;padding:20px;} .no-print{display:none;} table{width:100%;border-collapse:collapse;} th,td{border:1px solid #000;padding:12px;text-align:center;}</style></head><body>');
            win.document.write(content);
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        }

        init();
    </script>
</body>
</html>
