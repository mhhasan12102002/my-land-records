<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Land Admin v14</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background: #f1f5f9; color: #334155; overflow-x: hidden; }
        
        /* Premium Card & Inputs */
        .glass-card { background: white; border-radius: 24px; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); }
        .input-cell { border: none; background: transparent; width: 100%; text-align: center; font-weight: 700; outline: none; font-size: 16px; padding: 12px 4px; }
        
        /* Mobile Optimization */
        @media (max-width: 768px) {
            .input-cell { font-size: 14px; padding: 8px 2px; }
            th { font-size: 12px !important; padding: 10px 4px !important; }
        }

        /* Ultimate Print Engine */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .print-area { border: 2.5px solid #000 !important; border-radius: 0 !important; width: 100% !important; margin: 0 !important; }
            table { width: 100% !important; border-collapse: collapse !important; border: 2px solid #000 !important; }
            th { background: #f1f5f9 !important; color: black !important; border: 2px solid #000 !important; font-size: 16px !important; padding: 10px !important; }
            td { border: 1.5px solid #000 !important; font-size: 15px !important; font-weight: 700 !important; padding: 8px !important; color: black !important; }
            .summary-footer { display: flex !important; justify-content: space-around; border-top: 2px solid #000; padding: 15px; font-weight: 900; font-size: 18px; color: black !important; }
            @page { size: A4 landscape; margin: 5mm; }
        }
        .summary-footer { display: none; }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-5xl mx-auto px-2 md:px-0 mt-4 md:mt-8">
        <div class="bg-[#0f172a] text-white p-5 rounded-[28px] mb-6 flex flex-wrap justify-between items-center gap-4 no-print shadow-xl border-b-4 border-indigo-500">
            <div>
                <h1 class="text-xl font-black tracking-tight">ELITE ADMIN <span class="text-indigo-400">v14</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Secure Land Records</p>
            </div>
            <div class="flex gap-2">
                <button onclick="window.print()" class="bg-slate-800 p-2.5 rounded-xl hover:bg-slate-700 transition">🖨️</button>
                <button onclick="exportHighRes('mainReport', 'png')" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl font-bold text-xs shadow-lg">SAVE PNG</button>
                <button onclick="exportHighRes('mainReport', 'jpg')" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-xl font-bold text-xs shadow-lg">SAVE JPG</button>
            </div>
        </div>

        <div id="mainReport" class="glass-card overflow-hidden print-area">
            <div class="p-5 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-lg font-black text-slate-800">জমির হিসাব তালিকা</h2>
                <div class="bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm">
                    <input type="date" id="dateInput" onchange="saveDate(this.value)" class="font-bold text-indigo-600 outline-none text-sm cursor-pointer">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center">
                    <thead class="bg-slate-800 text-white text-[11px] uppercase tracking-wider">
                        <tr>
                            <th class="p-4 border-r border-slate-700 min-w-[150px]">নাম</th>
                            <th class="p-4 border-r border-slate-700 w-24">জমি</th>
                            <th class="p-4 border-r border-slate-700 w-24">রেট</th>
                            <th class="p-4 border-r border-slate-700">মোট টাকা</th>
                            <th class="p-4 border-r border-slate-700 text-emerald-400">নগদ</th>
                            <th class="p-4 text-rose-400">বাকি</th>
                            <th class="p-4 no-print w-10">✕</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="bg-white"></tbody>
                </table>
            </div>

            <div class="summary-footer">
                <span>মোট বিক্রি: <span id="pTotal">0</span></span>
                <span>মোট নগদ: <span id="pCash">0</span></span>
                <span>মোট বাকি: <span id="pDue">0</span></span>
            </div>

            <div class="p-6 bg-slate-50 border-t no-print">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                        <span class="text-[10px] font-black text-slate-400 uppercase">মোট বিক্রি</span>
                        <span id="sTotal" class="text-xl font-black text-slate-900">0</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                        <span class="text-[10px] font-black text-emerald-400 uppercase">মোট নগদ</span>
                        <span id="sCash" class="text-xl font-black text-emerald-600">0</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-rose-100 flex justify-between items-center shadow-sm">
                        <span class="text-[10px] font-black text-rose-400 uppercase">মোট বাকি</span>
                        <span id="sDue" class="text-xl font-black text-rose-600">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-3 no-print">
            <button onclick="addRow()" class="flex-1 mt-4 p-4 bg-indigo-600 text-white font-black hover:bg-indigo-700 rounded-2xl shadow-lg transition active:scale-95 uppercase text-xs">
                + নতুন এন্ট্রি যোগ করুন
            </button>
            <button onclick="createNewFile()" class="mt-4 p-4 bg-rose-50 text-rose-600 font-bold rounded-2xl border border-rose-100 uppercase text-[10px]">
                Reset
            </button>
        </div>

        <div id="dueReport" class="mt-10 glass-card overflow-hidden border-2 border-rose-50">
            <div class="p-5 bg-rose-600 text-white flex justify-between items-center no-print">
                <h3 class="text-base font-black italic">আজকের বাকি তালিকা</h3>
                <div class="flex gap-2">
                    <button onclick="exportHighRes('dueReport', 'png')" class="bg-white/20 p-1.5 rounded-lg text-[10px] font-bold">SAVE PNG</button>
                </div>
            </div>
            <div id="dueList" class="p-2 bg-white">
                </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_elite_v14')) || [];
        let date = localStorage.getItem('land_date_v14') || new Date().toISOString().split('T')[0];

        function init() {
            document.getElementById('dateInput').value = date;
            if(db.length === 0) addRow(); else render();
        }

        function saveDate(v) { localStorage.setItem('land_date_v14', v); render(); }

        function addRow() {
            db.push({ id: Date.now(), n: '', j: '', r: '', a: '' });
            render();
        }

        function update(id, f, v) {
            let i = db.findIndex(x => x.id === id);
            db[i][f] = v;
            localStorage.setItem('land_elite_v14', JSON.stringify(db));
            calc();
        }

        function calc() {
            let tS = 0, tC = 0, tD = 0;
            let dueHTML = `<table class="w-full text-sm font-bold text-center border-collapse">
                <tr class="bg-rose-50 text-rose-800"><th class="p-3 border">নাম</th><th class="p-3 border">বাকি টাকা</th></tr>`;
            
            db.forEach(item => {
                const j = parseFloat(item.j) || 0, r = parseFloat(item.r) || 0, a = parseFloat(item.a) || 0;
                const total = j * r, due = total - a;
                tS += total; tC += a; tD += due;
                
                const row = document.querySelector(`[data-id="${item.id}"]`);
                if(row) {
                    row.querySelector('.total-cell').innerText = total.toLocaleString();
                    row.querySelector('.due-cell').innerText = due.toLocaleString();
                }

                if(due > 0) {
                    dueHTML += `<tr><td class="p-3 border text-slate-700">${item.n || 'নতুন কাস্টমার'}</td>
                    <td class="p-3 border text-rose-600 font-black">${due.toLocaleString()} ৳</td></tr>`;
                }
            });
            dueHTML += `</table>`;
            
            ['sTotal','pTotal','sCash','pCash','sDue','pDue'].forEach((id, i) => {
                const val = [tS, tS, tC, tC, tD, tD][i];
                document.getElementById(id).innerText = val.toLocaleString();
            });
            
            document.getElementById('dueList').innerHTML = tD > 0 ? dueHTML : "<p class='p-8 text-center text-slate-300 font-bold'>সব পরিশোধিত</p>";
        }

        function render() {
            const container = document.getElementById('tableBody');
            container.innerHTML = '';
            db.forEach(item => {
                const total = (parseFloat(item.j)||0)*(parseFloat(item.r)||0), due = total-(parseFloat(item.a)||0);
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', item.id);
                tr.className = "border-b border-slate-100 hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="border-r border-slate-100"><input type="text" value="${item.n}" oninput="update(${item.id}, 'n', this.value)" class="input-cell" placeholder="..."></td>
                    <td class="border-r border-slate-100"><input type="number" value="${item.j}" oninput="update(${item.id}, 'j', this.value)" class="input-cell" placeholder="0"></td>
                    <td class="border-r border-slate-100"><input type="number" value="${item.r}" oninput="update(${item.id}, 'r', this.value)" class="input-cell" placeholder="0"></td>
                    <td class="border-r border-slate-100 font-black total-cell text-indigo-900">${total.toLocaleString()}</td>
                    <td class="border-r border-slate-100"><input type="number" value="${item.a}" oninput="update(${item.id}, 'a', this.value)" class="input-cell text-emerald-600" placeholder="0"></td>
                    <td class="font-black text-rose-600 due-cell">${due.toLocaleString()}</td>
                    <td class="no-print"><button onclick="deleteRow(${item.id})" class="text-slate-300 hover:text-rose-500 transition">✕</button></td>
                `;
                container.appendChild(tr);
            });
            calc();
        }

        function deleteRow(id) { if(confirm('মুছতে চান?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_elite_v14', JSON.stringify(db)); render(); } }
        function createNewFile() { if(confirm('আগের সব ডাটা মুছে যাবে। নিশ্চিত?')) { db=[]; localStorage.removeItem('land_elite_v14'); addRow(); } }

        // High Resolution Export Fix
        function exportHighRes(elId, format) {
            const el = document.getElementById(elId);
            // ইমেজ সেভ করার সময় রেজোলিউশন বাড়ানোর জন্য scale: 3 ব্যবহার করা হয়েছে
            html2canvas(el, { 
                scale: 3, 
                backgroundColor: "#ffffff",
                logging: false,
                useCORS: true
            }).then(canvas => {
                let a = document.createElement('a');
                a.download = `Land_Record_${Date.now()}.${format}`;
                a.href = canvas.toDataURL(format === 'png' ? "image/png" : "image/jpeg", 1.0);
                a.click();
            });
        }

        init();
    </script>
</body>
</html>
