<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harvester Elite v22.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1600&q=80');
            background-size: cover; background-attachment: fixed;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        /* v22 প্রিমিয়াম রাউন্ড শেপ ডিজাইন */
        .ui-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 35px; 
            padding: 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            max-width: 800px; margin: auto;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .input-row {
            display: flex; align-items: center;
            background: white;
            border-radius: 18px; 
            margin-bottom: 12px; padding: 6px 18px;
            border: 1px solid #cbd5e1;
            transition: all 0.3s ease;
        }
        .input-row:focus-within { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59,130,246,0.2); }

        .label-text { width: 100px; font-weight: 700; color: #334155; font-size: 16px; }
        .data-input { flex: 1; border: none; padding: 12px; font-size: 18px; font-weight: 700; outline: none; background: transparent; color: #1e293b; }

        /* টেবিল স্টাইল */
        .excel-table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
        .excel-table th { background: #0f172a; color: white; padding: 12px; font-size: 14px; border: 1px solid #334155; }
        .excel-table td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; color: #1e293b; font-weight: 600; }

        .table-edit { width: 100%; border: none; background: transparent; text-align: center; font-weight: 700; outline: none; color: #1e293b; }
        .table-edit:focus { background: #f8fafc; }

        /* পিডিএফ এক্সপোর্ট মোড (Sharp Excel Style) */
        .pdf-mode { padding: 20px !important; }
        .pdf-mode table { border: 2px solid black !important; }
        .pdf-mode th, .pdf-mode td { border: 1px solid black !important; color: black !important; border-radius: 0 !important; }
        .pdf-title { display: none; font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; }
        .pdf-summary { display: none; border: 1px solid black; border-top: none; padding: 10px; font-weight: bold; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="ui-card">
        <div class="flex justify-between items-center mb-10 no-print border-b border-slate-200 pb-5">
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tighter">HARVESTER <span class="text-blue-600">v22.2</span></h1>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Premium Elite Edition</p>
            </div>
            <div class="flex gap-2">
                <button onclick="savePDF()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 transition">Save PDF</button>
                <button onclick="saveImage()" class="bg-slate-800 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-slate-900 transition">Save PNG</button>
            </div>
        </div>

        <div class="no-print space-y-2">
            <div class="input-row"><span class="label-text">তারিখ :</span><input type="date" id="iDate" class="data-input"></div>
            <div class="input-row"><span class="label-text">নাম :</span><input type="text" id="iName" class="data-input" placeholder="ক্রেতার নাম"></div>
            <div class="grid grid-cols-2 gap-3">
                <div class="input-row"><span class="label-text">গন্ডা :</span><input type="number" id="iGonda" class="data-input" placeholder="0"></div>
                <div class="input-row"><span class="label-text">রেট :</span><input type="number" id="iRate" class="data-input" placeholder="0"></div>
            </div>
            <div class="input-row"><span class="label-text">নগদ :</span><input type="number" id="iCash" class="data-input text-emerald-600" placeholder="0"></div>
            
            <button onclick="addEntry()" class="w-full bg-slate-900 text-white py-5 rounded-[22px] text-2xl font-black shadow-2xl active:scale-95 transition-all mt-4 hover:bg-blue-600">
                + SAVE TO DATABASE
            </button>
        </div>

        <div id="exportArea" class="mt-8 bg-white p-2 rounded-xl overflow-hidden shadow-inner">
            <div class="pdf-title" id="pdfHeader">জমির হিসাব বিবরণী</div>
            <table class="excel-table">
                <thead>
                    <tr>
                        <th>ক্রেতার নাম</th>
                        <th>গন্ডা</th>
                        <th>রেট</th>
                        <th>মোট টাকা</th>
                        <th>নগদ</th>
                        <th>বাকি টাকা</th>
                        <th class="no-print">✕</th>
                    </tr>
                </thead>
                <tbody id="tableData"></tbody>
            </table>
            <div class="pdf-summary" id="pdfSum">
                <div id="ps1"></div><div id="ps2"></div><div id="ps3"></div><div id="ps4"></div>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-10 no-print">
            <div class="bg-white p-5 rounded-3xl text-center border-b-4 border-slate-400 shadow-xl">
                <p class="text-[10px] font-bold text-slate-400 uppercase">মোট গন্ডা</p>
                <h4 id="sG" class="text-xl font-black text-slate-800">0</h4>
            </div>
            <div class="bg-white p-5 rounded-3xl text-center border-b-4 border-blue-500 shadow-xl">
                <p class="text-[10px] font-bold text-slate-400 uppercase">মোট বিক্রি</p>
                <h4 id="s1" class="text-xl font-black text-blue-600">0</h4>
            </div>
            <div class="bg-white p-5 rounded-3xl text-center border-b-4 border-emerald-500 shadow-xl">
                <p class="text-[10px] font-bold text-slate-400 uppercase">মোট নগদ</p>
                <h4 id="s2" class="text-xl font-black text-emerald-600">0</h4>
            </div>
            <div class="bg-white p-5 rounded-3xl text-center border-b-4 border-rose-500 shadow-xl">
                <p class="text-[10px] font-bold text-slate-400 uppercase">মোট বাকি</p>
                <h4 id="s3" class="text-xl font-black text-rose-600">0</h4>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('land_v22_elite_db')) || [];

        function init() {
            const d = localStorage.getItem('v22_e_date') || new Date().toISOString().split('T')[0];
            document.getElementById('iDate').value = d;
            render();
        }

        function addEntry() {
            const n = document.getElementById('iName').value;
            const g = document.getElementById('iGonda').value;
            const r = document.getElementById('iRate').value;
            const c = document.getElementById('iCash').value;

            if(!n || !g || !r) return alert("সব ঘর পূরণ করুন!");

            db.push({ id: Date.now(), n, g, r, c });
            localStorage.setItem('land_v22_elite_db', JSON.stringify(db));
            ['iName','iGonda','iRate','iCash'].forEach(id => document.getElementById(id).value = '');
            render();
        }

        function update(id, key, val) {
            const idx = db.findIndex(x => x.id === id);
            db[idx][key] = val;
            localStorage.setItem('land_v22_elite_db', JSON.stringify(db));
            render();
        }

        function render() {
            const body = document.getElementById('tableData');
            body.innerHTML = '';
            let mG=0, mT=0, mC=0, mD=0;

            db.forEach(item => {
                const total = item.g * item.r;
                const cash = parseFloat(item.c) || 0;
                const due = total - cash;
                mG += parseFloat(item.g); mT += total; mC += cash; mD += due;

                body.innerHTML += `
                    <tr>
                        <td><input class="table-edit" type="text" value="${item.n}" onchange="update(${item.id}, 'n', this.value)"></td>
                        <td><input class="table-edit" type="number" value="${item.g}" onchange="update(${item.id}, 'g', this.value)"></td>
                        <td><input class="table-edit" type="number" value="${item.r}" onchange="update(${item.id}, 'r', this.value)"></td>
                        <td>${total.toLocaleString()}</td>
                        <td><input class="table-edit text-emerald-600" type="number" value="${item.c}" onchange="update(${item.id}, 'c', this.value)"></td>
                        <td class="text-rose-600">${due.toLocaleString()}</td>
                        <td class="no-print"><button onclick="del(${item.id})" class="text-slate-300 hover:text-red-500 font-bold">✕</button></td>
                    </tr>
                `;
            });

            document.getElementById('sG').innerText = mG;
            document.getElementById('s1').innerText = mT.toLocaleString();
            document.getElementById('s2').innerText = mC.toLocaleString();
            document.getElementById('s3').innerText = mD.toLocaleString();
            
            document.getElementById('ps1').innerText = "গন্ডা: " + mG;
            document.getElementById('ps2').innerText = "বিক্রি: " + mT.toLocaleString();
            document.getElementById('ps3').innerText = "নগদ: " + mC.toLocaleString();
            document.getElementById('ps4').innerText = "বাকি: " + mD.toLocaleString();
        }

        function del(id) { if(confirm('ডিলিট?')) { db = db.filter(x => x.id !== id); localStorage.setItem('land_v22_elite_db', JSON.stringify(db)); render(); } }

        function savePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            const target = document.getElementById('exportArea');
            
            // পিডিএফ এক্সপোর্ট মোড অ্যাক্টিভ করা
            document.getElementById('pdfHeader').style.display = 'block';
            document.getElementById('pdfSum').style.display = 'flex';
            target.classList.add('pdf-mode');

            html2canvas(target, { scale: 3 }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const imgProps = doc.getImageProperties(imgData);
                const pdfWidth = doc.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                doc.save(`Land_Report_${Date.now()}.pdf`);
                
                // মোড রিসেট করা
                document.getElementById('pdfHeader').style.display = 'none';
                document.getElementById('pdfSum').style.display = 'none';
                target.classList.remove('pdf-mode');
            });
        }

        function saveImage() {
            const target = document.getElementById('exportArea');
            target.classList.add('pdf-mode');
            html2canvas(target, { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Report_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
                target.classList.remove('pdf-mode');
            });
        }

        init();
    </script>
</body>
</html>
