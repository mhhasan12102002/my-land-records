<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Harvester Pro | Next-Gen Business Suite</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --accent: #10b981;
            --danger: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- UI Components --- */
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--primary); }
        .header p { opacity: 0.6; font-size: 12px; }

        /* Dashboard */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--glass);
        }

        .stat-card small { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card h2 { font-size: 18px; margin-top: 5px; }
        .stat-total { grid-column: span 2; background: linear-gradient(135deg, var(--primary), #4f46e5); }

        /* Search & Filter */
        .search-bar {
            background: var(--glass);
            border: 1px solid var(--glass);
            padding: 12px 20px;
            border-radius: 30px;
            color: white;
            width: 100%;
            margin-bottom: 20px;
            outline: none;
        }

        /* Record List */
        .record-container { margin-bottom: 100px; }
        .record-card {
            background: var(--card);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            animation: fadeIn 0.5s ease;
        }
        .record-info h3 { font-size: 16px; }
        .record-info p { font-size: 12px; opacity: 0.6; }
        .record-math { text-align: right; }
        .due-tag { color: var(--danger); font-weight: 600; }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            z-index: 100;
        }

        /* Modal Sheet */
        .modal {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 30px 30px 0 0;
            transition: 0.5s;
            z-index: 200;
        }
        .modal.active { bottom: 0; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; opacity: 0.7; }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass);
            border-radius: 10px;
            color: white;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-export { background: var(--glass); color: white; font-size: 12px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header">
        <p>Welcome Back,</p>
        <h1>Harvester Pro <span style="font-weight: 300;">V3.3</span></h1>
    </div>

    <div class="stats-grid">
        <div class="stat-card stat-total">
            <small>Total Sales</small>
            <h2 id="dash-sales">৳ 0</h2>
        </div>
        <div class="stat-card">
            <small>Cash Received</small>
            <h2 id="dash-cash" style="color: var(--accent);">৳ 0</h2>
        </div>
        <div class="stat-card">
            <small>Total Due</small>
            <h2 id="dash-due" style="color: var(--danger);">৳ 0</h2>
        </div>
    </div>

    <input type="text" class="search-bar" placeholder="Search customer..." oninput="searchRecords(this.value)">

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button class="btn-export" onclick="exportExcel()">📊 Excel</button>
        <button class="btn-export" onclick="exportPDF()">📄 PDF</button>
    </div>

    <div class="record-container" id="recordList">
        <!-- Records appear here -->
    </div>

    <div class="fab" onclick="toggleModal(true)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>

    <!-- Add Record Modal -->
    <div class="modal" id="addModal">
        <h2 style="margin-bottom: 20px;">Add Entry</h2>
        <div class="input-group">
            <label>Customer Name</label>
            <input type="text" id="custName" placeholder="e.g. Rahim Ali">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-group">
                <label>Gonda</label>
                <input type="number" id="gonda" oninput="calcTotal()">
            </div>
            <div class="input-group">
                <label>Rate</label>
                <input type="number" id="rate" oninput="calcTotal()">
            </div>
        </div>
        <div class="input-group">
            <label>Total Amount</label>
            <input type="number" id="total" readonly>
        </div>
        <div class="input-group">
            <label>Cash Payment</label>
            <input type="number" id="cash" oninput="calcTotal()">
        </div>
        <button class="btn btn-primary" onclick="saveRecord()">Save Record</button>
        <button class="btn" style="background: transparent; color: #94a3b8;" onclick="toggleModal(false)">Cancel</button>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('harvester_data')) || [];

        function toggleModal(show) {
            document.getElementById('addModal').classList.toggle('active', show);
        }

        function calcTotal() {
            const g = document.getElementById('gonda').value || 0;
            const r = document.getElementById('rate').value || 0;
            document.getElementById('total').value = g * r;
        }

        function saveRecord() {
            const name = document.getElementById('custName').value;
            const gonda = parseFloat(document.getElementById('gonda').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const total = gonda * rate;
            const cash = parseFloat(document.getElementById('cash').value) || 0;
            const due = total - cash;

            if(!name || !gonda) return alert("Fill required fields");

            const record = { id: Date.now(), name, gonda, rate, total, cash, due, date: new Date().toLocaleDateString() };
            records.push(record);
            updateUI();
            toggleModal(false);
            clearInputs();
        }

        function updateUI() {
            localStorage.setItem('harvester_data', JSON.stringify(records));
            const list = document.getElementById('recordList');
            list.innerHTML = "";
            
            let tSales = 0, tCash = 0, tDue = 0;

            records.forEach(res => {
                tSales += res.total;
                tCash += res.cash;
                tDue += res.due;

                list.innerHTML += `
                    <div class="record-card">
                        <div class="record-info">
                            <h3>${res.name}</h3>
                            <p>${res.gonda} Gonda × ${res.rate}</p>
                        </div>
                        <div class="record-math">
                            <div>৳ ${res.total}</div>
                            <div class="due-tag">${res.due > 0 ? 'Due: ৳' + res.due : 'Paid'}</div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('dash-sales').innerText = '৳ ' + tSales;
            document.getElementById('dash-cash').innerText = '৳ ' + tCash;
            document.getElementById('dash-due').innerText = '৳ ' + tDue;
        }

        function searchRecords(query) {
            const filtered = records.filter(r => r.name.toLowerCase().includes(query.toLowerCase()));
            // Similar to updateUI but for filtered list
        }

        function clearInputs() {
            ['custName', 'gonda', 'rate', 'total', 'cash'].forEach(id => document.getElementById(id).value = '');
        }

        // Export Functionality
        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(records);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Financial_Report");
            XLSX.writeFile(wb, "Harvester_Pro_Report.xlsx");
        }

        async function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("HARVESTER PRO FINANCIAL REPORT", 10, 10);
            let y = 20;
            records.forEach(r => {
                doc.text(`${r.name} - Total: ${r.total} - Due: ${r.due}`, 10, y);
                y += 10;
            });
            doc.save("Report.pdf");
        }

        // Initial Load
        window.onload = () => {
            updateUI();
            gsap.from(".stat-card", { duration: 0.8, y: 30, opacity: 0, stagger: 0.2, ease: "back.out" });
        };
    </script>
</body>
</html>
